      after: after,
      every: every,
      nextFrame: nextFrame,
      frameLoop: frameLoop,
      observeResize: observeResize,
      subscribe: subscribe,
      subscribeSave: subscribeSave,
      subscribeWindows: subscribeWindows,
      cleanup: function (fn) { if (typeof fn === 'function') track(fn); },
      setTitle: function (title) { updateTitle(win, title); },
      /* 记住应用自己正在看什么（选了哪张纸、停在哪个月、哪个分区）。
         存在窗口 params 里，跟着 desktop 布局一起落盘，所以切换 DSH 面板回来还在。
         layout 作用域不算"数据改动"，不会推高 schema 或触发整包数据重算。 */
      setParams: function (params) {
        var next = {};
        if (params && typeof params === 'object') {
          if (params.docId && typeof params.docId === 'string') next.docId = params.docId;
          if (params.folderId && typeof params.folderId === 'string') next.folderId = params.folderId;
          if (params.section && typeof params.section === 'string') next.section = params.section;
          if (params.view && typeof params.view === 'string') next.view = params.view;
        }
        var same = JSON.stringify(next) === JSON.stringify(win.params || {});
        win.params = next;
        if (!same) scheduleLayoutSave();
      },
      getParams: function () { return U.clone(win.params); },
      openApp: function (appId, params) { return open(appId, params); },
      close: function () { closeWindow(win.id); },
      minimize: function () { minimize(win.id); },
      focus: function () { focusWindow(win.id); },
      toast: P.ui.toast,
      confirm: P.ui.confirm,
      prompt: P.ui.prompt,
      dialog: P.ui.dialog,
      saveNow: function () { return P.storage.flush(); },
      download: function (filename, content, mime) { P.downloadFile(filename, content, mime); },
      width: function () { return win.bodyEl.clientWidth; }
    };
    win.ctx = ctx;
    win._cleanups = cleanups;
    win._destroyContext = function () {
      if (destroyed) return;
      destroyed = true;
      cleanups.slice().forEach(function (fn) {
        try { fn(); } catch (err) { if (window.console) console.error(err); }
      });
      cleanups.length = 0;
    };
    return ctx;
  }

  function windowMarkup(app, id) {
    return '<header class="window__titlebar" data-drag-handle>' +
      '<span class="window__grip" aria-hidden="true"><i></i><i></i><i></i></span>' +
      '<span class="window__app-icon" aria-hidden="true">' + P.appIcon(app.id) + '</span>' +
      '<span class="window__heading"><span class="window__app-name">' + U.escapeHTML(app.english || app.name) + '</span>' +
      '<span class="window__title" id="win-title-' + id + '">' + U.escapeHTML(app.name) + '</span></span>' +
      '</header>' +
      '<div class="window__body"></div>' +
      '<div class="win-resize win-resize--n" data-resize="n" aria-hidden="true"></div>' +
      '<div class="win-resize win-resize--s" data-resize="s" aria-hidden="true"></div>' +
      '<div class="win-resize win-resize--e" data-resize="e" aria-hidden="true"></div>' +
      '<div class="win-resize win-resize--w" data-resize="w" aria-hidden="true"></div>' +
      '<div class="win-resize win-resize--ne" data-resize="ne" aria-hidden="true"></div>' +
      '<div class="win-resize win-resize--nw" data-resize="nw" aria-hidden="true"></div>' +
      '<div class="win-resize win-resize--se" data-resize="se" aria-hidden="true"></div>' +
      '<div class="win-resize win-resize--sw" data-resize="sw" aria-hidden="true"></div>';
  }

  function bindWindowEvents(win) {
    win.el.addEventListener('pointerdown', function () {
      if (!win.closing) focusWindow(win.id);
    }, true);
    win.el.addEventListener('focusin', function () {
      if (!win.closing && focusedId !== win.id) focusWindow(win.id);
    });

    var titlebar = win.el.querySelector('.window__titlebar');
    titlebar.addEventListener('pointerdown', function (event) {
      if (event.button !== 0 && event.pointerType === 'mouse') return;
      if (event.target.closest('button')) return;
      beginDrag(event, win);
    });
    win.el.querySelectorAll('.win-resize').forEach(function (handle) {
      handle.addEventListener('pointerdown', function (event) {
        beginResize(event, win, handle.getAttribute('data-resize'));
      });
    });
  }

  var dragCleanup = null;

  function cancelPointerJob() {
    if (dragCleanup) {
      try { dragCleanup(); } catch (err) { /* ignore */ }
      dragCleanup = null;
    }
    activePointerJob = null;
  }

  function beginDrag(event, win) {
    if (isMobile()) return;
    if (win.minimized || win.closing) return;
    if (event.button !== 0 && event.pointerType === 'mouse') return;
    event.preventDefault();
    cancelPointerJob();
    focusWindow(win.id);
    var stage = stageEl();
    var area = workArea();
    var startX = event.clientX;
    var startY = event.clientY;
    var wasMaximized = win.maximized;
    var startBounds = U.clone(win.bounds);
    var startStage = stage.getBoundingClientRect();
    var dragging = false;
    var body = document.body;
    body.classList.add('is-window-dragging');
    win.el.classList.add('is-dragging');

    function pointerPoint(ev) {
      return { x: ev.clientX - startStage.left, y: ev.clientY - startStage.top };
    }

    function prepareForMove(ev) {
      if (!wasMaximized) return;
      wasMaximized = false;
      var restore = win.restoreBounds ? U.clone(win.restoreBounds) : startBounds;
      win.maximized = false;
      win.el.classList.remove('is-maximized');
      updateMaxControl(win);
      var w = Math.min(restore.w, area.w);
      var h = Math.min(restore.h, area.h);
      var p = pointerPoint(ev);
      var b = clampBounds({ x: p.x - w / 2, y: p.y - 18, w: w, h: h }, area);
      applyBounds(win, b);
      startBounds = U.clone(b);
      startX = ev.clientX;
      startY = ev.clientY;
      startStage = stage.getBoundingClientRect();
    }

    function onMove(ev) {
      if (ev.pointerId !== undefined && event.pointerId !== undefined && ev.pointerId !== event.pointerId) return;
      var dx = ev.clientX - startX;
      var dy = ev.clientY - startY;
      if (!dragging) {
        if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
        if (wasMaximized) prepareForMove(ev);
        dragging = true;
      }
      var next = clampBounds({
        x: startBounds.x + (ev.clientX - startX),
        y: startBounds.y + (ev.clientY - startY),
        w: startBounds.w,
        h: startBounds.h
      }, area);
      applyBounds(win, next);
      updateFocusStatus();
      scheduleLayoutSave();
    }

    function finish(ev) {
      document.removeEventListener('pointermove', onMove, true);
      document.removeEventListener('pointerup', finish, true);
      document.removeEventListener('pointercancel', finish, true);
      body.classList.remove('is-window-dragging');
      win.el.classList.remove('is-dragging');
      dragCleanup = null;
      activePointerJob = null;
      if (dragging) {
        if (win.maximized) win.bounds = maximizeBounds(win);
        else win.preferredBounds = U.clone(win.bounds);
        scheduleLayoutSave();
        notify('move');
      }
    }

    document.addEventListener('pointermove', onMove, true);
    document.addEventListener('pointerup', finish, true);
    document.addEventListener('pointercancel', finish, true);
    dragCleanup = function () {
      document.removeEventListener('pointermove', onMove, true);
      document.removeEventListener('pointerup', finish, true);
      document.removeEventListener('pointercancel', finish, true);
      body.classList.remove('is-window-dragging');
      win.el.classList.remove('is-dragging');
    };
    activePointerJob = dragCleanup;
  }

  function beginResize(event, win, direction) {
    if (isMobile() || win.maximized || win.closing || win.minimized) return;
    if (event.button !== 0 && event.pointerType === 'mouse') return;
    event.preventDefault();
    event.stopPropagation();
    cancelPointerJob();
    focusWindow(win.id);
    var area = workArea();
    var start = {
      x: win.bounds.x,
      y: win.bounds.y,
      w: win.bounds.w,
      h: win.bounds.h,
      px: event.clientX,
      py: event.clientY
    };
    var app = getApp(win.appId);
    var minW = Math.min(app.minSize.w, area.w);
    var minH = Math.min(app.minSize.h, area.h);
    var body = document.body;
    body.classList.add('is-window-resizing');
    win.el.classList.add('is-resizing');

    function onMove(ev) {
      var dx = ev.clientX - start.px;
      var dy = ev.clientY - start.py;
      var w = start.w;
      var h = start.h;
      if (direction.indexOf('e') !== -1) w = start.w + dx;
      if (direction.indexOf('w') !== -1) w = start.w - dx;
      if (direction.indexOf('s') !== -1) h = start.h + dy;
      if (direction.indexOf('n') !== -1) h = start.h - dy;
      w = U.clamp(w, minW, area.w);
      h = U.clamp(h, minH, area.h);
      var x = start.x;
      var y = start.y;
      if (direction.indexOf('w') !== -1) x = start.x + (start.w - w);
      if (direction.indexOf('n') !== -1) y = start.y + (start.h - h);
      x = U.clamp(x, area.x, area.x + area.w - w);
      y = U.clamp(y, area.y, area.y + area.h - h);
      applyBounds(win, { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) });
      updateFocusStatus();
    }

    function finish() {
      document.removeEventListener('pointermove', onMove, true);
      document.removeEventListener('pointerup', finish, true);
      document.removeEventListener('pointercancel', finish, true);
      body.classList.remove('is-window-resizing');
      win.el.classList.remove('is-resizing');
      win.preferredBounds = U.clone(win.bounds);
      dragCleanup = null;
      scheduleLayoutSave();
      notify('resize');
    }

    document.addEventListener('pointermove', onMove, true);
    document.addEventListener('pointerup', finish, true);
    document.addEventListener('pointercancel', finish, true);
    dragCleanup = function () {
      document.removeEventListener('pointermove', onMove, true);
      document.removeEventListener('pointerup', finish, true);
      document.removeEventListener('pointercancel', finish, true);
      body.classList.remove('is-window-resizing');
      win.el.classList.remove('is-resizing');
    };
    activePointerJob = dragCleanup;
  }

  function createWindow(app, params, options) {
    var opts = options || {};
    var id = 'win_' + (++winSeq).toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    var win = {
      id: id,
      appId: app.id,
      app: app,
      title: app.name,
      titleEl: null,
      bodyEl: null,
      maxButton: null,
      el: null,
      bounds: { x: 0, y: 0, w: 600, h: 400 },
      preferredBounds: null,
      restoreBounds: null,
      maximized: false,
      minimized: false,
      closing: false,
      focused: false,
      z: 0,
      params: {},
      ctx: null,
      controller: null,
      createdAt: Date.now()
    };
    if (params && typeof params === 'object') {
      var incoming = {};
      if (typeof params.docId === 'string') incoming.docId = params.docId;
      if (typeof params.folderId === 'string') incoming.folderId = params.folderId;
      if (typeof params.section === 'string') incoming.section = params.section;
      if (typeof params.view === 'string') incoming.view = params.view;
      win.params = incoming;
    }
    var el = document.createElement('section');
    el.className = 'window';
    if (opts.noAnimation) el.classList.add('is-restored');
    else el.classList.add('is-opening');
    el.dataset.windowId = id;
    el.dataset.app = app.id;
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'false');
    el.setAttribute('aria-labelledby', 'win-title-' + id);
    el.tabIndex = -1;
    el.innerHTML = windowMarkup(app, id);
    win.el = el;
    win.titleEl = el.querySelector('.window__title');
    win.bodyEl = el.querySelector('.window__body');
    /* 初始标题就是 app 名：英文页里它可能和 KICKER 同词，先按规则收一次。 */
    syncWindowHeading(win);
    el.style.zIndex = String(++zTop);
    win.z = zTop;

    var layer = layerEl();
    if (!layer) throw new Error('窗口层尚未准备好。');
    layer.appendChild(el);

    var desired;
    var bounds;
    if (opts.bounds) {
      desired = Object.assign({ appId: app.id }, opts.bounds);
      bounds = clampBounds(desired);
      win.preferredBounds = {
        x: Number(desired.x) || 0,
        y: Number(desired.y) || 0,
        w: Math.max(app.minSize.w, Number(desired.w) || app.defaultSize.w),
        h: Math.max(app.minSize.h, Number(desired.h) || app.defaultSize.h)
      };
    } else {
      bounds = defaultBounds(app);
      win.preferredBounds = U.clone(bounds);
    }
    win.bounds = U.clone(bounds);
    applyBounds(win, bounds);

    if (opts.maximized) {
      win.restoreBounds = U.clone(win.preferredBounds);
      win.maximized = true;
      el.classList.add('is-maximized');
      applyBounds(win, maximizeBounds(win));
      updateMaxControl(win);
    } else {
      updateMaxControl(win);
    }

    if (opts.minimized) {
      win.minimized = true;
      el.classList.add('is-minimized', 'is-hidden');
      setMinimizedA11y(win, true);
    }

    bindWindowEvents(win);
    var ctx = makeContext(win);
    win.ctx = ctx;
    var controller;
    try {
      controller = app.create(ctx);
      if (!controller || typeof controller.mount !== 'function') {
        throw new Error('应用 ' + app.id + ' 返回了无效的界面。');
      }
      win.controller = controller;
      controller.mount(win.bodyEl, U.clone(win.params));
    } catch (err) {
      if (window.console) console.error('PaperOS: failed to mount ' + app.id, err);
      win.bodyEl.innerHTML = '';
      var errorBox = document.createElement('div');
      errorBox.className = 'window__load-error';
      var strong = document.createElement('strong');
      strong.textContent = '这张纸没有铺开';
      var detail = document.createElement('span');
      detail.textContent = '应用遇到了一个小问题。关掉这扇窗，再试一次。';
      errorBox.appendChild(strong);
      errorBox.appendChild(detail);
      win.bodyEl.appendChild(errorBox);
    }

    wins.push(win);
    winMap.set(id, win);
    metrics.windowsOpened += 1;
    if (el.classList.contains('is-opening')) {
      setTimeout(function () {
        if (win.el) win.el.classList.remove('is-opening');
      }, 280);
    }
    return win;
  }

  function open(appId, params, options) {
    var app = getApp(appId);
    if (!app) {
      P.ui.toast('没有找到这个应用。', { kind: 'warn' });
      return null;
    }
    var opts = options || {};
    var existing = wins.find(function (w) { return !w.closing && w.appId === appId; });
    if (existing && app.singleton !== false && !opts.forceNew) {
      if (existing.minimized) restoreWindow(existing.id, { silent: true });
      focusWindow(existing.id, { skipSave: !!opts.restoring });
      if (params && Object.keys(params).length && winMap.get(existing.id)) {
        updateParams(existing.id, params);
      }
      return publicWindow(existing);
    }
    if (getVisibleWindows().length >= 12 && !opts.restoring) {
      P.ui.toast('桌面上已经有十二扇窗了，先收好一扇吧。', { kind: 'warn' });
      return null;
    }
    var win = createWindow(app, params, {
      bounds: opts.bounds,
      minimized: !!opts.minimized,
      maximized: !!opts.maximized,
      noAnimation: !!opts.restoring
    });
    if (!opts.restoring) {
      focusWindow(win.id, { skipSave: true });
      if (win.minimized) {
        // A window opened directly into minimized state should still focus,
        // but restore if the caller asked for immediate visibility.
        if (!opts.minimized) restoreWindow(win.id, { silent: true });
      }
      scheduleLayoutSave();
    } else {
      win.z = opts.z || win.z;
      win.el.style.zIndex = String(win.z);
    }
    notify('open');
    return publicWindow(win);
  }

  function updateParams(id, params) {
    var win = winMap.get(id);
    if (!win || !params) return;
    var merged = Object.assign({}, win.params);
    Object.keys(params).forEach(function (key) {
      if (key === 'docId' && typeof params[key] === 'string') merged[key] = params[key];
      if (key === 'folderId' && typeof params[key] === 'string') merged[key] = params[key];
      if (key === 'section' && typeof params[key] === 'string') merged[key] = params[key];
      if (key === 'view' && typeof params[key] === 'string') merged[key] = params[key];
    });
    win.params = merged;
    if (win.controller && typeof win.controller.updateParams === 'function') {
      try { win.controller.updateParams(U.clone(merged)); } catch (err) { if (window.console) console.error(err); }
    }
    scheduleLayoutSave();
    notify('params');
  }

  function focusWindow(id, options) {
    var win = winMap.get(id);
    if (!win || win.closing) return;
    var opts = options || {};
    if (win.minimized) {
      restoreWindow(id, { silent: !!opts.silent });
    }
    if (focusedId === id) {
      if (!opts.skipSave) updateFocusStatus();
      return;
    }
    focusedId = id;
    zTop += 1;
    win.z = zTop;
    win.el.style.zIndex = String(zTop);
    wins.forEach(function (w) {
      w.el.classList.toggle('is-focused', w.id === id);
      if (isMobile() && w.id !== id) {
        w.el.inert = true;
        w.el.setAttribute('aria-hidden', 'true');
      } else {
        w.el.inert = !!w.minimized;
        if (w.minimized) w.el.setAttribute('aria-hidden', 'true');
        else if (w.el) w.el.removeAttribute('aria-hidden');
      }
    });
    if (isMobile()) {
      win.el.inert = false;
      win.el.removeAttribute('aria-hidden');
    }
    if (!restoring && !opts.skipDomFocus && !document.querySelector('.paper-dialog[open]')) {
      var active = document.activeElement;
      if (!active || !win.el.contains(active)) {
        try { win.el.focus({ preventScroll: true }); } catch (err) { /* ignore */ }
      }
    }
    updateFocusStatus();
    if (!opts.skipSave && !restoring) scheduleLayoutSave();
    notify('focus');
  }

  function toggleMaximize(id) {
    var win = winMap.get(id);
    if (!win || win.closing || win.minimized || isMobile()) return;
    win.el.classList.add('is-layout-moving');
    if (win.maximized) {
      win.maximized = false;
      var restore = win.preferredBounds || win.restoreBounds || win.bounds;
      applyBounds(win, clampBounds(restore));
      win.el.classList.remove('is-maximized');
    } else {
      win.restoreBounds = U.clone(win.preferredBounds || win.bounds);
      win.maximized = true;
      applyBounds(win, maximizeBounds(win));
      win.el.classList.add('is-maximized');
    }
    updateMaxControl(win);
    setTimeout(function () { if (win.el) win.el.classList.remove('is-layout-moving'); }, 280);
    focusWindow(id);
    scheduleLayoutSave();
    notify('maximize');
  }

  function minimize(id) {
    var win = winMap.get(id);
    if (!win || win.closing || win.minimized) return;
    win.minimized = true;
    win.el.classList.add('is-minimized');
    win.el.style.pointerEvents = 'none';
    var hide = function () {
      if (win.minimized && win.el) win.el.classList.add('is-hidden');
    };
    if (!U.prefersReducedMotion() && win.el.animate) {
      try {
        var animation = win.el.animate(
          [{ opacity: 1, transform: 'translateY(0) scale(1)' }, { opacity: 0, transform: 'translateY(16px) scale(0.96)' }],
          { duration: 160, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }
        );
        win._minimizeAnimation = animation;
        animation.onfinish = hide;
        setTimeout(function () {
          if (win._minimizeAnimation === animation) {
            try { animation.cancel(); } catch (err) { /* ignore */ }
            win._minimizeAnimation = null;
          }
        }, 240);
      } catch (err) { hide(); }
    } else {
      hide();
    }
    setTimeout(hide, 220);
    setMinimizedA11y(win, true);
    if (focusedId === id) {
      focusedId = null;
      var next = topVisible();
      if (next) focusWindow(next.id, { skipSave: true });
      else updateFocusStatus();
    }
    scheduleLayoutSave();
    notify('minimize');
    setTimeout(function () {
      if (focusedId === null && document.activeElement === document.body) {
        var nextWin = topVisible();
        if (nextWin && nextWin.el) {
          try { nextWin.el.focus({ preventScroll: true }); } catch (err) { /* ignore */ }
        }
      }
    }, 0);
  }

  function restoreWindow(id, options) {
    var win = winMap.get(id);
    if (!win || win.closing) return;
    var opts = options || {};
    win.minimized = false;
    if (win._minimizeAnimation) {
      try { win._minimizeAnimation.cancel(); } catch (err) { /* ignore */ }
      win._minimizeAnimation = null;
    }
    win.el.classList.remove('is-minimized', 'is-hidden');
    win.el.style.pointerEvents = '';
    win.el.inert = false;
    win.el.removeAttribute('aria-hidden');
    if (win.maximized) applyBounds(win, maximizeBounds(win));
    else if (win.preferredBounds) applyBounds(win, clampBounds(win.preferredBounds));
    if (!opts.silent && !U.prefersReducedMotion() && win.el.animate) {
      try {
        win.el.animate(
          [{ opacity: 0, transform: 'translateY(10px) scale(0.985)' }, { opacity: 1, transform: 'translateY(0) scale(1)' }],
          { duration: 180, easing: 'cubic-bezier(.16,1,.3,1)' }
        );
      } catch (err) { /* ignore */ }
    }
    focusWindow(id, { skipSave: !!opts.silent });
    scheduleLayoutSave();
    notify('restore');
  }

  function closeWindow(id) {
    var win = winMap.get(id);
    if (!win || win.closing) return;
    win.closing = true;
    cancelPointerJob();
    winMap.delete(id);
    wins = wins.filter(function (w) { return w.id !== id; });
    metrics.windowsClosed += 1;
    if (focusedId === id) focusedId = null;
    try {
      if (win.controller && typeof win.controller.destroy === 'function') win.controller.destroy();
    } catch (err) { if (window.console) console.error('PaperOS: app destroy failed', err); }
    try { if (win._destroyContext) win._destroyContext(); } catch (err) { /* ignore */ }
    win.el.classList.add('is-closing');
    win.el.classList.remove('is-focused');
    win.el.setAttribute('aria-hidden', 'true');
    win.el.inert = true;
    var removeDelay = U.prefersReducedMotion() ? 20 : 170;
    setTimeout(function () { if (win.el && win.el.parentNode) win.el.parentNode.removeChild(win.el); }, removeDelay);
    var next = focusedId ? null : topVisible();
    if (next) focusWindow(next.id, { skipSave: true });
    else updateFocusStatus();
    scheduleLayoutSave();
    notify('close');
    setTimeout(function () {
      if (document.activeElement === document.body && !document.querySelector('dialog[open]')) {
        var top = topVisible();
        if (top && top.el) {
          try { top.el.focus({ preventScroll: true }); } catch (err) { /* ignore */ }
        }
      }
    }, 0);
  }

  function minimizeAll() {
    var visible = getVisibleWindows();
    if (visible.length) {
      visible.forEach(function (win) { minimize(win.id); });
      P.ui.toast('桌面收好了。点应用坞图标或房子按钮，就能再翻开。', { kind: 'info', placement: 'corner' });
      return true;
    }

    var drag = dockDrag;
    dockDrag = null;
    window.removeEventListener('pointermove', onDockPointerMove);
    window.removeEventListener('pointerup', onDockPointerUp);
    window.removeEventListener('pointercancel', onDockPointerCancel);
    drag.button.classList.remove('is-dragging');
    refs.dock.classList.remove('is-sorting');
    var buttons = dockButtons();
    buttons.forEach(function (node) { node.classList.remove('is-drop-before', 'is-drop-after'); });
    if (!drag.active) return;
    /* 拖完浏览器还会补发 click；只对这一枚生效 250ms，别误吞旁边的图标。 */
    dockClickGuard = { id: drag.id, until: Date.now() + 250 };
    var ids = buttons.map(function (node) { return node.getAttribute('data-dock-app'); });
    var from = ids.indexOf(drag.id);
    if (from === -1) return;
    ids.splice(from, 1);
    var to = typeof drag.insertAt === 'number' ? drag.insertAt : ids.length;
    if (to < 0) to = 0;
    if (to > ids.length) to = ids.length;
    ids.splice(to, 0, drag.id);
    commitDockOrder(ids);
    buildDock();
    announceDockMove(drag.id, ids);
    var moved = refs.dock.querySelector('[data-dock-app="' + drag.id + '"]');
    if (moved) moved.focus({ preventScroll: true });
  }

  function buildDock() {
    if (!refs.dock) return;
    refs.dock.innerHTML = '';
    var apps = dockAppsInOrder();
    apps.forEach(function (app) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'dock__btn';
      button.setAttribute('data-dock-app', app.id);
      button.setAttribute('data-testid', 'dock-' + app.id);
      button.setAttribute('aria-label', app.name + '（可拖动排序）');
      button.setAttribute('aria-keyshortcuts', 'Alt+ArrowLeft Alt+ArrowRight');
      button.innerHTML = P.appIcon(app.id) + '<span class="dock__tip">' + U.escapeHTML(app.name) + '</span>';
      button.addEventListener('click', function () {
        if (dockClickGuard.id === app.id && Date.now() < dockClickGuard.until) return;
        activateDockApp(app.id);
      });
      button.addEventListener('keydown', function (event) {
        if (!event.altKey || (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight')) return;
        event.preventDefault();
        var ids = dockAppsInOrder().map(function (item) { return item.id; });
        var at = ids.indexOf(app.id);
        var next = event.key === 'ArrowLeft' ? at - 1 : at + 1;
        if (next < 0 || next >= ids.length) return;
        ids.splice(at, 1);
        ids.splice(next, 0, app.id);
        commitDockOrder(ids);
        buildDock();
        announceDockMove(app.id, ids);
        var moved = refs.dock.querySelector('[data-dock-app="' + app.id + '"]');
        if (moved) moved.focus({ preventScroll: true });
      });
      bindDockDrag(button, app.id);
      refs.dock.appendChild(button);
    });
    var sep = document.createElement('span');
    sep.className = 'dock__sep';
    sep.setAttribute('aria-hidden', 'true');
    refs.dock.appendChild(sep);
    var home = document.createElement('button');
    home.type = 'button';
    home.className = 'dock__btn dock__home';
    home.setAttribute('data-testid', 'dock-home');
    home.setAttribute('aria-label', '收好或恢复窗口');
    home.setAttribute('title', '收好桌面（再点恢复）');
    home.innerHTML = P.icon('home') + '<span class="dock__tip">收好桌面</span>';
    home.addEventListener('click', function () {
      var all = P.wm.getWindows ? P.wm.getWindows() : [];
      var visible = all.filter(function (win) { return !win.minimized; });
      if (visible.length) P.wm.minimizeAll();
      else all.forEach(function (win) { P.wm.restore(win.id); });
      syncChrome();
    });
    var live = document.getElementById('dock-live');
    if (!live) {
      live = document.createElement('p');
      live.id = 'dock-live';
      live.className = 'sr-only';
      live.setAttribute('aria-live', 'polite');
      refs.dockWrap.appendChild(live);
    }
    refs.dock.appendChild(home);
    syncChrome();
  }

  function activateDockApp(appId) {
    var windows = P.wm.getWindows().filter(function (w) { return w.appId === appId; });
    if (!windows.length) {
      P.wm.open(appId);
    } else {
      var win = windows[0];
      if (win.minimized) P.wm.restore(win.id);
      else if (win.focused) {
        if (P.wm.isMobile()) P.wm.minimize(win.id);
        else P.wm.minimize(win.id);
      } else P.wm.focus(win.id);
    }
    syncChrome();
  }

  function syncChrome() {
    var focusEl = refs.focusStatus;
    var focused = P.wm.getFocused ? P.wm.getFocused() : null;
    var all = P.wm.getWindows ? P.wm.getWindows() : [];
    var visible = all.filter(function (w) { return !w.minimized; });
    if (focusEl) {
      if (focused) {
        var app = P.apps.get(focused.appId);
        var label = app ? app.name : focused.appId;
        if (focused.title && focused.title !== label) {
          label = focused.title.indexOf(label) === 0 ? focused.title : label + ' · ' + focused.title;
        }
        focusEl.textContent = label;
      } else if (all.length) {
        focusEl.textContent = F('{n} 张纸收在应用坞里', all.length);
      } else {
        /* 没有窗口时不写任何提示文字，保持顶栏安静。 */
        focusEl.textContent = '';
      }
    }
    if (refs.dock) {
      refs.dock.querySelectorAll('[data-dock-app]').forEach(function (button) {
        var appId = button.getAttribute('data-dock-app');
        var wins = all.filter(function (w) { return w.appId === appId; });
        var open = wins.length > 0;
        var active = wins.some(function (w) { return w.focused; });
        var minimized = open && wins.every(function (w) { return w.minimized; });
        button.classList.toggle('is-open', open);
        button.classList.toggle('is-active', active);
        button.classList.toggle('is-minimized', minimized);
        var app = P.apps.get(appId);
        button.setAttribute('aria-label', app.name + (active ? '，当前窗口' : open ? '，已打开' : ''));
      });
    }
  }

  /* ---------------- header & clock wiring ---------------- */

  function updateSaveStatus(status) {
    if (!refs.savePill || !refs.saveText) return;
    var phase = status.phase || 'idle';
    var label = '还没有改动';
    if (phase === 'booting') label = '正在铺纸';
    else if (phase === 'pending') label = '待保存';
    else if (phase === 'saving') label = '正在收纸';
    else if (phase === 'saved') label = '已保存';
    else if (phase === 'error') label = '保存遇到问题';
    refs.savePill.setAttribute('data-state', phase);
    refs.savePill.setAttribute('title', phase === 'error' && status.error ? status.error : '点击立即保存');
    refs.saveText.textContent = label;
    if (phase === 'saved' && status.at) {
      var saveTime = document.createElement('span');
      saveTime.className = 'save-pill__time';
      saveTime.textContent = ' · ' + U.formatTime(status.at);
      refs.saveText.appendChild(saveTime);
      refs.savePill.setAttribute('aria-label', '工作区已保存，最后保存于 ' + U.formatTime(status.at) + '。点击立即保存');
    } else {
      refs.savePill.setAttribute('aria-label', label + '。点击立即保存');
    }
  }

  function manualSave() {
    P.storage.flush().then(function () {
      var status = P.storage.getStatus();
      if (status.phase === 'error') {
        P.ui.toast('保存没有完成：' + (status.error || '请稍后重试。'), { kind: 'error' });
      } else {
        P.ui.toast('纸页都收好了。刷新之后它们还会在。', { kind: 'info' });
      }
    }).catch(function (err) {
      P.ui.toast('保存没有完成：' + (err && err.message ? err.message : '未知原因'), { kind: 'error' });
    });
  }

  function openSettings(section) {
    P.wm.open('settings', { section: section || 'appearance' });
  }

  function bindDesktopDismiss() {
    if (!refs.stage) return;
    refs.stage.addEventListener('pointerdown', function (event) {
      if (event.button !== 0 && event.pointerType === 'mouse') return;
      if (event.target.closest('.window, .dock-wrap, .day-card, .first-run, .paper-dialog')) return;
      if (document.querySelector('.paper-dialog[open]')) return;
      var visible = P.wm.getWindows().filter(function (win) { return !win.minimized; });
      if (!visible.length) return;
      event.preventDefault();
      P.wm.minimizeAll();
      syncChrome();
    });
  }

  function bindTopbar() {
    if (refs.brandButton) {
      refs.brandButton.addEventListener('click', function () { openSettings('about'); });
    }
    if (refs.settingsBtn) {
      refs.settingsBtn.addEventListener('click', function () {
        var open = P.wm.getWindows().filter(function (win) { return win.appId === 'settings' && !win.minimized; })[0];
        if (open) P.wm.close(open.id);
        else openSettings('appearance');
      });
    }
    if (refs.savePill) {
      refs.savePill.addEventListener('click', manualSave);
    }
    if (refs.dayOpen) {
      refs.dayOpen.addEventListener('click', function () { P.wm.open('calendar'); });

    if (refs.dayCard) {
      refs.dayCard.addEventListener('dblclick', function (event) {

  function documentCommands(query) {
    var q = String(query || '').trim().toLowerCase();
    var items = [];
    if (!q) {
      P.data.listNotes().slice(0, 3).forEach(function (note) {
        items.push({
          group: '最近纸页',

          iconApp: 'notes',

    P.data.searchNotes(q).slice(0, 6).forEach(function (note) {

      });

  function fuzzyMatch(text, query) {
    if (!query) return true;
    var haystack = String(text || '').toLowerCase();
    var tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
    return tokens.every(function (token) { return haystack.indexOf(token) !== -1; });
  }

  function commandScore(command, query) {
    if (!query) return 0;
    var label = String(command.label || '').toLowerCase();
    var hint = String(command.hint || '').toLowerCase();
    var hay = label + ' ' + hint + ' ' + String(command.text || '').toLowerCase();
    var tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (!tokens.every(function (token) { return hay.indexOf(token) !== -1; })) return -1;
    var score = 0;
    if (label === query) score += 140;
    if (label.indexOf(query) !== -1) score += 72;
    if (label.indexOf('打开 ') === 0) {
      var appName = label.slice(3);
      if (appName === query) score += 120;
      else if (appName.indexOf(query) === 0) score += 52;
    }
    tokens.forEach(function (token) {
      if (label.indexOf(token) !== -1) score += 16;
      if (hint.indexOf(token) !== -1) score += 4;
    });
    return score;
  }

  function exportWorkspace() {

  P.downloadFile = function (filename, content, mime) {
    try {
      var blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      anchor.rel = 'noopener';
      anchor.style.display = 'none';
      document.body.appendChild(anchor);
      anchor.click();
      setTimeout(function () {
        URL.revokeObjectURL(url);
        if (anchor.parentNode) anchor.parentNode.removeChild(anchor);
      }, 1200);
    } catch (err) {
      P.ui.toast('文件没能写出来。', { kind: 'error' });
    }
  };

  /* ---------------- window switcher ---------------- */

  function showWindowSwitcher(windows, activeId) {
    if (!switchHud) {
      switchHud = document.createElement('div');
      switchHud.className = 'switch-hud';
      switchHud.setAttribute('role', 'dialog');
      switchHud.setAttribute('aria-label', '切换窗口');
      document.body.appendChild(switchHud);
    }
    switchHud.innerHTML = '';
    windows.forEach(function (win) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'switch-hud__item' + (win.id === activeId ? ' is-active' : '');
      button.innerHTML = P.appIcon(win.appId);
      var label = document.createElement('span');
      label.textContent = win.title || win.appId;
      button.appendChild(label);
      button.addEventListener('click', function () {
        P.wm.focus(win.id);
        hideWindowSwitcher();
      });
      switchHud.appendChild(button);
    });
    switchHud.hidden = false;
    clearTimeout(switchTimer);
    switchTimer = setTimeout(hideWindowSwitcher, 1400);
  }

  function hideWindowSwitcher() {
    clearTimeout(switchTimer);
    if (switchHud && switchHud.parentNode) {
      switchHud.remove();
      switchHud = null;
    }
  }

  /* ---------------- keyboard ---------------- */

  function isTypographyTarget(target) {
    if (!target) return false;
    var tag = String(target.tagName || '').toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable;
  }

  function bindShortcuts() {
    document.addEventListener('keydown', function (event) {
      var mod = event.ctrlKey || event.metaKey;
      var key = String(event.key || '').toLowerCase();
      var dialogOpen = !!document.querySelector('.paper-dialog[open]');
      if (mod && key === 's') {
        event.preventDefault();
        manualSave();
        return;
      }
      if (mod && key === 'k') {
        event.preventDefault();
        togglePalette();
        return;
      }
      if (key === 'escape' && !dialogOpen && !isTypographyTarget(event.target)) {
        var focusedWin = P.wm.getFocused ? P.wm.getFocused() : null;
        if (focusedWin) {
          event.preventDefault();
          P.wm.close(focusedWin.id);
          syncChrome();
        }
      }
      if (dialogOpen) return;
      if (mod && event.altKey) {
        if (key === 'n') {
          event.preventDefault();
          quickNewNote();
          return;
        }
        if (key === 'b') {
          event.preventDefault();
          quickNewSticky();
          return;
        }
        if (key === 'd') {
          event.preventDefault();
          quickNewDrawing();
          return;
        }
        if (key === 'c') {
          event.preventDefault();
          P.wm.open('calendar');
          return;
        }
        if (key === 'm') {
          event.preventDefault();
          var focused = P.wm.getFocused();
          if (focused) P.wm.minimize(focused.id);
          syncChrome();
          return;
        }
        if (key === 'w') {
          event.preventDefault();
          var current = P.wm.getFocused();
          if (current) P.wm.close(current.id);
          syncChrome();
          return;
        }
        if (key === 'h') {
          event.preventDefault();
          P.wm.minimizeAll();
          syncChrome();
          return;
        }
        if (/^[1-6]$/.test(key)) {
          var app = P.apps.all.filter(function (a) { return a.dock !== false; })[Number(key) - 1];
          if (app) {
            event.preventDefault();
            P.wm.open(app.id);
          }
          return;
        }
      }
    });
  }

  /* ---------------- data & state subscriptions ---------------- */

  function setupSubscriptions() {
    P.data.subscribe(function (event) {
        if (event.type === 'tasks') updateDayTasks();
      if (event.type === 'prefs') applyPrefs();
    });
    P.wm.onChange(function () { syncChrome(); });
    P.storage.subscribeData(function (status) { updateSaveStatus(status); });
  }

  /* ---------------- boot ---------------- */

  async function start() {
    if (started) return;
    started = true;
    cacheRefs();
    var loaded = null;
    var loadWarning = '';
    var firstRun = false;
    var recoveredJournal = false;
    var raw = null;
    try {
      raw = await P.storage.init();
    } catch (err) {
      if (window.console) console.error('PaperOS storage init failed', err);
      loadWarning = '本地存储没有打开，已铺开一张示例桌面。';
    }
    recoveredJournal = !!P.storage.loadedFromJournal;
    var validated = null;
    if (raw) {
      var result = P.ingestWorkspace(raw);
      if (result.ok) validated = result;
      else {
        recoveredJournal = false;
        /* 只要存储里本来有东西却过不了闸门，就不许再写盘。
           这条分支以前会 seed 后立刻 flush，把用户唯一一份旧数据换成示例；
           Host 也只在版本号变化时备份，同版本覆盖连副本都没有。
           现在一律只读 + 原稿另存，宁可不保存也不覆盖。 */
        P.storage.blocked = true;
        /* 原稿另存是"尽力而为"：它失败也绝不能挡住启动，否则面板会永远转圈。 */
        try {
          if (typeof P.stashRejectedWorkspace === 'function') P.stashRejectedWorkspace(raw, result.error);
        } catch (err) { /* run read-only anyway */ }
        validated = null;
        if (result.newer) {
          loadWarning = result.error + ' 为了不覆盖它，本次只读，不会写入任何数据。';
        } else {
          loadWarning = '存储里的工作区没能通过校验（' + result.error + '）。为了不覆盖它，本次只读，原稿已另存一份。';
        }
        if (window.console) console.warn('PaperOS workspace rejected, running read-only', result.error);
      }
    }
    if (validated) {
      P.data.hydrate(validated.snapshot);
      loaded = validated.snapshot;
    } else {
      var seed = P.data.createSeed();
      P.data.hydrate(seed);
      firstRun = true;
    }
    /* 废纸篓的 7 天清理要在启动时跑一次，否则不打开废纸篓就永远不清理。 */
    P.data.pruneTrash();
    try {
      applyPrefs();
      bindTopbar();
      buildDock();
      bindDesktopDismiss();
      startClock();
      bindShortcuts();
      P.wm.setup();
      P.storage.capture = function () {
        var snapshot = P.data.snapshotData();
        snapshot.desktop = P.wm.serializeDesktop();
        return snapshot;
      };
      setupSubscriptions();
      var savedAt = loaded ? loaded.meta.updatedAt : null;
      P.storage.begin(savedAt);
      if (loaded && loaded.desktop) P.wm.restoreDesktop(loaded.desktop);
      setupFirstRun();
      if (firstRun || recoveredJournal) {
        P.storage.touch();
        try {
          await P.storage.flush();
        } catch (err) {
          if (window.console) console.error('PaperOS recovery save failed', err);
        }
      }
      P.storage.requestPersistence();
      syncChrome();
      updateSaveStatus(P.storage.getDataStatus());
      finishBoot();
      setTimeout(function () {
        if (P.tour && typeof P.tour.startOnce === 'function') P.tour.startOnce();
      }, 1100);
      if (recoveredJournal) {
        setTimeout(function () {
          P.ui.toast('上次还没来得及收好的纸页，已经替你恢复了。', { kind: 'info' });
        }, 650);
      }
      if (loadWarning) {
        /* toast 已按产品决定整体关掉；只读这种"会改变你数据命运"的提示必须有常驻出口。 */
        showDeskNotice(loadWarning);
      }
      if (P.storage.getMode() === 'memory') {
        setTimeout(function () {
          P.ui.toast('浏览器没有提供本地存储；这次的纸页只在这张桌面上停留。', { kind: 'error' });
        }, 1200);
      }
    } catch (err) {
      if (window.console) console.error('PaperOS boot failed', err);
      finishBoot(true);
      P.ui.toast('桌面铺开时遇到一点问题：' + (err && err.message ? err.message : '未知原因'), { kind: 'error' });
    }
  }

  function finishBoot(hasError) {
    if (refs.bootStatus) refs.bootStatus.textContent = hasError ? '纸面有点皱，但还是铺开了' : '纸张铺好了';
    if (refs.boot) refs.boot.setAttribute('aria-hidden', 'true');
    if (refs.os) refs.os.setAttribute('aria-hidden', 'false');
    document.body.classList.remove('is-booting');
    requestAnimationFrame(function () {
      document.body.classList.add('os-ready');
      window.__PAPER_OS_READY__ = true;
      document.documentElement.setAttribute('data-ready', 'true');
      setTimeout(function () {
        if (refs.boot && refs.boot.parentNode) refs.boot.parentNode.removeChild(refs.boot);
      }, 700);
    });
  }

  /* 一条常驻提示：不自动消失、可手动关掉。用于"只读""来自更新版本"这类必须看见的状态。 */
  function showDeskNotice(text) {
    if (!text) return null;
    var previous = document.querySelector('.desk-notice');
    if (previous && previous.parentNode) previous.parentNode.removeChild(previous);
    var box = document.createElement('div');
    box.className = 'desk-notice';
    box.setAttribute('role', 'status');
    box.setAttribute('data-testid', 'desk-notice');
    var mark = document.createElement('span');
    mark.className = 'desk-notice__mark';
    mark.textContent = '只读';
    var body = document.createElement('span');
    body.className = 'desk-notice__text';
    body.textContent = text;
    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'desk-notice__close';
    close.setAttribute('aria-label', '收起这条提示');
    close.textContent = '×';
    close.addEventListener('click', function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    });
    box.appendChild(mark);
    box.appendChild(body);
    box.appendChild(close);
    document.body.appendChild(box);
    return box;
  }
  P.showDeskNotice = showDeskNotice;

  /* 命令清单的公开面：设置分区渲染它，动作仍由 shell 执行。 */
  P.commands = {
    list: commandList,
    docs: documentCommands,
    score: commandScore
  };

  P.shell = {
    syncChrome: syncChrome,
    buildDock: buildDock,
    showWindowSwitcher: showWindowSwitcher,
    applyPrefs: applyPrefs,
    openSettings: openSettings,
    exportWorkspace: exportWorkspace,
    manualSave: manualSave
  };

  P.start = start;
})();

/* ===== src/js/apps/stickies.js ===== */
/* ============================================================
   PAPER OS — Sticky Notes app
   ============================================================ */
(function () {
  'use strict';

  var P = window.PaperOS;
  var U = P.util;

  var COLORS = [
    { id: 'butter', hex: '#f4e6a9' },
    { id: 'peach', hex: '#efd2b9' },
    { id: 'sage', hex: '#d5dfc5' },
    { id: 'sky', hex: '#cfdde2' },
    { id: 'rose', hex: '#ebd0cb' }
  ];

  P.registerApp({
    id: 'stickies',
    name: '便签',
    english: 'STICKY NOTES',
    description: '写短句、贴纸片；自动保存，拖动顶部把手可移动',
    defaultSize: { w: 840, h: 590 },
    minSize: { w: 390, h: 340 },
    create: function (ctx) {
      var root, board, inner, hint, emptyBox, countEl, saveEl;
      var refsTrashCount = null;
      var cards = new Map();
      var resizeObserver = null;

      function updateTrashCount() {
        if (!refsTrashCount) return;
        var n = P.data.listTrashedStickies().length;
        refsTrashCount.textContent = n ? String(n) : '';
        refsTrashCount.hidden = !n;
      }

      /* 废纸篓：列出被删掉的非空便签，可以放回去；超过 7 天自动彻底删除。 */
      function node(tag, cls, text) {
        var made = document.createElement(tag);
        if (cls) made.className = cls;
        if (text !== undefined && text !== null) made.textContent = text;
        return made;
      }

      function openTrash() {
        var items = P.data.listTrashedStickies();
        P.ui.dialog({
          kicker: 'PAPER OS · 废纸篓',
          title: '被揭下来的便签',
          wide: true,
          width: 520,
          actions: [{ label: '收起', value: null, kind: 'primary' }],
          render: function (body) {
            body.appendChild(node('p', 'dialog-note', '这里只留 ' + P.data.trashDays + ' 天，之后会自动清掉。'));
            var host = node('div', 'trash-list');
            body.appendChild(host);
            if (!items.length) {
              host.appendChild(node('p', 'trash-empty', '废纸篓是空的。'));
              return;
            }
            items.forEach(function (item) {
              var row = node('div', 'trash-item');
              row.appendChild(node('p', 'trash-item__text', String(item.text || '').slice(0, 160)));
              row.appendChild(node('div', 'trash-item__meta', '删于 ' + U.formatListDate(item.trashedAt)));
              var actions = node('div', 'trash-item__actions');
              var back = node('button', 'paper-btn paper-btn--tiny', '放回去');
              back.type = 'button';
              back.addEventListener('click', function () {
                P.data.restoreSticky(item.id);
                row.remove();
                if (!P.data.listTrashedStickies().length) {
                  host.appendChild(node('p', 'trash-empty', '废纸篓是空的。'));
                }
                P.ui.toast('便签放回去了。', { kind: 'info' });
              });
              actions.appendChild(back);
              row.appendChild(actions);
              host.appendChild(row);
            });
          }
        });
      }

      function saveStateText(status) {
        if (!saveEl) return;
        var label = '自动保存';
        if (status.phase === 'saving') label = '正在收好纸片';
        else if (status.phase === 'pending') label = '待保存';
        else if (status.phase === 'saved') label = '已保存';
        else if (status.phase === 'error') label = '保存遇到问题';
        else if (status.phase === 'booting') label = '正在铺纸';
        saveEl.textContent = label;
        saveEl.setAttribute('data-state', status.phase || 'idle');
      }

      function stickyById(id) {
        return P.data.listStickies().find(function (s) { return s.id === id; });
      }

      function findFreePosition() {
        var existing = P.data.listStickies();
        var width = 210;
        var height = 190;
        var gapX = 22;
        var gapY = 18;
        var available = Math.max(520, board.clientWidth - 34);
        var cols = Math.max(2, Math.floor(available / (width + gapX)));
        for (var row = 0; row < 30; row += 1) {
          for (var col = 0; col < cols; col += 1) {
            var x = 24 + col * (width + gapX);
            var y = 42 + row * (height + gapY);
            var overlap = existing.some(function (s) {
              return Math.abs(s.x - x) < width * 0.72 && Math.abs(s.y - y) < height * 0.72;
            });
            if (!overlap) return { x: x, y: y };
          }
        }
        return { x: 30, y: 30 };
      }

      function rebuildBoard() {
        var items = P.data.listStickies();
        if (countEl) countEl.textContent = String(items.length);
        if (emptyBox) emptyBox.hidden = items.length !== 0;
        var current = new Set();
        items.forEach(function (sticky) {
          current.add(sticky.id);
          var card = cards.get(sticky.id);
          if (!card) {
            card = createCard(sticky);
            cards.set(sticky.id, card);
            inner.appendChild(card.el);
          } else {
            updateCard(card, sticky);
          }
          /* 叠放顺序 = 数据里的 z；最后碰过的那张一定在最上面。 */
          card.el.style.zIndex = String(10 + Math.round(Number(sticky.z) || 0));
        });
        cards.forEach(function (card, id) {
          if (!current.has(id)) {
            card.el.remove();
            cards.delete(id);
          }
        });
        updateBoardSize();
      }

      function createCard(sticky) {
        var card = { id: sticky.id, el: null, text: null, date: null, sample: null, swatches: null, dragging: false };
        var el = document.createElement('article');
        el.className = 'sticky';
        el.setAttribute('data-id', sticky.id);
        el.setAttribute('data-testid', 'sticky-' + sticky.id);
        el.setAttribute('data-color', sticky.color);
        el.style.setProperty('--tilt', (((parseInt(sticky.id.slice(-2), 36) || 0) % 5) - 2) * 0.45 + 'deg');
        el.innerHTML = '<span class="sticky__tape" aria-hidden="true"></span>' +
          '<header class="sticky__head">' +
          '<span class="sticky__drag" aria-hidden="true"><i></i><i></i><i></i></span>' +
          '<span class="sticky__swatches" role="group" aria-label="便签颜色"></span>' +
          '<button class="sticky__del" type="button" aria-label="删掉这张便签" title="删掉">×</button>' +
          '</header>' +
          '<textarea class="sticky__text" maxlength="5000" aria-label="便签内容" placeholder="写一句话…"></textarea>' +
          '<footer class="sticky__foot"><span class="sample-tag" hidden>示例</span><span class="sticky__date"></span></footer>';
        card.el = el;
        card.text = el.querySelector('.sticky__text');
        card.date = el.querySelector('.sticky__date');
        card.sample = el.querySelector('.sample-tag');
        card.swatches = el.querySelector('.sticky__swatches');
        card.text.value = sticky.text || '';
        el.style.left = Math.round(sticky.x) + 'px';
        el.style.top = Math.round(sticky.y) + 'px';

        COLORS.forEach(function (color) {
          var swatch = document.createElement('button');
          swatch.type = 'button';
          swatch.className = 'sticky__swatch';
          swatch.style.setProperty('--swatch', color.hex);
          swatch.setAttribute('aria-label', '换成' + colorLabel(color.id) + '色');
          swatch.setAttribute('data-color', color.id);
          swatch.addEventListener('click', function (event) {
            event.stopPropagation();
            P.data.updateSticky(sticky.id, { color: color.id });
          });
          card.swatches.appendChild(swatch);
        });

        card.text.addEventListener('input', function () {
          P.data.updateSticky(sticky.id, { text: card.text.value });
          card.date.textContent = U.formatListDate(Date.now());
        });
        card.el.querySelector('.sticky__del').addEventListener('click', function (event) {
          event.stopPropagation();
          removeSticky(sticky.id);
        });

        var head = el.querySelector('.sticky__head');
        /* 整张纸都能拖着走：只放过正文输入区、滚动条、色块和删除按钮。 */
        el.addEventListener('pointerdown', function (event) {
          if (event.target.closest('.sticky__text, .sticky__swatches, .sticky__del')) return;
          beginDrag(event, card);
        });
        el.addEventListener('pointerdown', function () {
          P.data.raiseSticky(sticky.id);
          viewTarget = sticky.id;
          scheduleViewSave();
        }, true);
        head.addEventListener('dblclick', function (event) {
          if (event.target.closest('button')) return;
          card.text.focus();
          card.text.select();
        });

        updateCard(card, sticky);
        return card;
      }

      function colorLabel(colorId) {
        if (colorId === 'peach') return '陶土';
        if (colorId === 'sage') return '鼠尾草';
        if (colorId === 'sky') return '雾蓝';
        if (colorId === 'rose') return '旧粉';
        return '奶油';
      }

      function updateCard(card, sticky) {
        if (!card || !card.el) return;
        card.el.setAttribute('data-color', sticky.color);
        if (card.text !== document.activeElement) card.text.value = sticky.text || '';
        if (!card.dragging) {
          card.el.style.left = Math.round(sticky.x) + 'px';
          card.el.style.top = Math.round(sticky.y) + 'px';
        }
        card.date.textContent = U.formatListDate(sticky.updatedAt);
        card.sample.hidden = !sticky.sample;
        if (card.swatches) {
          card.swatches.querySelectorAll('.sticky__swatch').forEach(function (swatch) {
            swatch.classList.toggle('is-active', swatch.getAttribute('data-color') === sticky.color);
            swatch.setAttribute('aria-pressed', swatch.getAttribute('data-color') === sticky.color ? 'true' : 'false');
          });
        }
      }

      function updateBoardSize() {
        if (!inner) return;
        if (board.clientWidth < 560) {
          inner.style.width = '';
          inner.style.height = '';
          return;
        }
        var items = P.data.listStickies();
        var maxX = 0;
        var maxY = 0;
        items.forEach(function (s) {
          maxX = Math.max(maxX, s.x + 210);
          maxY = Math.max(maxY, s.y + 190);
        });
        var w = Math.max(board.clientWidth, maxX + 58);
        var h = Math.max(board.clientHeight, maxY + 70);
        inner.style.width = Math.round(w) + 'px';
        inner.style.height = Math.round(h) + 'px';
      }

      /* 删除不再弹可撤销提示（来不及点、容易误触丢内容）。
         非空便签进废纸篓，7 天内都能在顶部「废纸篓」里找回来。 */
      function removeSticky(id) {
        P.data.deleteSticky(id);
      }

      function beginDrag(event, card) {
        if (event.button !== 0 && event.pointerType === 'mouse') return;
        if (board.clientWidth < 560) return;
        event.preventDefault();
        var sticky = stickyById(card.id);
        if (!sticky) return;
        var startClientX = event.clientX;
        var startClientY = event.clientY;
        var startScrollLeft = board.scrollLeft;
        var startScrollTop = board.scrollTop;
        var left = sticky.x;
        var top = sticky.y;
        var started = false;

        function onMove(ev) {
          var dx = ev.clientX - startClientX + (board.scrollLeft - startScrollLeft);
          var dy = ev.clientY - startClientY + (board.scrollTop - startScrollTop);
          if (!started) {
            if (Math.abs(dx) + Math.abs(dy) < 10) return;
            started = true;
            card.dragging = true;
            card.el.classList.add('is-dragging');
          }
          var nextX = Math.max(8, Math.round(left + dx));
          var nextY = Math.max(8, Math.round(top + dy));
          if (nextX + 300 > inner.clientWidth) inner.style.width = (nextX + 300) + 'px';
          if (nextY + 270 > inner.clientHeight) inner.style.height = (nextY + 270) + 'px';
          card.el.style.left = nextX + 'px';
          card.el.style.top = nextY + 'px';
          card.el.dataset.x = String(nextX);
          card.el.dataset.y = String(nextY);
          ev.preventDefault();
        }

        var offMove = ctx.on(document, 'pointermove', onMove, { passive: false });
        var offUp = ctx.on(document, 'pointerup', finish);
        var offCancel = ctx.on(document, 'pointercancel', finish);

        function finish() {
          offMove();
          offUp();
          offCancel();
          if (!started) return;
          card.dragging = false;
          card.el.classList.remove('is-dragging');
          var x = Number(card.el.dataset.x);
          var y = Number(card.el.dataset.y);
          if (Number.isFinite(x) && Number.isFinite(y)) {
            P.data.updateSticky(card.id, { x: x, y: y });
          }
          updateBoardSize();
        }
      }

      function newSticky() {
        var pos = findFreePosition();
        var stickyCount = P.data.listStickies().length;
        var created = P.data.createSticky({
          x: pos.x,
          y: pos.y,
          color: COLORS[stickyCount % COLORS.length].id,
          text: ''
        });
        var card = cards.get(created.id);
        if (card) {
          card.el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
          card.text.focus();
        }
        return created;
      }

      /* 这个窗口正在看什么：滚动位置 + 最后碰过的那张便签。
         存进窗口 params，跟着 desktop 一起落盘，切走再回来能复原。 */
      var viewTarget = '';
      var viewScroll = { left: 0, top: 0 };
      var viewTimer = null;

      function rememberView() {
        if (viewTimer) { clearTimeout(viewTimer); viewTimer = null; }
        if (!board) return;
        viewScroll.left = Math.round(board.scrollLeft);
        viewScroll.top = Math.round(board.scrollTop);
        var payload = viewTarget ? viewTarget + '@' + viewScroll.left + ',' + viewScroll.top
                                    : '@' + viewScroll.left + ',' + viewScroll.top;
        ctx.setParams({ view: payload });
      }

      function scheduleViewSave() {
        if (viewTimer) clearTimeout(viewTimer);
        viewTimer = setTimeout(function () { viewTimer = null; rememberView(); }, 260);
      }

      function restoreView(view) {
        if (!view || !board) return;
        var at = String(view).indexOf('@');
        var id = at > 0 ? String(view).slice(0, at) : '';
        var pos = at >= 0 ? String(view).slice(at + 1) : String(view);
        var parts = pos.split(',');
        var left = Number(parts[0]);
        var top = Number(parts[1]);
        if (id) viewTarget = id;
        if (Number.isFinite(left) && Number.isFinite(top)) {
          viewScroll.left = left;
          viewScroll.top = top;
          board.scrollLeft = left;
          board.scrollTop = top;
        }
        if (id && cards.get(id) && cards.get(id).el) {
          var cardEl = cards.get(id).el;
          cardEl.classList.add('is-view-focus');
          setTimeout(function () { cardEl.classList.remove('is-view-focus'); }, 900);
        }
      }

      function mount(container, params) {
        root = document.createElement('div');
        root.className = 'app stickies-app';
        root.innerHTML = '<div class="app-toolbar">' +
          '<div class="app-toolbar__meta"><span class="count-chip" data-testid="sticky-count">0</span></div>' +
          '<div class="app-toolbar__actions"><span class="save-state" data-state="idle">自动保存</span>' +
          '<button class="paper-btn paper-btn--tiny paper-btn--ghost" type="button" data-testid="open-trash" aria-label="打开废纸篓">废纸篓<span class="trash-count" data-trash-count hidden></span></button>' +
          '<button class="paper-btn paper-btn--tiny" type="button" data-testid="new-sticky">' + P.icon('plus') + ' 新便签</button></div>' +
          '</div>' +
          '<div class="sticky-board" data-testid="sticky-board">' +
          '<div class="sticky-board__inner"></div>' +
          '<div class="sticky-board__empty" hidden><div class="empty-state">' +
          '<span class="empty-state__mark">贴</span>' +
          '<h3 class="empty-state__title">还没有便签</h3>' +
          '<p class="empty-state__text">点右上角「新便签」写下第一句话，内容会自动保存。</p>' +
          '<div class="empty-state__actions"><button class="paper-btn paper-btn--ink" type="button" data-empty-new>新建便签</button></div>' +
          '</div></div></div>';
        ctx.body.appendChild(root);
        board = root.querySelector('.sticky-board');
        inner = root.querySelector('.sticky-board__inner');
        hint = root.querySelector('.sticky-board__hint');
        emptyBox = root.querySelector('.sticky-board__empty');
        countEl = root.querySelector('[data-testid="sticky-count"]');
        saveEl = root.querySelector('.save-state');
        ctx.setTitle('便签');
        root.querySelector('[data-testid="new-sticky"]').addEventListener('click', newSticky);
        root.querySelector('[data-testid="open-trash"]').addEventListener('click', openTrash);
        refsTrashCount = root.querySelector('[data-trash-count]');
        updateTrashCount();
        var emptyButton = root.querySelector('[data-empty-new]');
        if (emptyButton) emptyButton.addEventListener('click', newSticky);
        ctx.subscribe(function (event) {
          if (event.type === 'stickies' || event.type === 'prefs') rebuildBoard();
        });
        ctx.subscribeSave(saveStateText);
        resizeObserver = ctx.observeResize(function () { updateBoardSize(); });
        rebuildBoard();
        updateBoardSize();
        /* 先重建卡片，再恢复滚动位置与聚焦的那张。 */
        if (params && params.view) restoreView(params.view);
        ctx.on(board, 'scroll', scheduleViewSave, { passive: true });
        ctx.cleanup(function () { if (viewTimer) clearTimeout(viewTimer); });
      }

      return {
        mount: mount,
        updateParams: function (params) {
          if (params && params.view) restoreView(params.view);
        },
        destroy: function () {
          // Subscriptions, observers and timers are released by the window
          // manager's app context. Nothing else outlives the window.
        }
      };
    }
  });
})();

/* ============================================================
   PAPER OS — Prompt Library app
   ============================================================ */
(function () {
  'use strict';

  var P = window.PaperOS;
  var U = P.util;

  var SEARCH_DELAY = 80;

  P.registerApp({
    id: 'prompts',
    name: '提示词',
    english: 'PROMPTS',
    description: '存下常用的提示词；在对话输入框点「提示词」就能填进去',
    defaultSize: { w: 960, h: 640 },
    minSize: { w: 520, h: 400 },
    create: function (ctx) {
      var root = null;
      var refs = {};
      var currentId = null;
      /* 编辑器 DOM 是为哪一条建的。每次 commit 都重建 DOM 会摧毁正在输入的焦点，
         所以只有"换了选中项"时才重建，其余情况只更新文字。 */
      var editorFor = null;
      var searchTimer = null;
      var titleTimer = null;

      function promptById(id) {
        return id ? P.data.getPrompt(id) : null;
      }

      function stamp(ms) {
        if (!ms) return '';
        var date = new Date(Number(ms));
        if (!Number.isFinite(date.getTime())) return '';
        var now = new Date();
        var sameDay = date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date.getDate() === now.getDate();
        if (sameDay) return '今天 ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
        return (date.getMonth() + 1) + '-' + date.getDate();
      }

      function excerpt(body) {
        var text = String(body || '').replace(/\s+/g, ' ').trim();
        if (!text) return '还没有正文';
        return text.length > 96 ? text.slice(0, 96) + '…' : text;
      }

      function charCount(body) {
        return String(body || '').length;
      }

      /* ---------- list ---------- */

      function renderList() {
        if (!refs.list) return;
        var query = refs.searchInput ? refs.searchInput.value : '';
        var list = P.data.listPrompts(query);
        var total = P.data.listPrompts('').length;
        if (refs.count) {
          refs.count.textContent = query.trim()
            ? F('找到 {found} / {total} 条', { found: list.length, total: total })
            : (total ? F('{n} 条提示词', total) : '还没有提示词');
        }
        refs.list.innerHTML = '';
        if (!list.length) {
          var empty = document.createElement('div');
          empty.className = 'prompts-list__empty';
          empty.textContent = query.trim()
            ? '没有匹配的提示词。换个词试试。'
            : '还没有提示词。点上面的「新建」写第一条。';
          refs.list.appendChild(empty);
          return;
        }
        list.forEach(function (item) {
          var row = document.createElement('button');
          row.type = 'button';
          row.className = 'prompt-item' + (item.id === currentId ? ' is-active' : '');
          row.setAttribute('data-prompt-id', item.id);
          row.setAttribute('data-testid', 'prompt-item');

          var index = document.createElement('span');
          index.className = 'prompt-item__index';
          index.textContent = ('0' + (list.indexOf(item) + 1)).slice(-2);
          row.appendChild(index);

          var col = document.createElement('span');
          col.className = 'prompt-item__col';

          var top = document.createElement('span');
          top.className = 'prompt-item__top';
          var name = document.createElement('span');
          name.className = 'prompt-item__name';
          name.textContent = item.title || '未命名提示词';
          top.appendChild(name);
          if (item.sample) {
            var badge = document.createElement('span');
            badge.className = 'prompts-sample-badge';
            badge.textContent = '示例';
            top.appendChild(badge);
          }
          if (item.pinned) {
            var pin = document.createElement('span');
            pin.className = 'prompt-item__pin';
            pin.innerHTML = P.icon('sparkles');
            pin.setAttribute('aria-label', '已置顶');
            top.appendChild(pin);
          }
          col.appendChild(top);

          var text = document.createElement('span');
          text.className = 'prompt-item__excerpt';
          text.textContent = excerpt(item.body);
          col.appendChild(text);

          var foot = document.createElement('span');
          foot.className = 'prompt-item__foot';
          var count = document.createElement('span');
          count.textContent = F('{n} 字', charCount(item.body));
          foot.appendChild(count);
          var dash = document.createElement('span');
          dash.className = 'prompt-item__dash';
          foot.appendChild(dash);
          var when = document.createElement('span');
          when.textContent = stamp(item.updatedAt);
          foot.appendChild(when);
          col.appendChild(foot);
          row.appendChild(col);

          row.addEventListener('click', function () { selectPrompt(item.id); });
          refs.list.appendChild(row);
        });
      }

      /* ---------- editor ---------- */

      function renderEditor() {
        if (!refs.editor) return;
        var item = promptById(currentId);
        refs.editor.innerHTML = '';
        if (!item) {
          refs.editor.hidden = true;
          if (refs.emptyBox) refs.emptyBox.hidden = false;
          if (refs.barTitle) refs.barTitle.textContent = '提示词';
          if (refs.actions) refs.actions.hidden = true;
          return;
        }
        refs.editor.hidden = false;
        if (refs.emptyBox) refs.emptyBox.hidden = true;
        if (refs.barTitle) refs.barTitle.textContent = item.title || '未命名提示词';
        if (refs.actions) refs.actions.hidden = false;

        var body = document.createElement('div');
        body.className = 'prompts-main__body';

        var titleField = document.createElement('label');
        titleField.className = 'prompts-field';
        var titleLabel = document.createElement('span');
        titleLabel.className = 'prompts-field__label';
        titleLabel.textContent = '标题';
        titleField.appendChild(titleLabel);
        var titleInput = document.createElement('input');
        titleInput.type = 'text';
        titleInput.className = 'prompts-title-input';
        /* 没标题就是空串（数据里没有哨兵），标题栏显示 placeholder 让用户直接写。 */
        titleInput.value = item.title || '';
        titleInput.placeholder = '未命名提示词';
        titleInput.maxLength = 120;
        titleInput.setAttribute('data-testid', 'prompt-title');
        titleInput.addEventListener('input', function () {
          clearTimeout(titleTimer);
          titleTimer = setTimeout(function () {
            P.data.updatePrompt(currentId, { title: titleInput.value });
          }, 240);
        });
        titleField.appendChild(titleInput);
        body.appendChild(titleField);

        var bodyField = document.createElement('label');
        bodyField.className = 'prompts-field prompts-field--body';
        var bodyLabel = document.createElement('span');
        bodyLabel.className = 'prompts-field__label';
        bodyLabel.appendChild(document.createTextNode('正文 · 原样填入'));
        var counter = document.createElement('span');
        counter.setAttribute('data-testid', 'prompt-count');
        counter.textContent = F('{n} / 20000 字', charCount(item.body));
        bodyLabel.appendChild(counter);
        bodyField.appendChild(bodyLabel);
        var textarea = document.createElement('textarea');
        textarea.className = 'prompts-body-input';
        textarea.value = item.body;
        textarea.placeholder = '把要反复使用的那段话写在这里。可以多行。';
        textarea.setAttribute('data-testid', 'prompt-body');
        textarea.addEventListener('input', function () {
          counter.textContent = F('{n} / 20000 字', charCount(textarea.value));
          P.data.updatePrompt(currentId, { body: textarea.value });
        });
        bodyField.appendChild(textarea);
        body.appendChild(bodyField);
        refs.editor.appendChild(body);
        refs.titleInput = titleInput;
        refs.bodyInput = textarea;
        refs.counter = counter;
        editorFor = item.id;
        updatePinLabel(item);
      }

      /* 只更新"会变但不需要重建"的部分：栏头标题、字数、置顶态。 */
      function updateEditorMeta(item) {
        if (refs.barTitle) refs.barTitle.textContent = item.title || '未命名提示词';
        if (refs.counter) refs.counter.textContent = F('{n} / 20000 字', charCount(item.body));
        updatePinLabel(item);
      }

      function editorFocused() {
        return !!(refs.editor && refs.editor.contains(document.activeElement));
      }

      /* 数据变了之后的统一入口：选中项没变就不碰输入框，保住光标。 */
      function syncEditor() {
        var item = promptById(currentId);
        if (!item) {
          currentId = null;
          editorFor = null;
          renderEditor();
          return;
        }
        if (editorFor === item.id && refs.titleInput && refs.bodyInput) {
          updateEditorMeta(item);
          return;
        }
        renderEditor();
      }

      function updatePinLabel(item) {
        if (!refs.pinBtn) return;
        var pinned = item ? !!item.pinned : false;
        refs.pinBtn.textContent = pinned ? '取消置顶' : '置顶';
        refs.pinBtn.setAttribute('aria-pressed', pinned ? 'true' : 'false');
      }

      function selectPrompt(id) {
        currentId = id;
        renderList();
        syncEditor();
      }

      /* ---------- actions ---------- */

      function newPrompt() {
        var created = P.data.createPrompt({ title: '', body: '' });
        if (!created) {
          P.ui.toast('提示词数量已达上限（300 条）。', { kind: 'warn' });
          return;
        }
        selectPrompt(created.id);
        if (refs.titleInput) refs.titleInput.focus();
      }

      function duplicateCurrent() {
        var item = promptById(currentId);
        if (!item) return;
        var copy = P.data.duplicatePrompt(item.id);
        if (!copy) {
          P.ui.toast('提示词数量已达上限（300 条）。', { kind: 'warn' });
          return;
        }
        selectPrompt(copy.id);
        P.ui.toast('已复制一条。', { kind: 'info' });
      }

      function togglePin() {
        var item = promptById(currentId);
        if (!item) return;
        P.data.updatePrompt(item.id, { pinned: !item.pinned });
        renderList();
        updatePinLabel(promptById(currentId));
      }

      function deleteCurrent() {
        var item = promptById(currentId);
        if (!item) return;
        P.ui.confirm({
          kicker: 'PROMPTS · 删除',
          title: '删掉「' + item.title + '」？',
          message: F('提示词删除后不能恢复。正文 {n} 字。', charCount(item.body)),
          confirmLabel: '删除',
          danger: true
        }).then(function (confirmed) {
          if (!confirmed) return;
          P.data.deletePrompt(item.id);
          var next = P.data.listPrompts('')[0];
          currentId = next ? next.id : null;
          renderList();
          renderEditor();
          P.ui.toast('已删除。', { kind: 'info' });
        });
      }

      function copyBody() {
        var item = promptById(currentId);
        if (!item) return;
        var text = item.body;
        function fallback() {
          try {
            var area = document.createElement('textarea');
            area.value = text;
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            document.body.removeChild(area);
            P.ui.toast('已复制正文。', { kind: 'info' });
          } catch (err) {
            P.ui.toast('复制失败，请手动选中正文。', { kind: 'warn' });
          }
        }
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(text).then(function () {
            P.ui.toast('已复制正文。', { kind: 'info' });
          }, fallback);
          return;
        }
        fallback();
      }

      /* ---------- mount ---------- */

      function mount(container, params) {
        root = document.createElement('div');
        root.className = 'prompts-app';

        var rail = document.createElement('div');
        rail.className = 'prompts-rail';
        rail.innerHTML = '<div class="prompts-rail__head">' +
          '<div class="prompts-rail__top"><span class="eyebrow">PROMPTS</span>' +
          '<button class="prompts-new" type="button" data-testid="new-prompt">＋ 新建</button></div>' +
          '<label class="prompts-search">' + P.icon('search') +
          '<input type="search" placeholder="搜标题或正文" aria-label="搜索提示词" data-testid="prompt-search"></label>' +
          '<div class="prompts-rail__status"><span class="prompts-rail__count" data-testid="prompt-count-total"></span></div>' +
          '</div>' +
          '<div class="prompts-list" data-testid="prompt-list"></div>' +
          '<div class="prompts-rail__foot">在对话输入框点「提示词」取用<br>只填进草稿，不会发送</div>';

        var main = document.createElement('div');
        main.className = 'prompts-main';
        main.innerHTML = '<div class="prompts-card">' +
          '<div class="prompts-main__bar">' +
          '<span class="prompts-main__title" data-testid="prompt-heading">提示词</span>' +
          '<span class="prompts-main__actions" hidden>' +
          '<button class="paper-btn paper-btn--tiny paper-btn--ghost" type="button" data-testid="prompt-copy" title="只复制正文">复制</button>' +
          '<button class="paper-btn paper-btn--tiny paper-btn--ghost" type="button" data-testid="prompt-duplicate">复制一条</button>' +
          '<button class="paper-btn paper-btn--tiny paper-btn--ghost" type="button" data-testid="prompt-pin">置顶</button>' +
          '<button class="paper-btn paper-btn--tiny paper-btn--ghost" type="button" data-testid="prompt-delete">删除</button>' +
          '</span></div>' +
          '<div class="prompts-empty" data-testid="prompt-empty">' +
          '<span class="prompts-empty__mark" aria-hidden="true">词</span>' +
          '<p class="prompts-empty__title">把常说的那句话存成一张卡</p>' +
          '<p class="prompts-empty__hint">存好之后，在任意对话的输入框点「提示词」，选一条就填进草稿。不写系统提示词，也不自动发送。</p>' +
          '<div class="prompts-empty__actions">' +
          '<button class="paper-btn paper-btn--ink" type="button" data-testid="prompt-empty-new">写第一条</button>' +
          '<button class="paper-btn paper-btn--tiny paper-btn--ghost" type="button" data-testid="prompt-empty-samples">放入示例</button>' +
          '</div></div>' +
          '<div class="prompts-main__body" data-testid="prompt-editor" hidden></div>' +
          '<div class="prompts-main__foot"><span data-testid="prompt-save-state">自动保存</span>' +
          '<span data-testid="prompt-cap">正文上限 20000 字</span></div>' +
          '</div>';

        root.appendChild(rail);
        root.appendChild(main);
        ctx.body.appendChild(root);

        refs.rail = rail;
        refs.list = root.querySelector('[data-testid="prompt-list"]');
        refs.count = root.querySelector('[data-testid="prompt-count-total"]');
        refs.searchInput = root.querySelector('[data-testid="prompt-search"]');
        refs.editor = root.querySelector('[data-testid="prompt-editor"]');
        refs.emptyBox = root.querySelector('[data-testid="prompt-empty"]');
        refs.actions = root.querySelector('.prompts-main__actions');
        refs.barTitle = root.querySelector('[data-testid="prompt-heading"]');
        refs.pinBtn = root.querySelector('[data-testid="prompt-pin"]');
        refs.saveState = root.querySelector('[data-testid="prompt-save-state"]');
        ctx.setTitle('提示词');

        root.querySelector('[data-testid="new-prompt"]').addEventListener('click', newPrompt);
        root.querySelector('[data-testid="prompt-empty-new"]').addEventListener('click', newPrompt);
        var sampleBtn = root.querySelector('[data-testid="prompt-empty-samples"]');
        if (sampleBtn) sampleBtn.addEventListener('click', function () {
          var added = P.data.insertSamplePrompts();
          if (!added) {
            P.ui.toast('示例已经在库里了。', { kind: 'info' });
            return;
          }
          renderList();
          var next = P.data.listPrompts('')[0];
          if (next) selectPrompt(next.id);
        });
        root.querySelector('[data-testid="prompt-copy"]').addEventListener('click', copyBody);
        root.querySelector('[data-testid="prompt-duplicate"]').addEventListener('click', duplicateCurrent);
        root.querySelector('[data-testid="prompt-pin"]').addEventListener('click', togglePin);
        root.querySelector('[data-testid="prompt-delete"]').addEventListener('click', deleteCurrent);
        refs.searchInput.addEventListener('input', function () {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(renderList, SEARCH_DELAY);
        });
        /* 输入期间列表被延后重建，离开编辑器时补上。 */
        refs.editor.addEventListener('focusout', function () {
          setTimeout(function () { if (!editorFocused()) renderList(); }, 0);
        });

        ctx.subscribe(function (event) {
          if (event.type !== 'prompts' && event.type !== 'prefs') return;
          if (currentId && !promptById(currentId)) { currentId = null; editorFor = null; }
          syncEditor();
          /* 正在编辑器里输入时不动列表：既省掉整表重建，也不会让行在脚下重排。 */
          if (!editorFocused()) renderList();
        });
        ctx.subscribeSave(function (status) {
          if (!refs.saveState) return;
          var label = '自动保存';
          if (status.phase === 'saving') label = '正在收好';
          else if (status.phase === 'pending') label = '待保存';
          else if (status.phase === 'saved') label = '已保存';
          else if (status.phase === 'error') label = '保存遇到问题';
          else if (status.phase === 'booting') label = '正在铺纸';
          refs.saveState.textContent = label;
          refs.saveState.setAttribute('data-state', status.phase || 'idle');
        });
        ctx.cleanup(function () {
          clearTimeout(searchTimer);
          clearTimeout(titleTimer);
        });

        var first = params && params.promptId ? promptById(params.promptId) : null;
        var list = P.data.listPrompts('');
        currentId = first ? first.id : (list[0] ? list[0].id : null);
        renderList();
        renderEditor();
      }

      return {
