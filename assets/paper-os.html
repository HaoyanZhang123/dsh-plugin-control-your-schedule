        refs.eraserBtn.innerHTML = P.icon('eraser') + '<span>橡皮</span>';
        buildTools();
        refs.undo.addEventListener('click', undo);
        refs.redo.addEventListener('click', redo);
        refs.clear.addEventListener('click', clearPaper);
        refs.deleteBtn.addEventListener('click', confirmDeleteDrawing);
        refs.galleryPrev.addEventListener('click', function () { stepGallery(-1); });
        refs.galleryNext.addEventListener('click', function () { stepGallery(1); });
        refs.exportBtn.addEventListener('click', exportPNG);
        refs.eraserBtn.addEventListener('click', toggleEraser);
        root.querySelector('[data-new-drawing]').addEventListener('click', createDrawing);
        root.querySelector('[data-empty-new]').addEventListener('click', createDrawing);
        root.querySelector('[data-missing-new]').addEventListener('click', createDrawing);
        ctx.on(refs.canvas, 'pointerdown', beginStroke);
        ctx.on(refs.canvas, 'pointermove', continueStroke);
        ctx.on(refs.canvas, 'pointerup', finishStroke);
        ctx.on(refs.canvas, 'pointercancel', finishStroke);
        ctx.on(refs.canvas, 'pointerleave', function (event) {
          if (drawing) finishStroke(event);
          hideBrushCursor();
        });
        ctx.on(refs.canvas, 'pointermove', updateBrushCursor);
        ctx.on(refs.canvas, 'pointerenter', function (event) { updateBrushCursor(event); });
        ctx.on(document, 'keydown', function (event) {
          var mod = event.ctrlKey || event.metaKey;
          if (!mod) return;
          var focused = P.wm.getFocused();
          if (!focused || focused.id !== ctx.winId) return;
          if (document.querySelector('.paper-dialog[open]')) return;
          if (event.key.toLowerCase() === 'z') {
            event.preventDefault();
            if (event.shiftKey) redo();
            else undo();
          }
        });
        ctx.subscribeSave(saveLabel);
        ctx.subscribeWindows(function () {
          var focused = P.wm.getFocused();
          if (focused && focused.id === ctx.winId) fitCanvas();
        });
        ctx.observeResize(function () { fitCanvas(); }, refs.stage);
        ctx.observeResize(function () { syncGalleryNav(); }, refs.gallery);
        ctx.on(refs.gallery, 'scroll', syncGalleryNav, { passive: true });
        ctx.subscribe(function (event) {
          if (event.type !== 'nodes') return;
          var doc = currentDoc();
          if (currentId && !doc) {
            var name = refs.docTitle ? refs.docTitle.textContent : missingName;
            showMissing(name);
            return;
          }
          if (doc) {
            if (refs.docTitle) refs.docTitle.textContent = doc.name;
            ctx.setTitle(doc.name);
            renderGallery();
            updateToolbar();
          } else {
            renderGallery();
          }
        });
        ctx.setTitle('画纸');
        updateToolbar();
        setupCanvas();

        if (params && params.docId) {
          var doc = P.data.getNode(params.docId);
          if (doc && doc.kind === 'drawing') selectDrawing(doc.id);
          else showMissing(params.docId);
        } else {
          var drawings = P.data.listDrawings();
          if (drawings.length) selectDrawing(drawings[0].id);
          else showEmpty();
        }
        saveLabel(P.storage.getStatus());
      }

      return {
        mount: mount,
        updateParams: function (params) {
          if (!params || !params.docId) return;
          if (params.docId === currentId) return;
          var doc = P.data.getNode(params.docId);
          if (doc && doc.kind === 'drawing') selectDrawing(doc.id);
          else showMissing(params.docId);
        },
        destroy: function () {
          if (drawing) finishStroke();
          else if (hasUnsaved && currentDoc()) saveDrawing(true);
        }
      };
    }
  });
})();

/* ===== src/js/apps/settings.js ===== */
/* ============================================================
   PAPER OS — Settings, workspace data & about
   ============================================================ */
(function () {
  'use strict';

  var P = window.PaperOS;
  var U = P.util;
  var SECTIONS = ['commands', 'appearance', 'workspace', 'shortcuts', 'about'];
  function isMac() {
    return /Mac|iPhone|iPad/.test(navigator.platform || '');
  }

  P.registerApp({
    id: 'settings',
    name: '纸屿设置',
    english: 'PAPER SETTINGS',
    description: '命令与应用、外观、数据备份、快捷键与关于',
    desktop: false,
    dock: false,
    defaultSize: { w: 700, h: 730 },
    minSize: { w: 430, h: 400 },
    create: function (ctx) {
      var refs = {};
      var currentSection = 'appearance';
      var importInput = null;

      function isSection(id) {
        return SECTIONS.indexOf(id) !== -1;
      }

      function setSection(id) {
        if (!isSection(id)) id = 'appearance';
        currentSection = id;
        if (!refs.root) return;
        refs.nav.querySelectorAll('[data-section]').forEach(function (button) {
          var active = button.getAttribute('data-section') === id;
          button.classList.toggle('is-active', active);
          button.setAttribute('aria-selected', active ? 'true' : 'false');
          button.setAttribute('tabindex', active ? '0' : '-1');
        });
        refs.content.querySelectorAll('[data-section-panel]').forEach(function (panel) {
          var active = panel.getAttribute('data-section-panel') === id;
          panel.classList.toggle('is-active', active);
          panel.hidden = !active;
        });
        var panel = refs.content.querySelector('[data-section-panel="' + id + '"]');
        if (panel) refs.content.scrollTop = 0;
        if (id === 'commands') {
          renderCommands();
          if (refs.commandInput) setTimeout(function () { refs.commandInput.focus({ preventScroll: true }); }, 40);
        }
      }

      /* ---------------- 命令与应用 ---------------- */

      var commandState = { items: [], active: -1 };

      function commandGroups() {
        var api = P.commands;
        if (!api) return [];
        var query = refs.commandInput ? String(refs.commandInput.value || '').trim() : '';
        var lower = query.toLowerCase();
        var commands = api.list().map(function (command, order) {
          return { command: command, score: api.score(command, lower), order: order };
        }).filter(function (entry) { return entry.score >= 0; }).sort(function (a, b) {
          if (b.score !== a.score) return b.score - a.score;
          return a.order - b.order;
        }).map(function (entry) { return entry.command; });
        var groups = [
          { label: '应用', items: commands.filter(function (c) { return c.group === '应用'; }) },
          { label: '操作', items: commands.filter(function (c) { return c.group === '操作'; }) }
        ];
        var docs = api.docs(query);
        groups.push({ label: query ? '纸页与画作' : '最近纸页', items: docs });
        return groups.filter(function (group) { return group.items.length; });
      }

      function setCommandActive(index) {
        commandState.active = index;
        commandState.items.forEach(function (button, i) {
          button.classList.toggle('is-active', i === index);
          button.setAttribute('aria-selected', i === index ? 'true' : 'false');
        });
        if (refs.commandInput) {
          var current = commandState.items[index];
          if (current && current.id) refs.commandInput.setAttribute('aria-activedescendant', current.id);
          else refs.commandInput.removeAttribute('aria-activedescendant');
        }
        var active = commandState.items[index];
        if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
      }

      function runCommand(button) {
        if (!button) return;
        var run = button._runCommand;
        if (typeof run !== 'function') return;
        var settingsWin = P.wm.getWindows().filter(function (w) { return w.appId === 'settings'; })[0];
        var beforeSection = settingsWin && settingsWin.params ? settingsWin.params.section : null;
        try { run(); } catch (err) {
          if (window.console) console.error(err);
          P.ui.toast('这一下没有完成。', { kind: 'error' });
          return;
        }
        /* 命令的落点不是设置（不管是新开窗口还是把已有窗口拿到前面），就把设置收起来；
           只是在本窗口里切分区（比如「打开设置 · 工作区」）时留着，否则会把自己收掉。 */
        var after = P.wm.getWindows();
        var stillSettings = after.filter(function (w) { return w.appId === 'settings'; })[0];
        var sectionChanged = stillSettings && stillSettings.params && stillSettings.params.section !== beforeSection;
        var focused = P.wm.getFocused ? P.wm.getFocused() : null;
        if (stillSettings && !sectionChanged && focused && focused.appId !== 'settings') {
          P.wm.minimize(stillSettings.id);
        }
      }

      function renderCommands() {
        if (!refs.commandResults || !P.commands) return;
        var results = refs.commandResults;
        results.innerHTML = '';
        commandState.items = [];
        commandState.active = -1;
        var groups = commandGroups();
        groups.forEach(function (group) {
          var box = document.createElement('div');
          box.className = 'command-sheet__group';
          var label = document.createElement('p');
          label.className = 'command-sheet__group-label';
          label.textContent = group.label;
          box.appendChild(label);
          group.items.forEach(function (item) {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'command-item';
            button.id = 'command-option-' + commandState.items.length;
            button.setAttribute('role', 'option');
            button.setAttribute('aria-selected', 'false');
            var iconBox = document.createElement('span');
            iconBox.className = 'command-item__icon';
            iconBox.innerHTML = item.iconApp ? P.appIcon(item.iconApp) : P.icon(item.icon || 'sparkles');
            var text = document.createElement('span');
            text.className = 'command-item__text';
            var name = document.createElement('span');
            name.className = 'command-item__name';
            name.textContent = item.label;
            var hint = document.createElement('span');
            hint.className = 'command-item__hint';
            hint.textContent = item.hint || '';
            text.appendChild(name);
            text.appendChild(hint);
            var key = document.createElement('span');
            key.className = 'command-item__key';
            key.textContent = item.group === '应用' ? '打开' : item.iconApp ? '翻开' : '';
            button.appendChild(iconBox);
            button.appendChild(text);
            button.appendChild(key);
            button._runCommand = item.run;
            button.addEventListener('mouseenter', function () { setCommandActive(commandState.items.indexOf(button)); });
            button.addEventListener('click', function () { runCommand(button); });
            box.appendChild(button);
            commandState.items.push(button);
          });
          results.appendChild(box);
        });
        if (!commandState.items.length) {
          var empty = document.createElement('div');
          empty.className = 'command-sheet__empty';
          empty.textContent = '没有找到这张纸。换一个词，或者从应用开始。';
          results.appendChild(empty);
          return;
        }
        setCommandActive(0);
      }

      function bindCommands() {
        if (!refs.commandInput) return;
        refs.commandInput.addEventListener('input', renderCommands);
        refs.commandInput.addEventListener('keydown', function (event) {
          if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault();
            if (!commandState.items.length) return;
            var delta = event.key === 'ArrowDown' ? 1 : -1;
            setCommandActive((commandState.active + delta + commandState.items.length) % commandState.items.length);
            return;
          }
          if (event.key === 'Enter') {
            event.preventDefault();
            runCommand(commandState.items[commandState.active]);
            return;
          }
          if (event.key === 'Escape') {
            event.preventDefault();
            refs.commandInput.value = '';
            renderCommands();
            return;
          }
        });
      }

      function updateToneButtons() {
        var prefs = P.data.getPrefs();
        if (refs.textureToggle) {
          refs.textureToggle.setAttribute('aria-pressed', prefs.paperTexture === false ? 'false' : 'true');
        }
        if (refs.gridToggle) {
          refs.gridToggle.setAttribute('aria-pressed', prefs.showGrid ? 'true' : 'false');
        }
        if (refs.motionSelect) refs.motionSelect.value = prefs.motion;
        if (refs.langSelect) refs.langSelect.value = prefs.lang;
        if (refs.themeSelect) refs.themeSelect.value = prefs.theme;
        if (refs.handSelect) refs.handSelect.value = prefs.handFont;
      }

      function updateStorageLine() {
        if (!refs.storageLine) return;
        var status = P.storage.getStatus();
        var label = P.storage.getModeLabel();
        var tail = '';
        if (status.phase === 'saved' && status.at) tail = ' · 最近保存 ' + U.formatTime(status.at);
        else if (status.phase === 'saving') tail = ' · 正在保存';
        else if (status.phase === 'pending') tail = ' · 待保存';
        else if (status.phase === 'error') tail = ' · ' + (status.error || '保存遇到问题');
        refs.storageLine.textContent = label + tail;
        refs.storageLine.setAttribute('data-state', status.phase === 'error' ? 'error' : 'ok');
        if (refs.storageMode) refs.storageMode.textContent = P.storage.getModeLabel();
      }

      function getStats() {
        var data = P.data.snapshotData();
        var folders = data.nodes.filter(function (n) { return n.type === 'folder'; }).length;
        var notes = data.nodes.filter(function (n) { return n.kind === 'note'; }).length;
        var drawings = data.nodes.filter(function (n) { return n.kind === 'drawing'; }).length;
        return {
          folders: folders,
          notes: notes,
          drawings: drawings,
          stickies: data.stickies.length,
          tasks: data.tasks.length,
          examples: P.data.getExampleCounts()
        };
      }

      function updateStats() {
        if (!refs.stats) return;
        var stats = getStats();
        var values = {
          notes: stats.notes,
          folders: stats.folders,
          drawings: stats.drawings,
          stickies: stats.stickies,
          tasks: stats.tasks,
          windows: P.wm.getWindows().length
        };
        Object.keys(values).forEach(function (key) {
          var node = refs.stats.querySelector('[data-stat="' + key + '"]');
          if (node) node.textContent = String(values[key]);
        });
        var examples = stats.examples.nodes + stats.examples.stickies + stats.examples.tasks;
        if (refs.examplesCount) refs.examplesCount.textContent = examples ? F('还有 {n} 件示例内容', examples) : '示例内容已经清理干净';
        if (refs.examplesAction) refs.examplesAction.disabled = examples === 0;
      }

      function showImportError(title, message) {
        P.ui.dialog({
          kicker: 'PAPER OS · 工作区',
          title: title || '工作区没有变更',
          description: message,
          actions: [{ label: '知道了', value: true, kind: 'primary' }]
        });
        P.ui.toast('导入没有完成，原有工作区保持原样。', { kind: 'warn' });
      }

      function handleImportFile(file) {
        if (!file) return;
        if (file.size > 16 * 1024 * 1024) {
          showImportError('文件太大了', '纸屿工作区最大为 16 MB。当前工作区没有任何改动。');
          return;
        }
        var read;
        try {
          read = typeof file.text === 'function' ? file.text() : new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function () { resolve(String(reader.result || '')); };
            reader.onerror = function () { reject(reader.error || new Error('无法读取文件。')); };
            reader.readAsText(file);
          });
        } catch (err) {
          showImportError('文件没有读出来', '当前工作区没有任何改动。');
          return;
        }
        read.then(function (text) {
          var raw;
          try {
            raw = JSON.parse(text);
          } catch (err) {
            showImportError('这不是一份有效的 JSON', '文件解析失败。当前工作区没有任何改动。');
            return;
          }
          var result = P.ingestWorkspace(raw);
          if (!result.ok) {
            showImportError('这份工作区没有被接受', result.error + '\n\n当前工作区没有任何改动。');
            return;
          }
          var summary = result.summary;
          var message = '将用导入的文件替换现在的桌面：\n' +
            summary.folders + ' 个文件夹 · ' + summary.notes + ' 张纸页 · ' + summary.drawings + ' 张画纸\n' +
            summary.stickies + ' 张便签 · ' + summary.tasks + ' 条待办 · ' + summary.windows + ' 扇窗口\n\n' +
            '当前内容会被替换。建议先导出一份备份。导入成功后会重新铺开桌面。';
          P.ui.confirm({
            kicker: 'PAPER OS · 导入工作区',
            title: '换一个桌面住进来？',
            message: message,
            confirmLabel: '确认导入',
            cancelLabel: '不，保留现在的',
            danger: true
          }).then(function (ok) {
            if (!ok) return;
            P.storage.replaceWith(result.snapshot).then(function () {
              P.ui.toast('工作区已经换好，桌面正在重新铺开。', { kind: 'info' });
              setTimeout(function () {
                if (window.__SCHEDULE_RESTART__) window.__SCHEDULE_RESTART__({ snapshot: result.snapshot });
                else window.location.reload();
              }, 420);
            }).catch(function (err) {
              showImportError('导入写入失败', '本地存储没有接受这份工作区：' + (err && err.message ? err.message : '未知原因') + '。当前工作区没有被替换。');
            });
          });
        }).catch(function (err) {
          showImportError('文件没有读出来', (err && err.message ? err.message : '无法读取这个文件。') + ' 当前工作区没有任何改动。');
        });
      }

      function bindWorkspaceActions() {
        var exportButton = refs.root.querySelector('[data-export]');
        if (exportButton) {
          exportButton.addEventListener('click', function () {
            P.downloadWorkspace();
          });
        }
        var importButton = refs.root.querySelector('[data-import]');
        if (importInput) {
          importInput.addEventListener('change', function () {
            var file = importInput.files && importInput.files[0];
            importInput.value = '';
            handleImportFile(file);
          });
        }
        if (importButton) {
          importButton.addEventListener('click', function () { if (importInput) importInput.click(); });
        }
        var clearButton = refs.root.querySelector('[data-clear-examples]');
        if (clearButton) {
          clearButton.addEventListener('click', function () {
            var examples = P.data.getExampleCounts();
            var total = examples.nodes + examples.stickies + examples.tasks;
            if (!total) {
              P.ui.toast('示例内容已经清理干净了。', { kind: 'info' });
              return;
            }
            P.ui.confirm({
              kicker: 'PAPER OS · 整理',
              title: '把示例内容收走？',
              message: '会移除 ' + examples.nodes + ' 个示例纸页、' + examples.stickies + ' 张示例便签和 ' + examples.tasks + ' 条示例待办。\n你自己添加的内容会保留，不会一起消失。',
              confirmLabel: '清掉示例',
              cancelLabel: '先留着',
              danger: true
            }).then(function (ok) {
              if (!ok) return;
              var removed = P.data.clearExamples();
              updateStats();
              P.ui.toast('示例已经收好，桌面上只剩下你的纸。', { kind: 'info' });
              var totalRemoved = removed.nodes.length + removed.stickies.length + removed.tasks.length;
              if (totalRemoved) P.ui.toast(F('一共收走了 {n} 件示例内容。', totalRemoved), { kind: 'info' });
            });
          });
        }
        var resetButton = refs.root.querySelector('[data-reset]');
        if (resetButton) {
          resetButton.addEventListener('click', function () {
            P.ui.confirm({
              kicker: 'PAPER OS · 危险',
              title: '把整张桌子清空？',
              message: '这会删除全部纸页、便签、待办、画纸和桌面布局，并重新铺一张带示例内容的空桌面。\n这个动作无法撤销。建议先导出一份工作区。',
              confirmLabel: '清空全部',
              cancelLabel: '不要清空',
              danger: true
            }).then(function (ok) {
              if (!ok) return;
              P.storage.clearAll().then(function () {
                P.ui.toast('桌面正在重新铺开。', { kind: 'info' });
                setTimeout(function () {
                  if (window.__SCHEDULE_RESTART__) window.__SCHEDULE_RESTART__({ cleared: true });
                  else window.location.reload();
                }, 420);
              }).catch(function (err) {
                P.ui.toast('没有清空成功：' + (err && err.message ? err.message : '未知原因'), { kind: 'error' });
              });
            });
          });
        }
      }

      /* 「命令与应用」：原来那块独立浮层的内容，现在只是设置里的一个分区。
         数据与执行来自 P.commands（shell 里那份唯一清单），这里只负责画与按键。 */
      function buildCommands() {
        return '<h2 class="settings-section__title">命令与应用</h2>' +
          '<p class="settings-section__intro">搜索应用、纸页或动作。选中回车即可执行；打开别的窗口后，设置会自动收起让出桌面。</p>' +
          '<div class="command-sheet" data-command-sheet>' +
          '<div class="command-sheet__search">' + P.icon('search') +
          '<input class="command-sheet__input" type="text" data-command-input role="combobox" aria-label="搜索应用、纸页或操作" aria-autocomplete="list" aria-expanded="true" aria-controls="command-results" aria-activedescendant="" placeholder="找一张纸，或做一件事…" autocomplete="off" spellcheck="false">' +
          '<span class="command-sheet__esc">ESC</span></div>' +
          '<div class="command-sheet__results" id="command-results" role="listbox" aria-label="搜索结果" data-command-results></div>' +
          '<div class="command-sheet__footer"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span></div>' +
          '</div>';
      }

      function buildAppearance() {
        return '<h2 class="settings-section__title">外观</h2>' +
          '<p class="settings-section__intro">配色与 DSH 保持一致；这里再调纸纹、便签字形、桌面网格和动效。设置会自动保存。</p>' +
          /* 这一行的文案在 F() 里：它们是页面新增的静态字（语言 / 界面语言 / 中文 / 说明），
             走 en.templates.json（页面 owner）而不是 en.json（由页面抽取生成），
             构建按 F('…') 跳过静态替换，所以这些字不会在英文页里被二次翻译。 */
          '<div class="setting-row"><div class="setting-row__copy"><span class="setting-row__label">' + F('语言', {}) + '</span>' +
          '<p class="setting-row__desc">' + F('跟随 DSH 时用宿主界面语言；也可以固定中文或 English。改完会重新铺一次纸张。', {}) + '</p></div>' +
          '<div class="select-wrap"><select data-lang-select aria-label="' + F('界面语言', {}) + '">' +
          '<option value="system">跟随 DSH</option><option value="zh">' + F('中文', {}) + '</option><option value="en">English</option>' +
          '</select></div></div>' +
          '<div class="setting-row"><div class="setting-row__copy"><span class="setting-row__label">配色</span>' +
          '<p class="setting-row__desc">跟随 DSH 时会跟着宿主的浅色／深色一起变。</p></div>' +
          '<div class="select-wrap"><select data-theme-select aria-label="配色方案">' +
          '<option value="system">跟随 DSH</option><option value="light">浅色</option><option value="dark">深色</option>' +
          '</select></div></div>' +
          '<div class="setting-row"><div class="setting-row__copy"><span class="setting-row__label">便签字形</span>' +

          '</div></div>';
        ctx.body.appendChild(root);
        refs.nav = root.querySelector('[data-nav]');
        refs.content = root.querySelector('[data-content]');
        refs.commandInput = root.querySelector('[data-command-input]');
        refs.commandResults = root.querySelector('[data-command-results]');
        refs.textureToggle = root.querySelector('[data-texture-toggle]');
        refs.gridToggle = root.querySelector('[data-grid-toggle]');
        refs.motionSelect = root.querySelector('[data-motion-select]');
          refs.langSelect = root.querySelector('[data-lang-select]');
        refs.themeSelect = root.querySelector('[data-theme-select]');
        refs.handSelect = root.querySelector('[data-hand-select]');
        refs.storageLine = root.querySelector('[data-storage-line]');
        refs.storageMode = root.querySelector('[data-storage-mode]');
        refs.stats = root.querySelector('[data-stats]');
        refs.examplesCount = root.querySelector('[data-examples-count]');
        refs.examplesAction = root.querySelector('[data-clear-examples]');
        importInput = root.querySelector('[data-import-file]');
        refs.nav.querySelectorAll('[data-section]').forEach(function (button) {
          button.addEventListener('click', function () {
            var id = button.getAttribute('data-section');
            setSection(id);
            ctx.setParams({ section: id });
          });
          button.addEventListener('keydown', function (event) {
            var index = SECTIONS.indexOf(button.getAttribute('data-section'));
            if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
              event.preventDefault();
              var next = SECTIONS[(index + 1) % SECTIONS.length];
              setSection(next);
              ctx.setParams({ section: next });
              var target = refs.nav.querySelector('[data-section="' + next + '"]');
              if (target) target.focus();
            } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
              event.preventDefault();
              var prev = SECTIONS[(index - 1 + SECTIONS.length) % SECTIONS.length];
              setSection(prev);
              ctx.setParams({ section: prev });
              var prevTarget = refs.nav.querySelector('[data-section="' + prev + '"]');
              if (prevTarget) prevTarget.focus();
            }
          });
        });
        bindCommands();
        var dockReset = root.querySelector('[data-dock-reset]');
        if (dockReset) {
          dockReset.addEventListener('click', function () {
            P.data.setPrefs({ dockOrder: [] });
            if (P.shell.buildDock) P.shell.buildDock();
            P.ui.toast('应用坞回到默认顺序。', { kind: 'info' });
          });
        }
        if (refs.textureToggle) {
          refs.textureToggle.addEventListener('click', function () {
            var next = P.data.getPrefs().paperTexture === false;
            P.data.setPrefs({ paperTexture: next });
            P.shell.applyPrefs();
            updateToneButtons();
          });
        }
        refs.gridToggle.addEventListener('click', function () {
          var next = !P.data.getPrefs().showGrid;
          P.data.setPrefs({ showGrid: next });
          P.shell.applyPrefs();
          updateToneButtons();
        });
        refs.motionSelect.addEventListener('change', function () {
          P.data.setPrefs({ motion: refs.motionSelect.value });
          P.shell.applyPrefs();
          updateToneButtons();
        });
        refs.langSelect.addEventListener('change', function () {
          P.data.setPrefs({ lang: refs.langSelect.value });
          P.shell.applyPrefs();
          updateToneButtons();
          /* 语言要换的是整页（页面变体），不是当前文档里的字符串：
             先落盘，再把快照交给宿主重铺 iframe。没有宿主时就不动，只记住偏好。 */
          var restart = window.__SCHEDULE_RESTART__;
          if (typeof restart !== 'function') return;
          var go = function () {
            var snap = null;
            try { snap = P.storage.capture ? P.storage.capture() : null; } catch (err) { snap = null; }
            restart({ snapshot: snap });
          };
          if (P.storage && typeof P.storage.flush === 'function') {
            var pending = P.storage.flush();
            if (pending && typeof pending.then === 'function') pending.then(go, go);
            else go();
          } else {
            go();
          }
        });
        refs.themeSelect.addEventListener('change', function () {
          P.data.setPrefs({ theme: refs.themeSelect.value });
          P.shell.applyPrefs();
          updateToneButtons();
        });
        refs.handSelect.addEventListener('change', function () {
          P.data.setPrefs({ handFont: refs.handSelect.value });
          P.shell.applyPrefs();
          updateToneButtons();
        });
        bindWorkspaceActions();
        var replayTour = root.querySelector('[data-replay-tour]');
        if (replayTour) {
          replayTour.addEventListener('click', function () {
            if (P.wm && ctx.winId) P.wm.close(ctx.winId);
            setTimeout(function () { if (P.tour) P.tour.start(); }, 80);
          });
        }
        ctx.subscribe(function (event) {
          if (event.type === 'prefs') updateToneButtons();
          if (event.type === 'nodes' || event.type === 'stickies' || event.type === 'tasks') updateStats();
        });
        ctx.subscribeSave(function () {
          updateStorageLine();
        });
        ctx.subscribeWindows(function () { updateStats(); });
        ctx.cleanup(function () { importInput = null; });
        updateToneButtons();
        updateStorageLine();
        updateStats();
        var wanted = params && params.section && isSection(params.section) ? params.section : 'appearance';
        setSection(wanted);
        ctx.setTitle('纸屿设置');
        if (params && params.section) ctx.setParams({ section: params.section });
      }

      return {
        mount: mount,
        updateParams: function (params) {
          if (params && params.section) setSection(params.section);
        },
        destroy: function () {}
      };
    }
  });
})();


/* ===== guided tour ===== */
(function () {
  'use strict';

  var P = window.PaperOS;
  var SEEN_KEY = 'paper-os.tour.seen.v1';
  var root = null;
  var spot = null;
  var card = null;
  var titleEl = null;
  var bodyEl = null;
  var kickerEl = null;
  var dotsEl = null;
  var prevBtn = null;
  var nextBtn = null;
  var skipBtn = null;
  var index = 0;
  var opened = false;

  function sawTour() {
    try { return window.localStorage.getItem(SEEN_KEY) === '1'; } catch (err) { return false; }
  }
  function markSeen() {
    try { window.localStorage.setItem(SEEN_KEY, '1'); } catch (err) { /* ignore */ }
  }
  function dismissWelcome() {
    P.data.setPrefs({ welcomeDismissed: true });
    var cardEl = document.getElementById('first-run');
    if (cardEl) cardEl.hidden = true;
  }
  function openStickies() {
    P.wm.open('stickies');
    var stuck = P.data.listStickies();
    if (!stuck.length && P.data.createSticky) {
      P.data.createSticky({ x: 34, y: 34, color: 'butter', text: '' });
    }
  }
  function findWindow() {
    var wins = document.querySelectorAll('.window');
    return wins.length ? wins[wins.length - 1] : null;
  }

  var steps = [
    {
      title: '所有应用都在底部',
      body: F('便签、纸页笔记、日历和画纸都从<b>底部应用坞</b>打开。再点一次已打开的图标，窗口会最小化。', {}),
      target: function () { return document.getElementById('dock'); },
      placement: 'top'
    },
    {
      title: '窗口怎么操作',
      body: F('拖<b>标题栏</b>移动窗口，拖右下角缩放。没有缩小/放大/关闭按钮：点底部应用坞图标可最小化或恢复，房子按钮一次收好全部窗口，按 Esc 关闭当前窗口。', {}),
      target: function () { var win = findWindow(); return win ? win.querySelector('.window__titlebar') : null; },
      placement: 'bottom',
      before: function () { openStickies(); }
    },
    {
      title: '便签只从把手拖动',
      body: F('按住便签顶部左侧的<b>把手</b>再拖动；正文区域只负责输入，不会误拖。', {}),
      target: function () { return document.querySelector('.sticky__drag'); },
      placement: 'bottom',
      fallbackTarget: function () { var win = findWindow(); return win ? win.querySelector('.window__titlebar') : null; }
    },
    {
      title: '一键收好桌面',
      body: F('不想一个个关窗口？点最右边的<b>房子按钮</b>，或直接点窗口外的空白桌面，所有窗口会收进应用坞。再点应用坞里的图标就能恢复。', {}),
      target: function () { return document.querySelector('[data-testid="dock-home"]'); },
      placement: 'top'
    },
    {
      title: '保存和备份',
      body: '内容会自动保存，右上角显示保存状态。设置 → 数据与备份可以导出备份，也能重新播放这份导览。',
      target: function () { return document.getElementById('save-pill'); },
      placement: 'bottom'
    },
    {
      title: '可以开始了',
      body: '从底部打开便签，写下第一句话。需要帮助时，随时在设置 → 快捷键里重新播放导览。',
      target: null,
      placement: 'center'
    }
  ];

  function ensureDom() {
    if (root) return;
    root = document.createElement('div');
    root.className = 'tour';
    root.id = 'tour';
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-modal', 'true');
    root.setAttribute('aria-labelledby', 'tour-title');
    root.innerHTML =
      '<div class="tour__shade" aria-hidden="true"></div>' +
      '<div class="tour__spot" aria-hidden="true"></div>' +
      '<div class="tour__card">' +
      '<p class="tour__kicker" data-tour-kicker>新手导览</p>' +
      '<h2 class="tour__title" id="tour-title" data-tour-title></h2>' +
      '<p class="tour__body" data-tour-body></p>' +
      '<div class="tour__acts">' +
      '<span class="tour__dots" data-tour-dots aria-hidden="true"></span>' +
      '<button class="tour__btn tour__btn--ghost" type="button" data-tour-skip>跳过</button>' +
      '<button class="tour__btn" type="button" data-tour-prev>上一步</button>' +
      '<button class="tour__btn tour__btn--primary" type="button" data-tour-next>下一步</button>' +
      '</div></div>';
    document.body.appendChild(root);
    document.addEventListener('keydown', onKey, true);
    spot = root.querySelector('.tour__spot');
    card = root.querySelector('.tour__card');
    titleEl = root.querySelector('[data-tour-title]');
    bodyEl = root.querySelector('[data-tour-body]');
    kickerEl = root.querySelector('[data-tour-kicker]');
    dotsEl = root.querySelector('[data-tour-dots]');
    prevBtn = root.querySelector('[data-tour-prev]');
    nextBtn = root.querySelector('[data-tour-next]');
    skipBtn = root.querySelector('[data-tour-skip]');
    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);
    skipBtn.addEventListener('click', skip);
    window.addEventListener('resize', layout);
  }

  function dots() {
    dotsEl.innerHTML = '';
    for (var i = 0; i < steps.length; i += 1) {
      var dot = document.createElement('span');
      dot.className = 'tour__dot' + (i === index ? ' is-active' : '');
      dotsEl.appendChild(dot);
    }
  }

  function resolveTarget(step) {
    var target = step.target ? step.target() : null;
    if (!target && step.fallbackTarget) target = step.fallbackTarget();
    return target;
  }

  function layout() {
    if (!opened) return;
    var step = steps[index];
    var target = resolveTarget(step);
    var centered = !target || step.placement === 'center';
    root.classList.toggle('tour--centered', centered);
    card.style.left = '12px';
    card.style.top = '12px';
    if (centered) {
      spot.style.display = 'none';
      card.style.left = Math.max(12, (window.innerWidth - card.offsetWidth) / 2) + 'px';
      card.style.top = Math.max(12, (window.innerHeight - card.offsetHeight) / 2) + 'px';
      return;
    }
    spot.style.display = 'block';
    var rect = target.getBoundingClientRect();
    var pad = 8;
    spot.style.left = Math.max(4, rect.left - pad) + 'px';
    spot.style.top = Math.max(4, rect.top - pad) + 'px';
    spot.style.width = Math.max(18, rect.width + pad * 2) + 'px';
    spot.style.height = Math.max(18, rect.height + pad * 2) + 'px';
    var cw = card.offsetWidth;
    var ch = card.offsetHeight;
    var gap = 18;
    var margin = 12;
    var left = rect.left + rect.width / 2 - cw / 2;
    var top;
    if (step.placement === 'top' && rect.top - ch - gap > margin) {
      top = rect.top - ch - gap;
    } else if (rect.bottom + gap + ch < window.innerHeight - margin) {
      top = rect.bottom + gap;
    } else {
      top = Math.max(margin, rect.top - ch - gap);
    }
    left = Math.max(margin, Math.min(left, window.innerWidth - cw - margin));
    top = Math.max(margin, Math.min(top, window.innerHeight - ch - margin));
    card.style.left = left + 'px';
    card.style.top = top + 'px';
  }

  function render() {
    var step = steps[index];
    kickerEl.textContent = '新手导览 · ' + (index + 1) + ' / ' + steps.length;
    titleEl.textContent = step.title;
    bodyEl.innerHTML = step.body;
    dots();
    prevBtn.disabled = index === 0;
    nextBtn.textContent = index === steps.length - 1 ? '开始使用' : '下一步';
    skipBtn.style.display = index === steps.length - 1 ? 'none' : '';
    if (step.before) step.before();
    requestAnimationFrame(function () { requestAnimationFrame(layout); });
    setTimeout(layout, 220);
    setTimeout(layout, 520);
  }

  function go(nextIndex) {
    if (nextIndex < 0 || nextIndex >= steps.length) return;
    index = nextIndex;
    render();
  }
  function next() {
    if (index === steps.length - 1) { finish(); return; }
    go(index + 1);
  }
  function prev() { go(index - 1); }
  function finish() {
    markSeen();
    dismissWelcome();
    close();
  }
  function skip() {
    markSeen();
    close();
  }
  function close() {
    opened = false;
    if (root) root.classList.remove('is-open');
  }
  function onKey(event) {
    if (!opened) return;
    if (event.key === 'Escape') { event.preventDefault(); skip(); return; }
    if (event.key === 'ArrowRight') { event.preventDefault(); next(); return; }
    if (event.key === 'ArrowLeft') { event.preventDefault(); prev(); }
  }
  function start(force) {
    if (opened) return;
    if (!force && sawTour()) return;
    ensureDom();
    index = 0;
    opened = true;
    root.classList.add('is-open');
    render();
    setTimeout(function () { if (nextBtn) nextBtn.focus({ preventScroll: true }); }, 60);
  }

  P.tour = {
    start: function () { start(true); },
    startOnce: function () { start(false); },
    close: close,
    isOpen: function () { return opened; },
    seen: sawTour
  };
})();

/* ===== DSH host bridge ===== */
(function () {
  'use strict';
  if (!window.parent || window.parent === window) return;
  window.__SCHEDULE_HOST_BRIDGE__ = true;
  var P = window.PaperOS;
  var readyPosted = false;
  function send(type, payload) {
    try {
      var message = Object.assign({ type: 'dsh-plugin-control-your-schedule:' + type }, payload || {});
      window.parent.postMessage(message, '*');
    } catch (err) { /* parent unavailable */ }
  }
  function snapshot() {
    try { return P.storage.capture ? P.storage.capture() : P.data.snapshotData(); } catch (err) { return null; }
  }
  function postReady() {
    if (readyPosted) return;
    readyPosted = true;
    send('ready', { snapshot: window.__SCHEDULE_HOST_SNAPSHOT__ || snapshot() });
  }
  function postSave() {
    var snap = snapshot();
    if (snap) send('save', { snapshot: snap });
  }
  window.__SCHEDULE_RESTART__ = function (payload) { send('restart', payload || {}); };
  /* 宿主拆 iframe 之前会要一份"现在就存"的快照（flush-now）。
     这里先立刻落一次盘再回话，把 420ms 防抖窗口关掉。 */
  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || typeof data.type !== 'string') return;
    if (data.type === 'dsh-plugin-control-your-schedule:open-app') {
      /* 宿主输入框的「在便签里管理提示词」深链：只认注册过的应用 id。 */
      var appId = typeof data.appId === 'string' ? data.appId : '';
      if (!appId || !P.apps.has(appId)) return;
      try {
        P.wm.open(appId, data.params && typeof data.params === 'object' ? data.params : undefined);
      } catch (err) { /* 窗口开不出来也不能拖垮整页 */ }
      return;
    }
    if (data.type !== 'dsh-plugin-control-your-schedule:flush-now') return;
    try {
      if (P.storage && typeof P.storage.flushNow === 'function') P.storage.flushNow();
    } catch (err) { /* best effort */ }
    var snap = snapshot();
    if (snap) send('snapshot', { snapshot: snap });
  });
  P.storage.subscribeData(function (status) {
    if (status.phase === 'saved') postSave();
  });
  window.addEventListener('pagehide', postSave);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') postSave();
  });
  var timer = setInterval(function () {
    if (window.__PAPER_OS_READY__) {
      clearInterval(timer);
      postReady();
    }
  }, 120);
  setTimeout(function () { if (!readyPosted) postReady(); }, 9000);
})();

/* ===== boot ===== */
/* 启动失败也必须把"就绪"打出去：否则宿主永远停在加载遮罩上，
   用户看到的是无限转圈，而不是一个能读懂的错误。 */
try {
  PaperOS.start();
} catch (err) {
  window.__PAPER_OS_BOOT_ERROR__ = String((err && err.message) || err);
  if (window.console) console.error('PaperOS boot failed', err);
} finally {
  window.__PAPER_OS_READY__ = true;
}

</script>
