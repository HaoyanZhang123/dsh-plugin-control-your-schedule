  gap: 9px;
  border-top: 1px solid rgba(73, 73, 73, 0.09);
  color: var(--ink-faint);
  font-size: 12.5px;
  letter-spacing: 0.03em;
}

.editor-foot__delete {
  margin-left: auto;
  padding: 3px 0;
  color: var(--ink-faint);
  font-size: 13px;
}

.editor-foot__delete:hover {
  color: var(--clay-deep);
}

.notes-missing {
  position: absolute;
  z-index: 3;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  padding: 26px;
  background: rgba(246, 246, 246, 0.93);
  backdrop-filter: blur(2px);
  text-align: center;
}

.notes-missing__mark {
  display: grid;
  width: 48px;
  height: 48px;
  place-items: center;
  border: 1px dashed var(--line-strong);
  border-radius: 50%;
  color: var(--clay);
  font-family: var(--font-serif);
  font-size: 26px;
  transform: rotate(-3deg);
}

.notes-missing h3 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 19px;
  font-weight: 500;
}

.notes-missing p {
  max-width: 320px;
  margin: 0;
  color: var(--ink-faint);
  font-family: var(--font-serif);
  font-size: 15px;
  line-height: 1.8;
}

.notes-missing__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  justify-content: center;
  margin-top: 4px;
}

@container (max-width: 650px) {
  .notes-layout {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
  }

  .notes-rail {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .notes-rail__head {
    padding: 10px 12px 8px;
  }

  .notes-rail__top {
    margin-bottom: 7px;
  }

  .notes-rail__status {
    margin-top: 6px;
  }

  .notes-list {
    display: flex;
    flex: 0 0 auto;
    gap: 4px;
    max-height: 92px;
    padding: 0 8px 8px;
    overflow-x: auto;
    overflow-y: hidden;
  }

  .note-item {
    width: 178px;
    flex: 0 0 178px;
    padding: 7px 9px;
    border-color: rgba(73, 73, 73, 0.08);
    background: rgba(252, 252, 252, 0.3);
  }

  .note-item + .note-item {
    margin-top: 0;
  }

  .notes-list__empty {
    padding: 12px 16px;
  }

  .editor-sheet {
    margin: 10px 10px 9px;
    padding: 12px 17px 7px;
    background-image: linear-gradient(90deg, transparent 30px, rgba(185, 111, 80, 0.12) 30px 31px, transparent 31px), var(--paper-noise);
  }

  .note-title-input {
    font-size: 23px;
  }

  .editor-subrow {
    flex-wrap: wrap;
    gap: 6px;
    padding: 7px 0;
  }

  .note-body {
    font-size: 16px;
  }

  .editor-foot__delete {
    font-size: 12.5px;
  }
}

/* ============================================================
   3. File cabinet
   ============================================================ */

.files-app {
  container-type: inline-size;
  background-color: #f1f1f1;
}

.files-nav {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 7px;
  min-height: 38px;
  padding: 5px 15px;
  border-bottom: 1px dashed var(--line);
  background: rgba(245, 245, 245, 0.5);
}

.files-nav__back {
  display: grid;
  width: 25px;
  height: 25px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 2px;
  color: var(--ink-soft);
}

.files-nav__back:hover {
  border-color: var(--line);
  background: rgba(252, 252, 252, 0.6);
}

.files-nav__back:disabled {
  opacity: 0.28;
}

.files-nav__back svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.6;
}

.filecrumbs {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 2px;
  overflow-x: auto;
  color: var(--ink-faint);
  font-family: var(--font-serif);
  font-size: 14.5px;
  white-space: nowrap;
}

.filecrumbs button {
  max-width: 168px;
  overflow: hidden;
  padding: 3px 4px;
  border-radius: 2px;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 14.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.filecrumbs button:hover {
  background: rgba(252, 252, 252, 0.7);
  color: var(--ink);
}

.filecrumbs button:last-of-type {
  color: var(--ink);
  font-weight: 500;
}

.filecrumbs .crumb-sep {
  color: var(--ink-ghost);
  font-size: 14px;
}

.files-nav__path-count {
  flex: 0 0 auto;
  margin-left: auto;
  color: var(--ink-faint);
  font-size: 13px;
  letter-spacing: 0.03em;
}

.files-main {
  display: flex;
  min-height: 0;
  flex: 1 1 auto;
  flex-direction: column;
}

.files-list-head {
  display: grid;
  flex: 0 0 auto;
  grid-template-columns: minmax(0, 1fr) 70px 74px 96px;
  gap: 8px;
  padding: 8px 16px 6px 15px;
  color: var(--ink-faint);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.files-list {
  min-height: 0;
  flex: 1 1 auto;
  margin: 0;
  padding: 0 9px 12px;
  overflow-y: auto;
  list-style: none;
}

.file-row {
  display: grid;
  align-items: center;
  grid-template-columns: minmax(0, 1fr) 70px 74px 96px;
  gap: 8px;
  min-height: 47px;
  padding: 0 7px;
  border-top: 1px solid rgba(76, 76, 76, 0.09);
  transition: background 0.14s;
}

.file-row:last-child {
  border-bottom: 1px solid rgba(76, 76, 76, 0.09);
}

.file-row:hover {
  background: rgba(252, 252, 252, 0.5);
}

.file-open {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 10px;
  padding: 5px 4px;
  color: var(--ink);
  text-align: left;
}

.file-icon {
  display: grid;
  width: 26px;
  height: 30px;
  flex: 0 0 auto;
  place-items: center;
  color: var(--ink-soft);
}

.file-icon svg {
  width: 24px;
  height: 28px;
  overflow: visible;
}

.file-name-wrap {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 6px;
}

.file-name {
  min-width: 0;
  overflow: hidden;
  font-family: var(--font-serif);
  font-size: 14.5px;
  letter-spacing: 0.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-open:hover .file-name {
  color: var(--indigo-deep);
  text-decoration: underline;
  text-decoration-color: rgba(93, 93, 93, 0.35);
  text-underline-offset: 3px;
}

.file-type,
.file-date {
  overflow: hidden;
  color: var(--ink-faint);
  font-size: 13.5px;
  letter-spacing: 0.02em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 1px;
  opacity: 0;
  transition: opacity 0.14s;
}

@media (pointer: coarse) {
  .file-actions,
  .task-actions {
    opacity: 1;
  }
}

.file-row:hover .file-actions,
.file-row:focus-within .file-actions {
  opacity: 1;
}

.file-actions .icon-btn {
  width: 25px;
  height: 25px;
}

.file-actions .icon-btn svg {
  width: 13px;
  height: 13px;
}

.files-empty {
  display: flex;
  min-height: 0;
  flex: 1 1 auto;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 8px;
  padding: 28px;
  text-align: center;
}

.files-empty .empty-state {
  padding: 0;
}

.files-foot {
  display: flex;
  height: 28px;
  flex: 0 0 auto;
  align-items: center;
  gap: 7px;
  padding: 0 16px;
  border-top: 1px solid rgba(76, 76, 76, 0.1);
  color: var(--ink-faint);
  font-size: 12.5px;
  letter-spacing: 0.03em;
}

.files-foot .dot {
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: var(--ink-ghost);
}

.files-foot__hint {
  margin-left: auto;
  font-family: var(--font-serif);
  font-size: 12.5px;
}

.files-sample-note {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 7px;
  padding: 6px 15px;
  border-bottom: 1px dashed rgba(185, 111, 80, 0.2);
  color: rgba(155, 83, 58, 0.76);
  background: rgba(234, 210, 193, 0.16);
  font-family: var(--font-serif);
  font-size: 13.5px;
}

.files-sample-note .sample-tag {
  height: 15px;
  font-size: 12px;
}

@container (max-width: 640px) {
  .files-list-head {
    display: none;
  }

  .files-list {
    padding: 2px 6px 10px;
  }

  .file-row {
    grid-template-columns: minmax(0, 1fr) auto;
    min-height: 50px;
    gap: 4px;
  }

  .file-type,
  .file-date {
    display: none;
  }

  .file-actions {
    opacity: 1;
  }

  .files-nav {
    padding: 5px 10px;
  }

  .files-nav__path-count {
    display: none;
  }

  .files-foot__hint {
    display: none;
  }
}

/* ============================================================
   4. Calendar & tasks
   ============================================================ */

.calendar-app {
  container-type: inline-size;
  background-color: #f1f1f1;
}

.calendar-layout {
  display: grid;
  min-height: 0;
  flex: 1 1 auto;
  grid-template-columns: minmax(0, 1fr) minmax(260px, 0.38fr);
}

.calendar-month {
  display: flex;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
  padding: 15px 17px 12px;
}

.calendar-month__head {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.calendar-month__title-wrap {
  display: flex;
  min-width: 0;
  flex: 1 1 auto;
  align-items: baseline;
  gap: 8px;
}

.calendar-month__title {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 25px;
  font-weight: 400;
  letter-spacing: 0.02em;
  line-height: 1;
}

.calendar-month__year {
  color: var(--ink-faint);
  font-family: var(--font-ui);
  font-size: 13px;
  letter-spacing: 0.12em;
}

.calendar-month__nav {
  display: grid;
  width: 27px;
  height: 27px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--ink-soft);
  transition: background 0.15s, border-color 0.15s;
}

.calendar-month__nav:hover {
  border-color: var(--ink-soft);
  background: rgba(252, 252, 252, 0.7);
}

.calendar-month__nav svg {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.6;
}

.calendar-month__today {
  height: 27px;
  margin-left: 2px;
  padding: 0 9px;
  border: 1px solid rgba(185, 111, 80, 0.38);
  border-radius: 2px;
  color: var(--clay-deep);
  font-size: 13.5px;
  letter-spacing: 0.04em;
  transition: background 0.15s;
}

.calendar-month__today:hover {
  background: var(--clay-soft);
}

.calendar-weekdays {
  display: grid;
  flex: 0 0 auto;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border-bottom: 1px solid var(--line);
  color: var(--ink-faint);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.12em;
  text-align: center;
}

.calendar-weekdays span {
  padding: 5px 0 7px;
}

.calendar-weekdays span:last-child,
.calendar-weekdays span:first-child {
  color: var(--clay-deep);
  opacity: 0.7;
}

.calendar-grid {
  display: grid;
  min-height: 0;
  flex: 1 1 auto;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-auto-rows: minmax(42px, 1fr);
  border-left: 1px solid rgba(76, 76, 76, 0.09);
  border-top: 1px solid rgba(76, 76, 76, 0.09);
}

.cal-day {
  position: relative;
  display: flex;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  padding: 6px 7px;
  border-right: 1px solid rgba(76, 76, 76, 0.09);
  border-bottom: 1px solid rgba(76, 76, 76, 0.09);
  color: var(--ink-soft);
  background: rgba(248, 248, 248, 0.2);
  transition: background 0.14s;
}

.cal-day:hover {
  background: rgba(252, 252, 252, 0.66);
}

.cal-day.is-outside {
  color: var(--ink-faint);
  background: rgba(231, 231, 231, 0.22);
}

.cal-day.is-selected {
  background: rgba(224, 224, 224, 0.4);
}

.cal-day.is-selected::after {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 12px;
  height: 12px;
  border-right: 2px solid var(--sage);
  border-bottom: 2px solid var(--sage);
  content: "";
}

.cal-day__num {
  display: inline-grid;
  width: 25px;
  height: 25px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 50%;
  color: inherit;
  font-family: var(--font-serif);
  font-size: 14.5px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.cal-day.is-today .cal-day__num {
  border: 1px dotted var(--clay);
  color: var(--clay-deep);
}

.cal-day.is-selected .cal-day__num {
  color: #f6f6f6;
  background: var(--ink);
  box-shadow: 0 0 0 3px rgba(53, 53, 53, 0.08);
}

.cal-day.is-today.is-selected .cal-day__num {
  border-color: transparent;
}

.cal-day__dots {
  display: flex;
  width: 100%;
  min-height: 6px;
  flex: 1 1 auto;
  flex-direction: column;
  justify-content: flex-start;
  gap: 3px;
  padding-left: 5px;
}

/* 未做完的在上面，做完的单独沉到格子底部：两类点的位置一眼能分开。 */
.cal-day__dot-row {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}

.cal-day__dot-row--done {
  margin-top: auto;
}

.calendar-month__title-wrap {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.count-chip--month {
  margin-left: 2px;
  color: var(--ink-faint);
  font-size: 12px;
}

.cal-day__dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--sage);
  box-shadow: inset 0 0 0 1px rgba(54, 54, 54, 0.14);
}

.cal-day__dot[data-priority="urgent-important"] { background: #d8a4a0; }
.cal-day__dot[data-priority="important"] { background: #d9c47c; }
.cal-day__dot[data-priority="urgent"] { background: #bdbdbd; }
.cal-day__dot[data-priority="none"] { background: #bebebe; }

/* 完成 = 同一格、同一位置、只换灰色。
   必须写成 .cal-day__dot.cal-day__dot--done：单类选择器(0-1-0)打不过上面
   .cal-day__dot[data-priority="…"](0-2-0)，否则完成的点仍是优先级颜色。 */
.cal-day__dot.cal-day__dot--done {
  background: #9a9a9a;
  box-shadow: inset 0 0 0 1px rgba(54, 54, 54, 0.12);
}

html[data-theme="dark"] .cal-day__dot.cal-day__dot--done {
  background: #696969;
}

.cal-day__more {
  color: var(--ink-faint);
  font-size: 11.5px;
  line-height: 1;
}

.calendar-tasks {
  display: flex;
  min-height: 0;
  flex-direction: column;
  border-left: 1px solid var(--line);
  background:
    linear-gradient(165deg, rgba(238, 238, 238, 0.8), rgba(231, 231, 231, 0.76)),
    var(--paper-noise);
}

.calendar-tasks__head {
  flex: 0 0 auto;
  padding: 17px 16px 13px;
  border-bottom: 1px dashed var(--line);
}

.calendar-tasks__date {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px;
}

.calendar-tasks__date p {
  margin: 0 0 3px;
  color: var(--clay-deep);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.16em;
}

.calendar-tasks__date h3 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 0.01em;
  line-height: 1.2;
}

.task-list {
  min-height: 0;
  flex: 1 1 auto;
  padding: 9px 10px;
  overflow-y: auto;
}

.task-item {
  display: grid;
  align-items: start;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  gap: 7px;
  padding: 9px 6px;
  border-bottom: 1px dotted rgba(76, 76, 76, 0.13);
}

/* 紧急程度只用一个色点表达，不写文字。 */
.task-pip {
  display: inline-block;
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(54, 54, 54, 0.16);
}

.task-pip[data-priority="urgent-important"] { background: #d8a4a0; }
.task-pip[data-priority="important"] { background: #d9c47c; }
.task-pip[data-priority="urgent"] { background: #bdbdbd; }
.task-pip[data-priority="none"] { background: #bebebe; }

.task-item__badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--ink-faint);
  font-size: 12px;
}

.task-item__resolve {
  padding: 0;
  border: 0;
  color: var(--ink-faint);
  background: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  text-decoration: underline dotted;
  text-underline-offset: 3px;
}

.task-item__resolve:hover {
  color: var(--clay-deep);
}

.task-item.is-resolved .task-title {
  color: var(--ink-faint);
}

.priority-list {
  display: grid;
  gap: 6px;
  margin: 0 0 14px;
}

.priority-option {
  display: grid;
  align-items: center;
  grid-template-columns: 10px auto;
  gap: 3px 9px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink-soft);
  background: rgba(253, 253, 253, 0.5);
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: border-color 0.14s, background 0.14s;
}

.priority-option:hover {
  border-color: var(--line-strong);
  background: rgba(253, 253, 253, 0.9);
}

.priority-option.is-active {
  border-color: var(--ink-soft);
  background: rgba(239, 239, 239, 0.95);
}

.priority-option__label {
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 14.5px;
}

.priority-option__hint {
  grid-column: 2;
  color: var(--ink-faint);
  font-size: 12px;
  line-height: 1.5;
}

/* 「状态」两项没有色点，各自占满整行：标签在左、说明在右。
   首列 10px 是给紧急程度的 .task-pip 留的，状态组必须覆写，
   否则中文单字宽度 > 10px，标签会逐字竖排。 */
.priority-list--repeat .priority-option {
  grid-template-columns: minmax(112px, max-content) 1fr;
  align-items: baseline;
  gap: 0 14px;
  padding: 9px 12px;
}

.priority-list--repeat .priority-option__hint {
  grid-column: 2;
  grid-row: 1;
}

@media (max-width: 560px) {
  .priority-list--repeat .priority-option {
    grid-template-columns: minmax(0, 1fr);
    row-gap: 4px;
  }

  .priority-list--repeat .priority-option__hint {
    grid-column: 1;
    grid-row: auto;
  }
}

.task-check {
  position: relative;
  display: grid;
  width: 16px;
  height: 16px;
  place-items: center;
  margin-top: 2px;
  border: 1px solid rgba(76, 76, 76, 0.34);
  border-radius: 2px;
  color: transparent;
  background: rgba(253, 253, 253, 0.35);
  transition: color 0.15s, background 0.15s, border-color 0.15s;
}

.task-check:hover {
  border-color: var(--sage-deep);
}

.task-check svg {
  width: 10px;
  height: 10px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2;
}

.task-item.is-done .task-check {
  border-color: var(--sage);
  color: #f7f7f7;
  background: var(--sage);
}

.task-body {
  min-width: 0;
  padding-top: 1px;
}

.task-title {
  overflow-wrap: anywhere;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 15px;
  line-height: 1.55;
  transition: color 0.15s;
}

.task-item.is-done .task-title {
  color: var(--ink-faint);
  text-decoration: line-through;
  text-decoration-color: var(--ink-faint);
}

.task-item__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 3px 5px;
  margin-top: 3px;
}

.task-item__meta .sample-tag {
  height: 14px;
  padding: 0 4px;
  font-size: 12px;
}

.task-item__meta span:not(.sample-tag) {
  color: var(--ink-faint);
  font-size: 12px;
}

.task-actions {
  display: flex;
  align-items: center;
  gap: 0;
  opacity: 0;
  transition: opacity 0.14s;
}

.task-item:hover .task-actions,
.task-item:focus-within .task-actions {
  opacity: 1;
}

.task-actions .icon-btn {
  width: 22px;
  height: 22px;
}

.task-actions .icon-btn svg {
  width: 12px;
  height: 12px;
}

.tasks-empty {
  padding: 32px 18px;
  color: var(--ink-faint);
  font-family: var(--font-serif);
  font-size: 14.5px;
  line-height: 1.8;
  text-align: center;
}

.tasks-empty::before {
  display: block;
  width: 34px;
  height: 34px;
  margin: 0 auto 10px;
  border: 1px dashed var(--line-strong);
  border-radius: 50%;
  color: var(--ink-ghost);
  content: "留白";
  font-size: 12px;
  letter-spacing: 0.06em;
  line-height: 32px;
  transform: rotate(-4deg);
}

.task-add {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 6px;
  padding: 11px 12px 13px;
  border-top: 1px dashed var(--line);
}

.task-add input {
  min-height: 32px;
  flex: 1 1 auto;
  min-width: 0;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--ink);
  background: rgba(253, 253, 253, 0.55);
  font-family: var(--font-serif);
  font-size: 15px;
}

.task-add input::placeholder {
  color: var(--ink-ghost);
}

.task-add input:focus {
  border-color: var(--indigo);
  outline: none;
  background: var(--paper-raised);
}

.task-add button {
  display: grid;
  width: 33px;
  height: 32px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--ink);
  border-radius: 2px;
  color: #f7f7f7;
  background: var(--ink);
}

.task-add button:hover {
  background: var(--indigo-deep);
}

.task-add button svg {
  width: 13px;
  height: 13px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-width: 1.7;
}

.calendar-tasks__foot {
  flex: 0 0 auto;
  padding: 0 15px 11px;
  color: var(--ink-faint);
  font-size: 12px;
  letter-spacing: 0.03em;
}

@container (max-width: 700px) {
  .calendar-layout {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .calendar-month {
    flex: 0 0 auto;
    padding: 10px 12px 7px;
  }

  .calendar-month__head {
    margin-bottom: 6px;
  }

  .calendar-month__title {
    font-size: 21px;
  }

  .calendar-grid {
    flex: 0 0 auto;
    grid-auto-rows: minmax(36px, auto);
    min-height: 216px;
    max-height: 244px;
  }

  .cal-day {
    padding: 3px 5px;
  }

  .cal-day__num {
    width: 22px;
    height: 22px;
    font-size: 15px;
  }

  .calendar-tasks {
    flex: 1 1 auto;
    min-height: 0;
    border-top: 1px solid var(--line);
    border-left: 0;
  }

  .calendar-tasks__head {
    padding: 10px 14px 8px;
  }

  .calendar-tasks__date h3 {
    font-size: 20px;
  }

  .task-list {
    flex: 1 1 auto;
    max-height: none;
    padding: 4px 8px;
  }

  .task-item {
    padding: 7px 6px;
  }

  .task-actions {
    opacity: 1;
  }

  .task-add {
    padding: 8px 10px 9px;
  }

  .calendar-tasks__foot {
    padding: 0 14px 8px;
  }
}

/* ============================================================
   5. Drawing paper
   ============================================================ */

.draw-app {
  container-type: inline-size;
  background-color: #ebebeb;
}

.draw-app .app-toolbar {
  min-height: 43px;
  padding: 5px 12px;
}

.draw-app .app-toolbar__title {
  max-width: 200px;
}

.draw-app .save-state {
  margin-left: 3px;
}

.draw-tool-btn {
  display: inline-flex;
  height: 27px;
  align-items: center;
  gap: 5px;
  padding: 0 7px;
  border: 1px solid transparent;
  border-radius: 2px;
  color: var(--ink-soft);
  font-size: 13.5px;
  letter-spacing: 0.03em;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}

.draw-tool-btn:hover {
  border-color: var(--line);
  color: var(--ink);
  background: rgba(253, 253, 253, 0.55);
}

.draw-tool-btn.is-active {
  border-color: var(--sage);
  color: var(--sage-deep);
  background: var(--sage-soft);
}

.draw-tool-btn svg {
  width: 13px;
  height: 13px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.55;
}

.draw-tool-btn--export {
  border-color: rgba(93, 93, 93, 0.32);
  color: var(--indigo-deep);
  background: rgba(222, 222, 222, 0.3);
}

.draw-tool-btn--export:hover {
  background: var(--indigo-soft);
}

.draw-shelf {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 8px;
  height: 63px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(242, 242, 242, 0.54);
  overflow: hidden;
}

.draw-shelf__label {
  display: flex;
  width: 30px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  color: var(--ink-faint);
  font-family: var(--font-serif);
  font-size: 13px;
  letter-spacing: 0.14em;
  line-height: 1.25;
  text-align: center;
}

.draw-gallery {
  display: flex;
  min-width: 0;
  flex: 1 1 auto;
  align-items: center;
  gap: 5px;
  overflow-x: auto;
  padding: 2px 1px;
}

.draw-nav {
  display: grid;
  width: 22px;
  height: 26px;
  flex: 0 0 auto;
  place-items: center;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--ink-soft);
  background: rgba(253, 253, 253, 0.6);
  cursor: pointer;
}

.draw-nav:hover {
  border-color: var(--line-strong);
  color: var(--ink);
  background: rgba(253, 253, 253, 0.95);
}

.draw-nav:disabled {
  opacity: 0.32;
  cursor: default;
}

.draw-nav svg {
  width: 11px;
  height: 11px;
}

.draw-gallery::-webkit-scrollbar {
  height: 5px;
}

.draw-card {
  display: flex;
  width: 98px;
  flex: 0 0 auto;
  align-items: center;
  gap: 6px;
  padding: 4px 6px 4px 4px;
  border: 1px solid transparent;
  border-radius: 2px;
  color: var(--ink-soft);
  text-align: left;
  transition: background 0.15s, border-color 0.15s;
}

.draw-card:hover {
  border-color: var(--line);
  background: rgba(252, 252, 252, 0.5);
}

.draw-card.is-active {
  border-color: rgba(137, 137, 137, 0.34);
  color: var(--ink);
  background: rgba(224, 224, 224, 0.38);
}

.draw-card__thumb {
  width: 44px;
  height: 31px;
  flex: 0 0 auto;
  border: 1px solid rgba(73, 73, 73, 0.16);
  background-color: #f7f7f7;
  background-image: var(--paper-noise);
  object-fit: cover;
  box-shadow: 0 2px 4px -2px rgba(57, 57, 57, 0.2);
}

.draw-card__thumb--empty {
  display: grid;
  place-items: center;
  color: var(--ink-faint);
  font-family: var(--font-serif);
  font-size: 12px;
}

.draw-card__text {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 1px;
}

.draw-card__name {
  overflow: hidden;
  font-family: var(--font-serif);
  font-size: 13.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.draw-card__date {
  color: var(--ink-faint);
  font-size: 11.5px;
  letter-spacing: 0.03em;
}

.draw-new {
  display: flex;
  height: 38px;
  flex: 0 0 auto;
  align-items: center;
  gap: 4px;
  padding: 0 9px;
  border: 1px dashed var(--line-strong);
  border-radius: 2px;
  color: var(--ink-soft);
  font-size: 13.5px;
  white-space: nowrap;
}

.draw-new:hover {
  border-color: var(--sage);
  color: var(--sage-deep);
  background: rgba(224, 224, 224, 0.25);
}

.draw-new svg {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-width: 1.7;
}

.draw-controls {
  display: flex;
  flex: 0 0 auto;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 13px;
  min-height: 42px;
  padding: 6px 13px;
  border-bottom: 1px solid var(--line);
  background: rgba(247, 247, 247, 0.38);
}

.draw-control-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.draw-control-label {
  color: var(--ink-faint);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
}

.draw-color {
  position: relative;
  display: inline-grid;
  width: 19px;
  height: 19px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 50%;
}

.draw-color::before {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--color);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
  content: "";
}

.draw-color:hover::before {
  transform: scale(1.16);
}

.draw-color.is-active {
  border-color: var(--ink-soft);
}

.draw-color input[type="color"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  opacity: 0;
  cursor: pointer;
}

.draw-size {
  display: inline-grid;
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 50%;
}

.draw-size span {
  width: var(--dot);
  height: var(--dot);
  border-radius: 50%;
  background: var(--ink);
}

.draw-size:hover {
  background: rgba(252, 252, 252, 0.6);
}

.draw-size.is-active {
  border-color: var(--ink-soft);
  background: var(--paper-deep);
}

.draw-stage {
  position: relative;
  display: flex;
  min-height: 0;
  flex: 1 1 auto;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 16px 20px;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(251, 251, 251, 0.62), transparent 64%),
    linear-gradient(145deg, #e6e6e6, #dfdfdf);
}

.draw-stage::before {
  position: absolute;
  inset: 0;
  content: "";
  pointer-events: none;
  background-image: var(--grain);
  opacity: 0.7;
}

.draw-board {
  position: relative;
  flex: 0 0 auto;
  background-color: #f7f7f7;
  background-image: var(--paper-noise);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.8) inset,
    0 26px 48px -28px rgba(56, 56, 56, 0.52),
    0 3px 8px rgba(56, 56, 56, 0.06);
  touch-action: none;
}

.draw-board::before {
  position: absolute;
  top: -8px;
  left: 50%;
  width: 55px;
  height: 17px;
  background: rgba(191, 191, 191, 0.4);
  clip-path: polygon(1% 6%, 99% 0, 100% 90%, 0 100%);
  content: "";
  transform: translateX(-50%) rotate(-1.3deg);
  pointer-events: none;
}

.draw-canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: crosshair;
  touch-action: none;
}

.draw-board.is-erasing .draw-canvas {
  cursor: cell;
}

.draw-brush-cursor {
  position: absolute;
  z-index: 4;
  display: none;
  border: 1px solid rgba(53, 53, 53, 0.55);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
}

.draw-board:hover .draw-brush-cursor {
  display: block;
}

.draw-foot {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 9px;
  min-height: 25px;
  padding: 0 14px;
  border-top: 1px solid var(--line);
  color: var(--ink-faint);
  font-size: 12px;
  letter-spacing: 0.03em;
}

.draw-foot .dot {
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: var(--ink-ghost);
}

.draw-foot__right {
  margin-left: auto;
  font-family: var(--font-serif);
}

.draw-empty {
  position: absolute;
  z-index: 5;
  inset: 47px 0 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 8px;
  padding: 24px;
  background: rgba(239, 239, 239, 0.9);
  backdrop-filter: blur(1.5px);
  text-align: center;
}

.draw-missing {
  position: absolute;
  z-index: 5;
  inset: 47px 0 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 9px;
  padding: 26px;
  background: rgba(245, 245, 245, 0.93);
  text-align: center;
}

.draw-missing h3 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 19px;
  font-weight: 500;
}

.draw-missing p {
  max-width: 320px;
  margin: 0;
  color: var(--ink-faint);
  font-family: var(--font-serif);
  font-size: 14.5px;
  line-height: 1.8;
}

.draw-empty h3 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 19px;
  font-weight: 500;
}

@container (max-width: 700px) {
  .draw-shelf {
    height: 58px;
    padding: 5px 8px;
  }

  .draw-shelf__label {
    display: none;
  }

  .draw-card {
    width: 92px;
  }

  .draw-card__thumb {
    width: 38px;
    height: 27px;
  }

  .draw-controls {
    gap: 5px 9px;
    padding: 5px 9px;
  }

  .draw-control-label {
    display: none;
  }

  .draw-app .app-toolbar__title {
    max-width: 120px;
    font-size: 15px;
  }

  .draw-tool-btn span {
    display: none;
  }

  .draw-tool-btn {
    padding: 0 6px;
  }

  .draw-tool-btn--export {
    padding: 0 8px;
  }

  .draw-stage {
    padding: 10px;
  }

  .draw-foot__right {
    display: none;
  }

  .draw-empty,
  .draw-missing {
    inset: 0;
  }
}

/* ============================================================
   6. Settings
   ============================================================ */

.settings-app {
  container-type: inline-size;
  background-color: #f0f0f0;
}

.settings-head {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 12px;
  padding: 16px 19px 13px;
  border-bottom: 1px solid var(--paper-edge);
}

.settings-head__seal {
  display: grid;
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid rgba(155, 83, 58, 0.58);
  border-radius: 3px;
  color: var(--clay-deep);
  font-family: var(--font-serif);
  font-size: 24px;
  transform: rotate(-2deg);
}

.settings-head__text {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.settings-head h2 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 500;
  letter-spacing: 0.02em;
  line-height: 1.25;
}

.settings-head p {
  margin: 0;
  color: var(--ink-faint);
  font-family: var(--font-serif);
  font-size: 13.5px;
  letter-spacing: 0.04em;
}

.settings-version {
  margin-left: auto;
  color: var(--ink-faint);
  font-size: 12px;
  letter-spacing: 0.08em;
}

.settings-layout {
  display: grid;
  min-height: 0;
  flex: 1 1 auto;
  grid-template-columns: 150px minmax(0, 1fr);
}

.settings-nav {
  display: flex;
  min-height: 0;
  flex-direction: column;
  gap: 2px;
  padding: 13px 9px;
  border-right: 1px solid var(--line);
  background: rgba(233, 233, 233, 0.5);
}

.settings-nav button {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 8px;
  padding: 8px 9px;
  border: 1px solid transparent;
  border-radius: 2px;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 15px;
  text-align: left;
  transition: background 0.14s, border-color 0.14s, color 0.14s;
}

.settings-nav button::before {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--ink-ghost);
  content: "";
}

.settings-nav button:hover {
  background: rgba(252, 252, 252, 0.5);
}

.settings-nav button.is-active {
  border-color: rgba(137, 137, 137, 0.26);
  color: var(--ink);
  background: rgba(224, 224, 224, 0.42);
}

.settings-nav button.is-active::before {
  background: var(--sage-deep);
}

.settings-content {
  min-height: 0;
  overflow-y: auto;
  padding: 19px 22px 26px;
}

.settings-section {
  display: none;
  animation: settings-in 0.18s var(--ease-paper);
}

.settings-section.is-active {
  display: block;
}

/* 命令分区要撑满：搜索框钉在顶部，长列表自己滚。 */
.settings-section[data-section-panel="commands"].is-active {
  display: flex;
  height: 100%;
  min-height: 0;
  flex-direction: column;
}

@keyframes settings-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.settings-section__title {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 400;
  letter-spacing: 0.01em;
}

.settings-section__intro {
  max-width: 480px;
  margin: 7px 0 18px;
  color: var(--ink-faint);
  font-family: var(--font-serif);
  font-size: 14.5px;
  line-height: 1.8;
}

.setting-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 13px 0;
  border-top: 1px dashed var(--line);
}

.setting-row__copy {
  min-width: 0;
}

.setting-row__label {
  display: block;
  margin-bottom: 3px;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 14.5px;
}

.setting-row__desc {
  margin: 0;
  color: var(--ink-faint);
  font-size: 13.5px;
  line-height: 1.6;
}

.toggle {
  position: relative;
  display: inline-flex;
  width: 38px;
  height: 21px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: flex-start;
  padding: 2px;
  border: 1px solid var(--line-strong);
  border-radius: 11px;
  background: rgba(253, 253, 253, 0.6);
  transition: background 0.16s, border-color 0.16s;
}

.toggle::after {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--ink-ghost);
  box-shadow: 0 1px 2px rgba(56, 56, 56, 0.2);
  content: "";
  transition: transform 0.18s var(--ease-soft), background 0.16s;
}

.toggle[aria-pressed="true"] {
  border-color: var(--sage-deep);
  background: var(--sage-soft);
}

.toggle[aria-pressed="true"]::after {
  background: var(--sage-deep);
  transform: translateX(16px);
}

.select-wrap {
  position: relative;
  flex: 0 0 auto;
}

.select-wrap select {
  height: 30px;
  padding: 0 26px 0 9px;
  border: 1px solid var(--line-strong);
  border-radius: 2px;
  color: var(--ink);
  background: rgba(253, 253, 253, 0.55);
  font-size: 14px;
  appearance: none;
}

.select-wrap::after {
  position: absolute;
  top: 50%;
  right: 9px;
  width: 5px;
  height: 5px;
  border-right: 1px solid var(--ink-soft);
  border-bottom: 1px solid var(--ink-soft);
  content: "";
  pointer-events: none;
  transform: translateY(-70%) rotate(45deg);
}

.setting-actions {
  margin-top: 6px;
  border-top: 1px dashed var(--line);
}

.setting-action {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 11px;
  padding: 12px 0;
  border-bottom: 1px dashed var(--line);
  text-align: left;
}

.setting-action:hover .setting-action__name {
  color: var(--indigo-deep);
}

.setting-action__icon {
  display: grid;
  width: 29px;
  height: 29px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--ink-soft);
  background: rgba(252, 252, 252, 0.45);
}

.setting-action__icon svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.55;
}

.setting-action__copy {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 1px;
}

.setting-action__name {
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 15px;
}

.setting-action__desc {
  color: var(--ink-faint);
  font-size: 13px;
}

.setting-action__arrow {
  margin-left: auto;
  color: var(--ink-ghost);
  font-size: 15px;
}

.setting-action--danger .setting-action__name {
  color: var(--clay-deep);
}

.setting-action--danger .setting-action__icon {
  border-color: rgba(185, 111, 80, 0.26);
  color: var(--clay-deep);
  background: rgba(214, 214, 214, 0.25);
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
  margin: 2px 0 16px;
}

.stat-card {
  position: relative;
  display: flex;
  min-height: 68px;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  background: rgba(252, 252, 252, 0.38);
}

.stat-card::after {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 6px;
  height: 6px;
  border-top: 1px solid rgba(76, 76, 76, 0.13);
  border-right: 1px solid rgba(76, 76, 76, 0.13);
  content: "";
}

.stat-card strong {
  font-family: var(--font-serif);
  font-size: 23px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.stat-card span {
  color: var(--ink-faint);
  font-size: 12px;
  letter-spacing: 0.03em;
}

.storage-line {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 4px;
  color: var(--ink-faint);
  font-size: 13px;
  line-height: 1.6;
}

.storage-line::before {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--sage);
  content: "";
}

.storage-line[data-state="error"] {
  color: var(--clay-deep);
}

.storage-line[data-state="error"]::before {
  background: var(--clay);
}

.shortcut-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 22px;
  margin-top: 3px;
}

.shortcut-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px dotted var(--line);
}

.shortcut-row span {
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 14.5px;
}

.shortcut-keys {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 3px;
}

.shortcut-keys i {
  color: var(--ink-ghost);
  font-style: normal;
  font-size: 12px;
}

.about-sheet {
  position: relative;
  margin-top: 2px;
  padding: 21px 22px;
  border: 1px solid var(--line);
  background: rgba(252, 248, 239, 0.55);
}

.about-sheet::before {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  bottom: 8px;
  border: 1px solid rgba(89, 74, 53, 0.08);
  content: "";
  pointer-events: none;
}

.about-sheet__mark {
  position: relative;
  display: grid;
  width: 52px;
  height: 52px;
  margin-bottom: 14px;
  place-items: center;
  border: 1.5px solid rgba(155, 83, 58, 0.58);
  border-radius: 50%;
  color: var(--clay-deep);
  font-family: var(--font-serif);
  font-size: 28px;
  transform: rotate(-5deg);
}

.about-sheet h3 {
  position: relative;
  margin: 0 0 8px;
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 500;
}

.about-sheet p {
  position: relative;
  max-width: 470px;
  margin: 0 0 10px;
  color: var(--ink-soft);
  font-family: var(--font-serif);
  font-size: 14.5px;
  line-height: 1.9;
}

.about-sheet__sign {
  position: relative;
  margin-top: 17px;
  color: var(--ink-faint);
  font-family: var(--font-hand);
  font-size: 16px;
  transform: rotate(-2deg);
}

.about-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 18px;
  margin-top: 14px;
  color: var(--ink-faint);
  font-size: 12px;
  letter-spacing: 0.04em;
}

.settings-note {
  padding: 9px 10px;
  border: 1px solid rgba(185, 111, 80, 0.2);
  color: var(--ink-soft);
  background: rgba(214, 214, 214, 0.16);
  font-family: var(--font-serif);
  font-size: 13.5px;
  line-height: 1.7;
}

@container (max-width: 620px) {
  .settings-layout {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .settings-nav {
    flex: 0 0 auto;
    flex-direction: row;
    gap: 4px;
    padding: 7px 9px;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .settings-nav button {
    width: auto;
    flex: 0 0 auto;
    padding: 6px 9px;
    font-size: 14.5px;
  }

  .settings-nav button::before {
    display: none;
  }

  .settings-content {
    flex: 0 0 auto;
    overflow: visible;
    padding: 15px 16px 24px;
  }

  .settings-section__title {
    font-size: 21px;
  }

  .setting-row {
    flex-direction: column;
    gap: 9px;
  }

  .shortcut-grid {
    grid-template-columns: 1fr;
  }

  .stats-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* small finishing touches */

.paper-btn svg,
.notes-new svg {
  width: 13px;

  fill: none;
  stroke: currentColor;

.paper-preview__head {

.paper-preview__id {

}

.paper-preview__line {
  position: relative;
  margin: 18px 0 18px;
  color: var(--ink);
  font-family: var(--font-serif);

}

.paper-preview__foot {
  position: relative;

}

.paper-preview__seal {
  position: absolute;
  right: 20px;
  bottom: 18px;

}

}

/* Hide 便签 per-card chrome until the paper is touched, except on touch screens. */
.sticky__swatches,
.sticky .sticky__del {

}

.sticky:hover .sticky__swatches,
.sticky:focus-within .sticky__swatches,
.sticky:hover .sticky__del,
.sticky:focus-within .sticky__del {
  opacity: 1;
}

.sticky .sticky__del {
  transition: opacity 0.15s, color 0.15s, background 0.15s;
}

/* ===== guided tour ===== */
.tour {
  position: fixed;
  z-index: 9000;
  inset: 0;
  display: none;
  font-family: var(--font-ui);
}
.tour.is-open { display: block; }
.tour__shade {
  position: absolute;
  inset: 0;
  background: transparent;
  transition: background 0.2s var(--ease-paper);
}
.tour--centered .tour__shade { background: rgba(38, 38, 38, 0.46); }
.tour__spot {
  position: absolute;
  z-index: 1;
  border-radius: 12px;
  box-shadow:
    0 0 0 9999px rgba(38, 38, 38, 0.46),
    0 0 0 2px rgba(185, 111, 80, 0.95),
    0 0 0 7px rgba(250, 250, 250, 0.32);
  pointer-events: none;
  transition:
    left 0.22s var(--ease-paper),
    top 0.22s var(--ease-paper),
    width 0.22s var(--ease-paper),
    height 0.22s var(--ease-paper);
}
.tour--centered .tour__spot { display: none; }
.tour__card {
  position: absolute;
  z-index: 2;
  box-sizing: border-box;
  width: min(420px, calc(100vw - 28px));
  padding: 20px 22px 16px;
  border: 1px solid rgba(79, 79, 79, 0.22);
  border-radius: 3px;
  color: var(--ink);
  background-color: #f4f4f4;
  background-image: var(--paper-noise);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.82) inset,
    0 30px 70px -30px rgba(43, 43, 43, 0.55),
    0 4px 14px rgba(43, 43, 43, 0.12);
  transform: rotate(0.25deg);
}
.tour__kicker {
  margin: 0;
  color: var(--clay-deep);
  font-size: 13px;
  font-weight: 650;
  letter-spacing: 0.08em;
}
.tour__title {
  margin: 5px 0 8px;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 600;
  line-height: 1.25;
}
.tour__body {
  margin: 0;
  color: var(--ink-soft);
  font-size: 16px;
  line-height: 1.75;
}
.tour__body b { color: var(--ink); }
.tour__acts {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 16px;
}
.tour__dots {
  display: flex;
  flex: 1 1 auto;
  align-items: center;
  gap: 6px;
}
.tour__dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(69, 69, 69, 0.2);
  transition: background 0.15s;
}
.tour__dot.is-active { background: var(--clay); }
.tour__btn {
  min-height: 34px;
  border: 1px solid rgba(73, 73, 73, 0.22);
  border-radius: 3px;
  padding: 6px 13px;
  color: var(--ink);
  background: rgba(249, 249, 249, 0.7);
  font: inherit;
  font-size: 15px;
  cursor: pointer;
}
.tour__btn:hover { background: var(--paper-raised); }
.tour__btn:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
.tour__btn--primary {
  border-color: var(--clay-deep);
  color: #fafafa;
  background: var(--clay);
}
.tour__btn--primary:hover { background: var(--clay-deep); }
.tour__btn--ghost {
  border-color: transparent;
  color: var(--ink-faint);
  background: transparent;
}
.tour__btn--ghost:hover { color: var(--ink); background: rgba(252, 252, 252, 0.6); }
.tour__btn[disabled] { opacity: 0.4; cursor: default; }
@media (max-width: 560px) {
  .tour__card { padding: 16px 16px 12px; }
  .tour__title { font-size: 21px; }
  .tour__body { font-size: 15px; }
}


/* ===== unified rounded surfaces ===== */
.window::before,
.window::after {
  display: none;
}

.window {
  border-radius: 18px;
}

.window__titlebar {
  border-radius: 18px 18px 0 0;
}

.window__body {
  border-radius: 0 0 18px 18px;
}

.paper-dialog,
.command-sheet__search {
  border-radius: var(--radius-sheet);
}

.toast {
  border-radius: 12px;
}

   深色层：整体重绘主要承载面。
   只在 html[data-theme="dark"] 下生效，浅色一行都不受影响。

html[data-theme="dark"] .desk-decor__fiber {
  opacity: 0.22;
}

html[data-theme="dark"] .desk-decor__vertical,

  function templateCount(params) {

    if (!params || typeof params !== 'object') return null;

    });

  function paintStrokes(ctx, strokes, width, height, background) {
    ctx.save();
    if (background) {
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, width, height);
    } else {
      ctx.clearRect(0, 0, width, height);
    }
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var list = Array.isArray(strokes) ? strokes : [];
    for (var s = 0; s < list.length; s += 1) {
      var stroke = list[s];
      if (!stroke || !Array.isArray(stroke.points) || stroke.points.length === 0) continue;
      var points = stroke.points;
      var color = stroke.eraser ? (background || P.DRAW_PAPER) : stroke.color || '#34362f';
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = Math.max(0.5, Number(stroke.width) || 3);
      if (points.length === 1) {
        ctx.beginPath();
        ctx.arc(points[0].x, points[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      if (points.length === 2) {
        ctx.lineTo(points[1].x, points[1].y);
      } else {
        for (var i = 1; i < points.length - 1; i += 1) {
          var midX = (points[i].x + points[i + 1].x) / 2;
          var midY = (points[i].y + points[i + 1].y) / 2;
          ctx.quadraticCurveTo(points[i].x, points[i].y, midX, midY);
        }
        var last = points[points.length - 1];
        ctx.lineTo(last.x, last.y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

      canvas.width = Math.max(1, Math.round(width * ratio));
      canvas.height = Math.max(1, Math.round(height * ratio));
      var ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio);
      paintStrokes(ctx, strokes, width, height, P.DRAW_PAPER);
      return canvas.toDataURL('image/png');
    } catch (err) {

    }
  }

  function arcPoints(cx, cy, rx, ry, start, end, count) {
    var out = [];
    var steps = Math.max(2, count || 28);
    for (var i = 0; i <= steps; i += 1) {

      out.push({ x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry });
    }
    return out;
  }

      out.push({ x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr * (squashY || 1) });
    }
    return out;
  }

  /* ---------------- toast ---------------- */

  // Toast policy: exactly one on screen at a time, short dwell.
  // A newer message replaces the current one in place instead of stacking.
  var TOAST_ENABLED = false;
  var TOAST_DWELL = { info: 1600, warn: 2200, error: 3200 };
  var TOAST_DWELL_MAX = 3200;
  var toastTimer = 0;
  var currentToast = null;
  var currentToastText = '';

  function toast(message, options) {
    /* 用户明确要求去掉所有浮层提示：保留调用点与签名，只让它不显示。
       删调用会留下空 if 块，把页面结构改坏。 */
    if (TOAST_ENABLED === false) return { dismiss: function () {} };
    var opts = options || {};
    var region = document.getElementById('toasts');
    if (!region) return function () {};
    var kind = opts.kind || 'info';
    var body = String(message);
    var signature = kind + '\u0000' + body + '\u0000' + (opts.actionLabel || '');
    var dwell = Math.min(opts.duration || TOAST_DWELL[kind] || TOAST_DWELL.info, TOAST_DWELL_MAX);
    if (currentToast && currentToast.parentNode) {
      if (signature === currentToastText) {
        // Same message repeated: keep the single node, just restart its clock.
        armToastTimer(currentToast, dwell);
        return currentToast;
      }
      region.removeChild(currentToast);
      currentToast = null;
    }
    while (region.firstChild) region.removeChild(region.firstChild);
    var node = el('div', 'toast toast--' + kind);
    node.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    var text = el('span', 'toast__text', body);
    node.appendChild(text);
    if (opts.actionLabel && typeof opts.onAction === 'function') {
      var action = el('button', 'toast__action', opts.actionLabel);
      action.type = 'button';
      action.addEventListener('click', function () {
        dismissToast(node);
        opts.onAction();
      });
      node.appendChild(action);
    }
    /* 「收好桌面」这类确认性提示不抢视线：右下角、小一号、淡一点。 */
    region.classList.toggle('is-corner', opts.placement === 'corner');
    region.appendChild(node);
    currentToast = node;
    currentToastText = signature;
    node.dismiss = function () { dismissToast(node); };
    armToastTimer(node, dwell);
    return node;
  }

  function armToastTimer(node, dwell) {
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastTimer = 0;
      dismissToast(node);
    }, Math.min(dwell, TOAST_DWELL_MAX));
  }

  function dismissToast(target) {
    if (!target || !target.parentNode) return;
    // Only the live toast owns the dwell timer; a stale node must not cancel it.
    if (currentToast === target) {
      if (toastTimer) { clearTimeout(toastTimer); toastTimer = 0; }
      currentToast = null;
      currentToastText = '';
    }
    target.classList.add('is-leaving');
    setTimeout(function () {
      if (target.parentNode) target.parentNode.removeChild(target);
    }, 160);
  }

  /* ---------------- dialog ---------------- */

  var dialogCounter = 0;

  function openDialog(options) {
    var opts = options || {};
    var host = document.getElementById('dialog-host') || document.body;
    var previousFocus = document.activeElement;
    dialogCounter += 1;
    var id = 'dlg_' + dialogCounter;
    var dialog = document.createElement('dialog');
    dialog.className = 'paper-dialog';
    if (opts.wide) dialog.style.width = 'min(' + (opts.width || 560) + 'px, calc(100vw - 28px))';
    dialog.setAttribute('aria-labelledby', id + '_title');
    if (opts.description) dialog.setAttribute('aria-describedby', id + '_desc');

    var sheet = el('div', 'dialog-sheet');
    if (opts.kicker) {
      sheet.appendChild(el('p', 'dialog-kicker', opts.kicker));
    }
    var title = el('h2', 'dialog-title', opts.title || '纸屿');
    title.id = id + '_title';
    sheet.appendChild(title);
    if (opts.description) {
      var desc = el('p', 'dialog-description', opts.description);
      desc.id = id + '_desc';
      sheet.appendChild(desc);
    }
    var body = null;
    if (typeof opts.render === 'function') {
      body = el('div', 'dialog-body');
      sheet.appendChild(body);
      opts.render(body, dialog);
    }
    var actions = el('div', 'dialog-actions');
    var buttons = [];
    (opts.actions || []).forEach(function (action) {
      var btn = el('button', 'paper-btn', action.label);
      btn.type = 'button';
      if (action.kind === 'primary') btn.classList.add('paper-btn--ink');
      else if (action.kind === 'danger') btn.classList.add('paper-btn--clay');
      else if (action.kind === 'ghost') btn.classList.add('paper-btn--ghost');
      if (action.disabled) btn.disabled = true;
      btn.addEventListener('click', function () {
        submit(action.value);
      });
      actions.appendChild(btn);
      buttons.push(btn);
    });
    sheet.appendChild(actions);
    dialog.appendChild(sheet);
    host.appendChild(dialog);

    function closeWith(value) {
      if (closed) return;

      var wait = prefersReducedMotion() ? 0 : 140;
      setTimeout(function () {

      kicker: opts.kicker || 'PAPER OS · 写一个名字',
      title: opts.title || '给这张纸一个名字',
      description: opts.message || '',
      actions: [
        { label: opts.cancelLabel || '取消', value: null, kind: 'ghost' },
        { label: opts.confirmLabel || '写下', value: 'ok', kind: 'primary' }
      ],
      render: function (body) {
        if (opts.label) body.appendChild(el('label', 'field-label', opts.label));
        input = el('input', 'text-input dialog-input');
        input.type = 'text';
        input.value = opts.value || '';

        });

          if (event.key === 'Enter') {
            event.preventDefault();

            if (buttons.length) buttons[buttons.length - 1].click();

      },
      getValue: function (value) {

        if (problem) {

        return val;

  function choice(options) {

    var buttons = {};
    return openDialog({
      kicker: opts.kicker || 'PAPER OS · 选一个位置',

          btn.appendChild(el('span', 'dialog-choice__path', item.label));

      actions: [

        { label: opts.confirmLabel || '就这里', value: 'ok', kind: 'primary' }
