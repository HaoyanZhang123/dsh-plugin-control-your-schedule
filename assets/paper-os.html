/* ============================================================
   PAPER OS — shared data model and first-run sample content
   ============================================================ */
(function () {
  'use strict';

  var P = window.PaperOS;
  var U = P.util;

  var STICKY_COLORS = ['butter', 'peach', 'sage', 'sky', 'rose'];

  function createEmptyState() {
    var now = Date.now();
    return {
      prefs: {
        paperTone: 'cream',
        paperTexture: true,
        showGrid: true,
        motion: 'system',
        theme: 'system',
        handFont: 'kai',
        /* 界面语言：system 跟随 DSH，zh / en 固定。只影响界面，不改 schema。 */
        lang: 'system',
        welcomeDismissed: false,
        dockOrder: []
      },
      meta: {
        createdAt: now,
        updatedAt: now,
        seededAt: 0,
        welcomeDocId: ''
      },
      nodes: [],
      stickies: [],
      tasks: [],
      prompts: []
    };
  }

  var state = createEmptyState();
  var listeners = new Set();

  function subscribe(fn) {
    listeners.add(fn);
    return function () { listeners.delete(fn); };
  }

  function emit(type, detail) {
    var event = { type: type, at: Date.now() };
    if (detail) {
      Object.keys(detail).forEach(function (key) { event[key] = detail[key]; });
    }
    listeners.forEach(function (fn) {
      try { fn(event); } catch (err) {
        if (window.console && console.error) console.error('PaperOS subscriber error', err);
      }
    });
  }

  function touch() {
    if (P.storage && typeof P.storage.touch === 'function') P.storage.touch('data');
  }

  function commit(type, detail) {
    state.meta.updatedAt = Date.now();
    emit(type, detail);
    touch();
  }

  function normalizeName(raw, fallback) {
    var value = String(raw === undefined || raw === null ? '' : raw)
      .replace(/[\r\n\t]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    if (!value) value = fallback || '未命名';
    if (value.length > 96) value = value.slice(0, 96);
    return value;
  }

  function getNode(id) {
    if (!id) return null;
    for (var i = 0; i < state.nodes.length; i += 1) {
      if (state.nodes[i].id === id) return state.nodes[i];
    }
    return null;
  }

  function compareNodes(a, b) {
    if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
    return String(a.name).localeCompare(String(b.name), 'zh-Hans-CN', { numeric: true, sensitivity: 'base' });
  }

  function getChildren(parentId) {
    var pid = parentId || null;
    return state.nodes.filter(function (node) { return (node.parentId || null) === pid; }).sort(compareNodes);
  }

  function getAncestors(id) {
    var chain = [];
    var node = getNode(id);
    var guard = 0;
    while (node && guard < 50) {
      chain.unshift(node);
      node = getNode(node.parentId);
      guard += 1;
    }
    return chain;
  }

  function getPathLabel(id) {
    return getAncestors(id).map(function (node) { return node.name; }).join(' / ');
  }

  function isFolder(node) {
    return node && node.type === 'folder';
  }

  function isInside(nodeId, possibleAncestorId) {
    if (!nodeId || !possibleAncestorId) return false;
    var current = getNode(nodeId);
    var guard = 0;
    while (current && guard < 50) {
      if (current.id === possibleAncestorId) return true;
      current = getNode(current.parentId);
      guard += 1;
    }
    return false;
  }

  function uniqueName(parentId, wanted, excludeId) {
    var base = normalizeName(wanted, '未命名');
    var siblings = getChildren(parentId).filter(function (node) { return node.id !== excludeId; });
    var used = {};
    siblings.forEach(function (node) { used[node.name.toLowerCase()] = true; });
    if (!used[base.toLowerCase()]) return base;
    var root = base;
    var suffix = 2;
    while (used[(root + ' (' + suffix + ')').toLowerCase()]) suffix += 1;
    return root + ' (' + suffix + ')';
  }

  function assertFolder(parentId) {
    if (parentId === null || parentId === undefined) return null;
    var parent = getNode(parentId);
    if (!parent || parent.type !== 'folder') throw new Error('目标文件夹不存在。');
    return parent;
  }

  function defaultFolderId(kind) {
    var wanted = kind === 'drawing' ? '画纸' : '我的纸页';
    var exists = state.nodes.find(function (node) {
      return node.type === 'folder' && !node.parentId && node.name === wanted;
    });
    if (exists) return exists.id;
    var created = createFolder({ name: wanted, parentId: null, sample: false });
    return created.id;
  }

  function createFolder(data) {
    var info = data || {};
    var parentId = info.parentId === undefined ? null : info.parentId;
    assertFolder(parentId);
    var now = Date.now();
    var node = {
      id: U.uid('folder'),
      type: 'folder',
      name: uniqueName(parentId, normalizeName(info.name, '新文件夹')),
      parentId: parentId,
      sample: !!info.sample,
      createdAt: now,
      updatedAt: now
    };
    state.nodes.push(node);
    commit('nodes', { action: 'create', id: node.id, ids: [node.id] });
    return U.clone(node);
  }

  function createNote(data) {
    var info = data || {};
    var parentId = info.parentId === undefined ? defaultFolderId('note') : info.parentId;
    assertFolder(parentId);
    var now = Date.now();
    var node = {
      id: U.uid('doc'),
      type: 'doc',
      kind: 'note',
      name: uniqueName(parentId, normalizeName(info.name, '未命名纸页')),
      parentId: parentId,
      content: typeof info.content === 'string' ? info.content : '',
      sample: !!info.sample,
      createdAt: now,
      updatedAt: now
    };
    state.nodes.push(node);
    commit('nodes', { action: 'create', id: node.id, ids: [node.id], kind: 'note' });
    return U.clone(node);
  }

  function createDrawing(data) {
    var info = data || {};
    var parentId = info.parentId === undefined ? defaultFolderId('drawing') : info.parentId;
    assertFolder(parentId);
    var now = Date.now();
    var node = {
      id: U.uid('draw'),
      type: 'doc',
      kind: 'drawing',
      name: uniqueName(parentId, normalizeName(info.name, '未命名画纸')),
      parentId: parentId,
      strokes: Array.isArray(info.strokes) ? info.strokes : [],
      width: Number(info.width) || 1200,
      height: Number(info.height) || 800,
      thumb: typeof info.thumb === 'string' ? info.thumb : '',
      sample: !!info.sample,
      createdAt: now,
      updatedAt: now
    };
    state.nodes.push(node);
    commit('nodes', { action: 'create', id: node.id, ids: [node.id], kind: 'drawing' });
    return U.clone(node);
  }

  function updateNode(id, patch) {
    var node = getNode(id);
    if (!node) return null;
    var changes = patch || {};
    if (Object.prototype.hasOwnProperty.call(changes, 'name')) {
      node.name = uniqueName(node.parentId, normalizeName(changes.name, node.name), node.id);
    }
    if (node.type === 'doc' && node.kind === 'note' && Object.prototype.hasOwnProperty.call(changes, 'content')) {
      node.content = String(changes.content === undefined || changes.content === null ? '' : changes.content);
    }
    if (node.type === 'doc' && node.kind === 'drawing') {
      if (Object.prototype.hasOwnProperty.call(changes, 'strokes') && Array.isArray(changes.strokes)) {
        node.strokes = changes.strokes;
      }
      if (Object.prototype.hasOwnProperty.call(changes, 'thumb') && typeof changes.thumb === 'string') {
        node.thumb = changes.thumb;
      }
      if (changes.width) node.width = Number(changes.width);
      if (changes.height) node.height = Number(changes.height);
    }
    node.updatedAt = Date.now();
    commit('nodes', { action: 'update', id: node.id, nodeKind: node.kind || 'folder' });
    return U.clone(node);
  }

  function renameNode(id, name) {
    return updateNode(id, { name: name });
  }

  function moveNode(id, targetParentId) {
    var node = getNode(id);
    if (!node) return null;
    var target = targetParentId === undefined ? null : targetParentId;
    if (target && target === id) throw new Error('不能把文件夹放进它自己里面。');
    assertFolder(target);
    if (target && isInside(target, id)) throw new Error('不能把文件夹放进它的子文件夹里。');
    if ((node.parentId || null) === (target || null)) return { changed: false, node: U.clone(node) };
    node.parentId = target || null;
    var wanted = node.name;
    node.name = uniqueName(node.parentId, wanted, node.id);
    node.updatedAt = Date.now();
    commit('nodes', { action: 'move', id: node.id, parentId: node.parentId });
    return { changed: true, renamed: node.name !== wanted, node: U.clone(node) };
  }

  function descendantsOf(id) {
    var result = [id];
    var queue = [id];
    while (queue.length) {
      var current = queue.shift();
      state.nodes.forEach(function (node) {
        if (node.parentId === current && result.indexOf(node.id) === -1) {
          result.push(node.id);
          queue.push(node.id);
        }
      });
    }
    return result;
  }

  function deleteNode(id) {
    var node = getNode(id);
    if (!node) return null;
    var ids = descendantsOf(id);
    state.nodes = state.nodes.filter(function (n) { return ids.indexOf(n.id) === -1; });
    if (state.meta.welcomeDocId && ids.indexOf(state.meta.welcomeDocId) !== -1) state.meta.welcomeDocId = '';
    commit('nodes', { action: 'delete', id: id, ids: ids, parentId: node.parentId || null });
    return { node: U.clone(node), ids: ids };
  }

  function countInside(id) {
    var ids = descendantsOf(id);
    var counts = { folders: 0, notes: 0, drawings: 0, total: ids.length - 1 };
    ids.forEach(function (nodeId) {
      var node = getNode(nodeId);
      if (!node || node.id === id) return;
      if (node.type === 'folder') counts.folders += 1;
      else if (node.kind === 'note') counts.notes += 1;
      else if (node.kind === 'drawing') counts.drawings += 1;
    });
    return counts;
  }

  function listNotes() {
    return state.nodes
      .filter(function (node) { return node.type === 'doc' && node.kind === 'note'; })
      .sort(function (a, b) { return b.createdAt - a.createdAt; });
  }

  function listDrawings() {
    return state.nodes
      .filter(function (node) { return node.type === 'doc' && node.kind === 'drawing'; })
      .sort(function (a, b) { return b.updatedAt - a.updatedAt; });
  }

  function searchNotes(query) {
    var q = String(query || '').trim().toLowerCase();
    if (!q) return listNotes();
    return listNotes().filter(function (node) {
      return node.name.toLowerCase().indexOf(q) !== -1 || String(node.content || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  function noteExcerpt(note) {
    var content = String(note && note.content ? note.content : '').replace(/\s+/g, ' ').trim();
    return content ? content.slice(0, 72) : '一张还没有写字的纸。';
  }

  function getExampleCounts() {
    return {
      nodes: state.nodes.filter(function (n) { return n.sample; }).length,
      stickies: state.stickies.filter(function (n) { return n.sample; }).length,
      tasks: state.tasks.filter(function (n) { return n.sample; }).length,
      prompts: state.prompts.filter(function (n) { return n.sample; }).length
    };
  }

  function clearExamples() {
    var sampleIds = state.nodes.filter(function (n) { return n.sample; }).map(function (n) { return n.id; });
    var sampleSet = {};
    sampleIds.forEach(function (id) { sampleSet[id] = true; });
    // Preserve user-created content that lives inside a sample folder:
    // lift any non-sample node whose parent is a sample node up to the root.
    state.nodes.forEach(function (node) {
      if (!sampleSet[node.id] && node.parentId && sampleSet[node.parentId]) {
        node.parentId = null;
      }
    });
    var removedNodes = state.nodes.filter(function (n) { return sampleSet[n.id]; }).map(function (n) { return n.id; });
    state.nodes = state.nodes.filter(function (n) { return !sampleSet[n.id]; });
    if (state.meta.welcomeDocId && sampleSet[state.meta.welcomeDocId]) state.meta.welcomeDocId = '';
    var removedStickies = state.stickies.filter(function (n) { return n.sample; }).map(function (n) { return n.id; });
    state.stickies = state.stickies.filter(function (n) { return !n.sample; });
    var removedTasks = state.tasks.filter(function (n) { return n.sample; }).map(function (n) { return n.id; });
    state.tasks = state.tasks.filter(function (n) { return !n.sample; });
    var removedPrompts = state.prompts.filter(function (n) { return n.sample; }).map(function (n) { return n.id; });
    state.prompts = state.prompts.filter(function (n) { return !n.sample; });
    state.meta.sampleClearedAt = Date.now();
    var result = { nodes: removedNodes, stickies: removedStickies, tasks: removedTasks, prompts: removedPrompts };
    if (removedNodes.length) emit('nodes', { action: 'samples-cleared', ids: removedNodes });
    if (removedStickies.length) emit('stickies', { action: 'samples-cleared', ids: removedStickies });
    if (removedTasks.length) emit('tasks', { action: 'samples-cleared', ids: removedTasks });
    if (removedPrompts.length) emit('prompts', { action: 'samples-cleared', ids: removedPrompts });
    state.meta.updatedAt = Date.now();
    touch();
    return result;
  }

  /* ---------------- stickies ---------------- */

  function topStickyZ() {
    var top = 0;
    for (var i = 0; i < state.stickies.length; i += 1) {
      var z = Number(state.stickies[i].z);
      if (Number.isFinite(z) && z > top) top = z;
    }
    return top;
  }

  /* 桌面上的便签 = 不在废纸篓里的那些。
     顺序 = 叠放顺序：最后碰过的那张在最上面。
     废纸篓里的内容只能通过 listTrashedStickies() 读到，不参与排版、配色与空态判断。 */
  function listStickies() {
    return state.stickies
      .filter(function (s) { return !(Number(s.trashedAt) > 0); })
      .sort(function (a, b) {
        var az = Number.isFinite(Number(a.z)) ? Number(a.z) : 0;
        var bz = Number.isFinite(Number(b.z)) ? Number(b.z) : 0;
        if (az !== bz) return az - bz;
        return a.createdAt - b.createdAt;
      });
  }

  /* 把一张便签提到最上面。已经是最上面时不动，避免无谓写盘。 */
  function raiseSticky(id) {
    var sticky = state.stickies.find(function (s) { return s.id === id; });
    if (!sticky) return null;
    var top = topStickyZ();
    if (Number(sticky.z) === top && top > 0) return U.clone(sticky);
    if (top >= 100000) {
      /* z 只用于叠放顺序，不该无限增长：到顶后按当前顺序归一化成 1..n。 */
      var ordered = listStickies();
      ordered.forEach(function (item, index) { item.z = index + 1; });
      top = ordered.length;
    }
    sticky.z = top + 1;
    sticky.updatedAt = Date.now();
    commit('stickies', { action: 'update', id: id });
    return U.clone(sticky);
  }

  function createSticky(data) {
    var info = data || {};
    var now = Date.now();
    var sticky = {
      id: U.uid('sticky'),
      text: typeof info.text === 'string' ? info.text.slice(0, 5000) : '',
      color: STICKY_COLORS.indexOf(info.color) !== -1 ? info.color : 'butter',
      x: Number.isFinite(Number(info.x)) ? Math.max(0, Number(info.x)) : 26,
      y: Number.isFinite(Number(info.y)) ? Math.max(0, Number(info.y)) : 26,
      sample: !!info.sample,
      z: Number.isFinite(Number(info.z)) ? Number(info.z) : topStickyZ() + 1,
      createdAt: now,
      updatedAt: now
    };
    state.stickies.push(sticky);
    commit('stickies', { action: 'create', id: sticky.id });
    return U.clone(sticky);
  }

  function updateSticky(id, patch) {
    var sticky = state.stickies.find(function (s) { return s.id === id; });
    if (!sticky) return null;
    var changes = patch || {};
    if (Object.prototype.hasOwnProperty.call(changes, 'text')) sticky.text = String(changes.text === undefined ? '' : changes.text).slice(0, 5000);
    if (Object.prototype.hasOwnProperty.call(changes, 'color') && STICKY_COLORS.indexOf(changes.color) !== -1) sticky.color = changes.color;
    if (Object.prototype.hasOwnProperty.call(changes, 'x') && Number.isFinite(Number(changes.x))) sticky.x = Math.max(0, Number(changes.x));
    if (Object.prototype.hasOwnProperty.call(changes, 'y') && Number.isFinite(Number(changes.y))) sticky.y = Math.max(0, Number(changes.y));
    sticky.updatedAt = Date.now();
    commit('stickies', { action: 'update', id: id });
    return U.clone(sticky);
  }

  /* 删除 = 进废纸篓，保留 7 天。空便签直接彻底删掉（没有内容可找回）。 */
  var TRASH_DAYS = 7;

  function deleteSticky(id) {
    var sticky = state.stickies.find(function (s) { return s.id === id; });
    if (!sticky) return null;
    if (!String(sticky.text || '').trim()) {
      state.stickies = state.stickies.filter(function (s) { return s.id !== id; });
      commit('stickies', { action: 'delete', id: id });
      return U.clone(sticky);
    }
    sticky.trashedAt = Date.now();
    sticky.updatedAt = Date.now();
    commit('stickies', { action: 'trash', id: id });
    return U.clone(sticky);
  }

  function listTrashedStickies() {
    pruneTrash();
    return state.stickies
      .filter(function (s) { return Number(s.trashedAt) > 0; })
      .sort(function (a, b) { return Number(b.trashedAt) - Number(a.trashedAt); });
  }

  function restoreSticky(id) {
    var sticky = state.stickies.find(function (s) { return s.id === id; });
    if (!sticky || !(Number(sticky.trashedAt) > 0)) return null;
    sticky.trashedAt = 0;
    sticky.z = topStickyZ() + 1;
    sticky.updatedAt = Date.now();
    commit('stickies', { action: 'restore', id: id });
    return U.clone(sticky);
  }

  function purgeSticky(id) {
    var sticky = state.stickies.find(function (s) { return s.id === id; });
    if (!sticky) return null;
    state.stickies = state.stickies.filter(function (s) { return s.id !== id; });
    commit('stickies', { action: 'delete', id: id });
    return U.clone(sticky);
  }

  /* 超过 7 天的废纸篓条目自动彻底删除。只在有人读废纸篓 / 启动时跑。 */
  function pruneTrash(now) {
    var stamp = Number(now) || Date.now();
    var cutoff = stamp - TRASH_DAYS * 24 * 60 * 60 * 1000;
    var expired = state.stickies.filter(function (s) {
      var at = Number(s.trashedAt);
      return at > 0 && at < cutoff;
    });
    if (!expired.length) return 0;
    expired.forEach(function (s) { s.trashedAt = s.trashedAt; });
    var ids = expired.map(function (s) { return s.id; });
    state.stickies = state.stickies.filter(function (s) { return ids.indexOf(s.id) === -1; });
    commit('stickies', { action: 'prune', count: ids.length });
    return ids.length;
  }

  /* ---------------- prompts ----------------
     提示词库是"可复用的一句话/一段话"，不是对话记录：
     - 只有一个写入口（本文件的 CRUD），页面与宿主输入框都读同一份快照；
     - 排序 = 置顶优先，其次最近修改；
     - 删除直接删（提示词很短，误删成本低），确认框在 UI 层做。
     标题清洗与上限放在这里，是因为 model 和 storage 都要用：
     事实源只有这一份，storage 侧通过 P.* 借用。
     ------------------------------------------ */

  P.PROMPT_TITLE_MAX = 120;
  P.PROMPT_BODY_MAX = 20000;
  P.PROMPT_LIMIT = 300;

  /* 标题只存用户写的东西（或正文第一行）：没有就存空串。
     语言相关的"未命名提示词"是 UI 占位文案，绝不写进数据 —— 否则中文快照在英文界面里会露出中文。 */
  function cleanPromptTitle(value, fallback) {
    var title = String(value === undefined || value === null ? '' : value)
      .replace(/[\r\n\t]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    if (title.length > P.PROMPT_TITLE_MAX) title = title.slice(0, P.PROMPT_TITLE_MAX);
    if (!title) title = String(fallback === undefined || fallback === null ? '' : fallback);
    return title;
  }

  function promptTitleFromBody(body) {
    var first = String(body || '').split('\n').map(function (line) { return line.trim(); }).filter(function (line) { return line !== ''; })[0] || '';
    if (first.length > P.PROMPT_TITLE_MAX) first = first.slice(0, P.PROMPT_TITLE_MAX);
    return first;
  }

  /* 旧版本把「未命名提示词」当标题写进过数据，英文构建还写出过「Untitled prompt」。
     这两个是**历史数据值**，不是 UI 文案：中文字面量用码位拼出来，
     免得 i18n 构建把它当文案翻译掉，旧的中文快照就再也认不出来。 */
  var LEGACY_UNTITLED_TITLES = [
    String.fromCharCode(26410, 21629, 21517, 25552, 31034, 35789),
    'Untitled prompt'
  ];

  function isLegacyUntitledTitle(value) {
    var text = String(value === undefined || value === null ? '' : value).trim();
    return !!text && LEGACY_UNTITLED_TITLES.indexOf(text) !== -1;
  }

  P.cleanPromptTitle = cleanPromptTitle;
  P.promptTitleFromBody = promptTitleFromBody;
  P.isLegacyUntitledTitle = isLegacyUntitledTitle;

  function promptSort(a, b) {
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    return Number(b.updatedAt) - Number(a.updatedAt);
  }

  function listPrompts(query) {
    var q = String(query === undefined || query === null ? '' : query).trim().toLowerCase();
    var items = state.prompts.slice().sort(promptSort);
    if (!q) return items.map(function (p) { return U.clone(p); });
    return items.filter(function (p) {
      return (String(p.title || '') + '\n' + String(p.body || '')).toLowerCase().indexOf(q) !== -1;
    }).map(function (p) { return U.clone(p); });
  }

  function getPrompt(id) {
    var prompt = state.prompts.find(function (p) { return p.id === id; });
    return prompt ? U.clone(prompt) : null;
  }

  function createPrompt(data) {
    if (state.prompts.length >= P.PROMPT_LIMIT) return null;
    var info = data || {};
    var now = Date.now();
    var body = typeof info.body === 'string' ? info.body.slice(0, P.PROMPT_BODY_MAX) : '';
    var prompt = {
      id: U.uid('prompt'),
      title: cleanPromptTitle(info.title, promptTitleFromBody(body)),
      body: body,
      pinned: !!info.pinned,
      sample: false,
      createdAt: now,
      updatedAt: now
    };
    state.prompts.push(prompt);
    commit('prompts', { action: 'create', id: prompt.id });
    return U.clone(prompt);
  }

  function updatePrompt(id, patch) {
    var prompt = state.prompts.find(function (p) { return p.id === id; });
    if (!prompt) return null;
    var changes = patch || {};
    var nextBody = prompt.body;
    if (Object.prototype.hasOwnProperty.call(changes, 'body')) {
      nextBody = String(changes.body === undefined || changes.body === null ? '' : changes.body).slice(0, P.PROMPT_BODY_MAX);
      prompt.body = nextBody;
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'title')) {
      prompt.title = cleanPromptTitle(changes.title, promptTitleFromBody(nextBody));
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'pinned')) prompt.pinned = !!changes.pinned;
    prompt.updatedAt = Date.now();
    commit('prompts', { action: 'update', id: id });
    return U.clone(prompt);
  }

  function deletePrompt(id) {
    var prompt = state.prompts.find(function (p) { return p.id === id; });
    if (!prompt) return null;
    state.prompts = state.prompts.filter(function (p) { return p.id !== id; });
    commit('prompts', { action: 'delete', id: id });
    return U.clone(prompt);
  }

  /* 把原生示例放回来（空态里的「放入示例」）。已存在同 id 的不重复加。 */
  function insertSamplePrompts() {
    var existing = {};
    state.prompts.forEach(function (p) { existing[p.id] = true; });
    var added = 0;
    P.freshSamplePrompts(Date.now()).forEach(function (item) {
      if (existing[item.id]) return;
      if (state.prompts.length >= P.PROMPT_LIMIT) return;
      state.prompts.push(item);
      added += 1;
    });
    if (added) commit('prompts', { action: 'samples-inserted', count: added });
    return added;
  }

  /* 复制一条：标题加「副本」，正文照抄，方便在别人的基础上改。 */
  function duplicatePrompt(id) {
    var source = state.prompts.find(function (p) { return p.id === id; });
    if (!source || state.prompts.length >= P.PROMPT_LIMIT) return null;
    var now = Date.now();
    var copy = {
      id: U.uid('prompt'),
      title: source.title ? cleanPromptTitle(source.title + ' 副本', '') : '',
      body: source.body,
      pinned: false,
      sample: false,
      createdAt: now,
      updatedAt: now
    };
    state.prompts.push(copy);
    commit('prompts', { action: 'duplicate', id: copy.id });
    return U.clone(copy);
  }

  /* ---------------- tasks ----------------
     两类待办同形，只有 repeat 不同：
       once  : date = 唯一出现的日子
       daily : date = 首次出现的日子；从那天起每天都有一个"当前实例"，
               但日历永远只铺"勾过的日子"，不铺未来。
     完成态只存在 doneOn 里（勾过的日子列表），没有 done 布尔。
     resolvedAt > 0 = 永久收起，未来不再长新实例。
     ------------------------------------------ */

  function todayKeySafe() {
    return U.todayKey();
  }

  function taskDaysDone(task) {
    return Array.isArray(task.doneOn) ? task.doneOn : [];
  }

  function taskDoneOn(task, day) {
    return taskDaysDone(task).indexOf(day) !== -1;
  }

  /* 这一天要不要在这天出现。today 用于判断「今天的当前实例」。 */
  function taskVisibleOn(task, day, today) {
    if (task.repeat === 'daily') {
      if (day < task.date) return false;
      /* 锚定日必须可见：在这一天把待办改成「每天」时，它不能当场消失。 */
      if (day === task.date) return true;
      if (taskDoneOn(task, day)) return true;
      if (task.resolvedAt > 0) {
        var resolvedKey = U.dateKey(new Date(task.resolvedAt));
        return day === resolvedKey;
      }
      return day === today;
    }
    return task.date === day;
  }

  /* 一天里可见的待办，已按「紧急程度 → 创建时间」排好序（与 done 无关，
     这样勾掉一条不会让圆点换位）。 */
  function projectTasks(day, today) {
    var todayKey = today || todayKeySafe();
    var out = [];
    for (var i = 0; i < state.tasks.length; i += 1) {
      var task = state.tasks[i];
      if (!taskVisibleOn(task, day, todayKey)) continue;
      out.push(projectTask(task, day, todayKey));
    }
    out.sort(compareTasks);
    return out;
  }

  function projectTask(task, day, todayKey) {
    var priority = P.priorityById(task.priority);
    return {
      id: task.id,
      date: task.date,
      title: task.title,
      priority: priority.id,
      priorityLabel: priority.label,
      color: priority.color,
      rank: priority.rank,
      repeat: task.repeat === 'daily' ? 'daily' : 'once',
      done: taskDoneOn(task, day),
      resolved: task.resolvedAt > 0,
      resolvedAt: task.resolvedAt,
      checkins: taskDaysDone(task).length,
      day: day,
      current: task.repeat === 'daily' && day === todayKey && !taskDoneOn(task, day) && !(task.resolvedAt > 0),
      sample: !!task.sample,
      createdAt: task.createdAt,
      updatedAt: task.updatedAt
    };
  }

  function compareTasks(a, b) {
    if (a.rank !== b.rank) return a.rank - b.rank;
    return a.createdAt - b.createdAt;
  }

  function priorityOf(id) {
    return P.priorityById(id).id;
  }

  function addTask(date, title, options) {
    var opts = options || {};
    var key = String(date || '');
    if (!U.parseDateKey(key)) throw new Error('日期格式无效。');
    var clean = String(title || '').replace(/\s+/g, ' ').trim().slice(0, 300);
    if (!clean) return null;
    var now = Date.now();
    var task = {
      id: U.uid('task'),
      date: key,
      title: clean,
      priority: priorityOf(opts.priority),
      repeat: opts.repeat === 'daily' ? 'daily' : 'once',
      doneOn: [],
      resolvedAt: 0,
      sample: false,
      createdAt: now,
      updatedAt: now
    };
    state.tasks.push(task);
    commit('tasks', { action: 'create', date: key, id: task.id });
    return U.clone(task);
  }

  function updateTask(id, patch) {
    var task = state.tasks.find(function (t) { return t.id === id; });
    if (!task) return null;
    var changes = patch || {};
    var changed = false;
    if (Object.prototype.hasOwnProperty.call(changes, 'title')) {
      var clean = String(changes.title || '').replace(/\s+/g, ' ').trim().slice(0, 300);
      if (clean && clean !== task.title) { task.title = clean; changed = true; }
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'priority')) {
      var nextPriority = priorityOf(changes.priority);
      if (nextPriority !== task.priority) { task.priority = nextPriority; changed = true; }
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'repeat')) {
      var nextRepeat = changes.repeat === 'daily' ? 'daily' : 'once';
      if (nextRepeat !== task.repeat) { task.repeat = nextRepeat; changed = true; }
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'date') && U.parseDateKey(changes.date) && changes.date !== task.date) {
      task.date = changes.date;
      changed = true;
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'resolvedAt')) {
      var nextResolved = Number(changes.resolvedAt) || 0;
      if (nextResolved !== task.resolvedAt) { task.resolvedAt = nextResolved; changed = true; }
    }
    if (Array.isArray(changes.doneOn)) {
      task.doneOn = cleanDayKeys(changes.doneOn);
      changed = true;
    }
    if (!changed) return U.clone(task);
    task.updatedAt = Date.now();
    commit('tasks', { action: 'update', id: id, date: task.date });
    return U.clone(task);
  }

  function cleanDayKeys(list) {
    var out = [];
    for (var i = 0; i < list.length; i += 1) {
      var key = String(list[i] || '');
      if (!U.parseDateKey(key)) continue;
      if (out.indexOf(key) === -1) out.push(key);
    }
    out.sort();
    return out;
  }

  /* 勾选 / 取消勾选：只改「这一天的打卡记录」，不动别的日子。 */
  function setTaskDone(id, day, done) {
    var task = state.tasks.find(function (t) { return t.id === id; });
    if (!task) return null;
    var key = String(day || U.todayKey());
    if (!U.parseDateKey(key)) return null;
    var list = taskDaysDone(task).slice();
    var at = list.indexOf(key);
    if (done && at === -1) list.push(key);
    if (!done && at !== -1) list.splice(at, 1);
    task.doneOn = cleanDayKeys(list);
    task.updatedAt = Date.now();
    commit('tasks', { action: 'update', id: id, date: task.date });
    return U.clone(task);
  }

  /* 永久收起：未来不再长新实例。已经勾过的日子保留在日历上（灰点）。 */
  function resolveTask(id) {
    var task = state.tasks.find(function (t) { return t.id === id; });
    if (!task) return null;
    if (task.resolvedAt > 0) return U.clone(task);
    task.resolvedAt = Date.now();
    task.updatedAt = Date.now();
    commit('tasks', { action: 'update', id: id, date: task.date });
    return U.clone(task);
  }

  function unresolveTask(id) {
    var task = state.tasks.find(function (t) { return t.id === id; });
    if (!task) return null;
    if (!task.resolvedAt) return U.clone(task);
    task.resolvedAt = 0;
    task.updatedAt = Date.now();
    commit('tasks', { action: 'update', id: id, date: task.date });
    return U.clone(task);
  }

  /* 撤销删除用的原样回填：保留 doneOn / priority / repeat / resolvedAt。 */
  function restoreTask(snapshot) {
    if (!snapshot || typeof snapshot !== 'object') return null;
    var now = Date.now();
    var task = {
      id: U.uid('task'),
      date: U.parseDateKey(snapshot.date) ? snapshot.date : U.todayKey(),
      title: String(snapshot.title || '').replace(/\s+/g, ' ').trim().slice(0, 300) || '未命名待办',
      priority: priorityOf(snapshot.priority),
      repeat: snapshot.repeat === 'daily' ? 'daily' : 'once',
      doneOn: cleanDayKeys(Array.isArray(snapshot.doneOn) ? snapshot.doneOn : []),
      resolvedAt: Number(snapshot.resolvedAt) || 0,
      sample: !!snapshot.sample,
      createdAt: Number(snapshot.createdAt) || now,
      updatedAt: now
    };
    state.tasks.push(task);
    commit('tasks', { action: 'create', date: task.date, id: task.id });
    return U.clone(task);
  }

  function deleteTask(id) {
    var task = state.tasks.find(function (t) { return t.id === id; });
    if (!task) return null;
    state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
    commit('tasks', { action: 'delete', id: id, date: task.date });
    return U.clone(task);
  }

  /* 「本月 N 件」：条目数，不随打卡天数增长。daily 只要存续区间与本月相交就算 1 件。 */
  function monthTaskCount(prefix, today) {
    var todayKey = today || todayKeySafe();
    var total = 0;
    var recurring = 0;
    state.tasks.forEach(function (task) {
      var start = task.date || '';
      if (task.repeat === 'daily') {
        if (start.indexOf(prefix) > 0) return;
        var endKey = task.resolvedAt > 0 ? U.dateKey(new Date(task.resolvedAt)) : todayKey;
        if (endKey < prefix + '-01') return;
        if (start > prefix + '-31') return;
        total += 1;
        recurring += 1;
        return;
      }
      if (start.indexOf(prefix) === 0) total += 1;
    });
    return { total: total, recurring: recurring };
  }

  /* ---------------- preferences / metadata ---------------- */

  function getPrefs() {
    return U.clone(state.prefs);
  }

  function setPrefs(patch) {
    var changes = patch || {};
    var changed = false;
    if (Object.prototype.hasOwnProperty.call(changes, 'paperTone') && ['cream', 'oat', 'fog'].indexOf(changes.paperTone) !== -1 && state.prefs.paperTone !== changes.paperTone) {
      state.prefs.paperTone = changes.paperTone;
      changed = true;
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'dockOrder') && Array.isArray(changes.dockOrder)) {
      var wanted = changes.dockOrder.filter(function (id) { return typeof id === 'string' && id; }).slice(0, 24);
      if (JSON.stringify(wanted) !== JSON.stringify(state.prefs.dockOrder)) {
        state.prefs.dockOrder = wanted;
        changed = true;
      }
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'paperTexture') && state.prefs.paperTexture !== !!changes.paperTexture) {
      state.prefs.paperTexture = !!changes.paperTexture;
      changed = true;
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'showGrid') && state.prefs.showGrid !== !!changes.showGrid) {
      state.prefs.showGrid = !!changes.showGrid;
      changed = true;
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'motion') && ['system', 'reduce'].indexOf(changes.motion) !== -1 && state.prefs.motion !== changes.motion) {
      state.prefs.motion = changes.motion;
      changed = true;
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'theme') && ['system', 'light', 'dark'].indexOf(changes.theme) !== -1 && state.prefs.theme !== changes.theme) {
      state.prefs.theme = changes.theme;
      changed = true;
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'handFont') && ['kai', 'xing', 'serif'].indexOf(changes.handFont) !== -1 && state.prefs.handFont !== changes.handFont) {
      state.prefs.handFont = changes.handFont;
      changed = true;
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'lang') && ['system', 'zh', 'en'].indexOf(changes.lang) !== -1 && state.prefs.lang !== changes.lang) {
      state.prefs.lang = changes.lang;
      changed = true;
    }
    if (Object.prototype.hasOwnProperty.call(changes, 'welcomeDismissed') && state.prefs.welcomeDismissed !== !!changes.welcomeDismissed) {
      state.prefs.welcomeDismissed = !!changes.welcomeDismissed;
      changed = true;
    }
    if (changed) {
      state.meta.updatedAt = Date.now();
      emit('prefs', { prefs: U.clone(state.prefs) });
      touch();
    }
    return U.clone(state.prefs);
  }

  function getMeta() {
    return U.clone(state.meta);
  }

  function hydrationSnapshot() {
    var snap = U.clone(state);
    return snap;
  }

  function hydrate(snapshot) {
    var incoming = snapshot || {};
    var next = createEmptyState();
    if (incoming.prefs && typeof incoming.prefs === 'object') {
      if (['cream', 'oat', 'fog'].indexOf(incoming.prefs.paperTone) !== -1) next.prefs.paperTone = incoming.prefs.paperTone;
      if (typeof incoming.prefs.paperTexture === 'boolean') next.prefs.paperTexture = incoming.prefs.paperTexture;
      if (Array.isArray(incoming.prefs.dockOrder)) {
        next.prefs.dockOrder = incoming.prefs.dockOrder.filter(function (id) { return typeof id === 'string' && id; }).slice(0, 24);
      }
      if (typeof incoming.prefs.showGrid === 'boolean') next.prefs.showGrid = incoming.prefs.showGrid;
      if (['system', 'reduce'].indexOf(incoming.prefs.motion) !== -1) next.prefs.motion = incoming.prefs.motion;
      if (['system', 'light', 'dark'].indexOf(incoming.prefs.theme) !== -1) next.prefs.theme = incoming.prefs.theme;
      if (['kai', 'xing', 'serif'].indexOf(incoming.prefs.handFont) !== -1) next.prefs.handFont = incoming.prefs.handFont;
      if (['system', 'zh', 'en'].indexOf(incoming.prefs.lang) !== -1) next.prefs.lang = incoming.prefs.lang;
      next.prefs.welcomeDismissed = !!incoming.prefs.welcomeDismissed;
    }
    if (incoming.meta && typeof incoming.meta === 'object') {
      next.meta.createdAt = Number(incoming.meta.createdAt) || Date.now();
      next.meta.updatedAt = Number(incoming.meta.updatedAt) || Date.now();
      next.meta.seededAt = Number(incoming.meta.seededAt) || 0;
      next.meta.welcomeDocId = typeof incoming.meta.welcomeDocId === 'string' ? incoming.meta.welcomeDocId : '';
      if (incoming.meta.sampleClearedAt) next.meta.sampleClearedAt = Number(incoming.meta.sampleClearedAt) || 0;
      next.meta.promptsSeededAt = Number(incoming.meta.promptsSeededAt) || 0;
    }
    next.nodes = Array.isArray(incoming.nodes) ? incoming.nodes : [];
    next.stickies = Array.isArray(incoming.stickies) ? incoming.stickies : [];
    next.tasks = Array.isArray(incoming.tasks) ? incoming.tasks : [];
    next.prompts = Array.isArray(incoming.prompts) ? incoming.prompts : [];
    /* 原生示例只铺一次：从没铺过、也没清过示例的工作区（包括"库里已经有自己写的提示词"的老用户），
       在这里补上三条并记下时间戳；此后无论手动删光还是清示例，都不会再长回来。 */
    if (!next.meta.promptsSeededAt && !next.meta.sampleClearedAt) {
      var seeded = P.freshSamplePrompts(next.meta.createdAt || Date.now());
      var known = {};
      next.prompts.forEach(function (p) { if (p && p.id) known[p.id] = true; });
      seeded.forEach(function (p) { if (!known[p.id]) next.prompts.push(p); });
      next.meta.promptsSeededAt = Date.now();
    }
    state = next;
  }

  function bezier(p0, p1, p2, p3, count) {
    var out = [];
    var steps = Math.max(4, count || 24);
    for (var i = 0; i <= steps; i += 1) {
      var t = i / steps;
      var mt = 1 - t;
      out.push({
        x: mt * mt * mt * p0.x + 3 * mt * mt * t * p1.x + 3 * mt * t * t * p2.x + t * t * t * p3.x,
        y: mt * mt * mt * p0.y + 3 * mt * mt * t * p1.y + 3 * mt * t * t * p2.y + t * t * t * p3.y
      });
    }
    return out;
  }

  function leafPoints(cx, cy, length, width, angle) {
    var points = [];
    var steps = 15;
    var cos = Math.cos(angle);
    var sin = Math.sin(angle);
    var i;
    for (i = 0; i <= steps; i += 1) {
      var t = i / steps;
      points.push({
        x: cx + cos * length * t + (-sin) * width * Math.sin(Math.PI * t),
        y: cy + sin * length * t + cos * width * Math.sin(Math.PI * t)
      });
    }
    for (i = steps; i >= 0; i -= 1) {
      var t2 = i / steps;
      points.push({
        x: cx + cos * length * t2 + sin * width * Math.sin(Math.PI * t2),
        y: cy + sin * length * t2 + (-cos) * width * Math.sin(Math.PI * t2)
      });
    }
    return points;
  }

  function fruitPoints(cx, cy, radius, turns) {
    var points = [];
    var steps = 96;
    for (var i = 0; i <= steps; i += 1) {
      var t = i / steps;
      var angle = t * Math.PI * 2 * (turns || 3.4) - 0.8;
      var rr = radius * (0.18 + 0.82 * t);
      points.push({ x: cx + Math.cos(angle) * rr, y: cy + Math.sin(angle) * rr * 0.92 });
    }
    return points;
  }

  }

  function validId(value) {
    return typeof value === 'string' && /^[A-Za-z0-9_-]{1,100}$/.test(value);
  }

  function validThumb(value) {
    return typeof value === 'string' && (
      value === '' || (/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=\s]+$/.test(value) && value.length <= 3000000)
    );
  }

  function validateStrokes(raw) {
    if (raw === undefined || raw === null) return { ok: true, value: [] };
    if (!Array.isArray(raw)) return { ok: false, error: '画纸笔迹数据格式不正确。' };
    if (raw.length > 5000) return { ok: false, error: '画纸的笔迹数量过多。' };
    var out = [];
    var pointBudget = 0;
    for (var i = 0; i < raw.length; i += 1) {
      var stroke = raw[i];
      if (!stroke || typeof stroke !== 'object') return { ok: false, error: '画纸上有一笔无法识别的笔迹。' };
      if (!Array.isArray(stroke.points) || stroke.points.length < 1 || stroke.points.length > 12000) {
        return { ok: false, error: '画纸笔迹的坐标数据不完整。' };
      }
      var points = [];
      for (var j = 0; j < stroke.points.length; j += 1) {
        var point = stroke.points[j];
        if (!point || !Number.isFinite(Number(point.x)) || !Number.isFinite(Number(point.y))) {
          return { ok: false, error: '画纸笔迹里含有无效坐标。' };
        }
        points.push({ x: U.clamp(Number(point.x), -2000, 12000), y: U.clamp(Number(point.y), -2000, 12000) });
      }
      pointBudget += points.length;
      if (pointBudget > 360000) return { ok: false, error: '画纸的笔迹数据过大。' };
      var color = typeof stroke.color === 'string' && /^#[0-9A-Fa-f]{3,8}$/.test(stroke.color) ? stroke.color : '#34362f';
      out.push({
        points: points,
        color: color,
        width: U.clamp(numberOr(stroke.width, 3), 0.5, 80),
        eraser: !!stroke.eraser
      });
    }
    return { ok: true, value: out };
  }

  function sanitizePrefs(raw) {
    var prefs = {
      /* paperTone 只为读旧快照而保留（已无 UI）；新增 paperTexture 才真正生效。 */
      paperTone: 'cream',
      paperTexture: true,
      showGrid: true,
      motion: 'system',
      theme: 'system',
      handFont: 'kai',
      lang: 'system',
      welcomeDismissed: false,
      dockOrder: []
    };
    if (!raw || typeof raw !== 'object') return prefs;
    if (['cream', 'oat', 'fog'].indexOf(raw.paperTone) !== -1) prefs.paperTone = raw.paperTone;
    if (typeof raw.paperTexture === 'boolean') prefs.paperTexture = raw.paperTexture;
    if (Array.isArray(raw.dockOrder)) {
      prefs.dockOrder = raw.dockOrder.filter(function (id) { return typeof id === 'string' && id && id.length <= 40; }).slice(0, 24);
    }
    if (typeof raw.showGrid === 'boolean') prefs.showGrid = raw.showGrid;
    if (['system', 'reduce'].indexOf(raw.motion) !== -1) prefs.motion = raw.motion;
    if (['system', 'light', 'dark'].indexOf(raw.theme) !== -1) prefs.theme = raw.theme;
    if (['kai', 'xing', 'serif'].indexOf(raw.handFont) !== -1) prefs.handFont = raw.handFont;
    if (['system', 'zh', 'en'].indexOf(raw.lang) !== -1) prefs.lang = raw.lang;
    prefs.welcomeDismissed = !!raw.welcomeDismissed;
    return prefs;
  }

  /* 提示词库：与便签/待办同一套"严格白名单 + 上限"纪律。
     未知字段直接丢掉（不合并），这样从未来版本降级读旧文件时不会把脏字段写回。
     标题清洗与长度上限是 model 层的事实源（P.cleanPromptTitle / P.PROMPT_BODY_MAX），
     storage 只借用，不另存一份。 */
  function sanitizePrompts(raw, now) {
    /* 旧 v3 文件在提示词库出现之前写过盘，根本没有 prompts 字段 —— 那是"从没铺过"，
       与"用户清空了"（空数组）不是一回事，所以这里铺原生示例。 */
    if (raw === undefined || raw === null) return P.freshSamplePrompts(now);
    if (!Array.isArray(raw)) return null;
    if (raw.length > P.PROMPT_LIMIT) return null;
    var out = [];
    var seen = {};
    for (var i = 0; i < raw.length; i += 1) {
      var item = raw[i];
      if (!item || typeof item !== 'object') return null;
      if (!validId(item.id)) return null;
      if (seen[item.id]) return null;
      seen[item.id] = true;
      if (item.body !== undefined && item.body !== null && typeof item.body !== 'string') return null;
      var body = typeof item.body === 'string' ? item.body : '';
      if (body.length > P.PROMPT_BODY_MAX) return null;
      /* 旧快照里的语言哨兵不搬进新数据：归一成空标题，界面按自己的语言显示占位。 */
      var cleanTitle = P.cleanPromptTitle(item.title, P.promptTitleFromBody(body));
      if (P.isLegacyUntitledTitle(cleanTitle)) cleanTitle = '';
      out.push({
        id: item.id,
        title: cleanTitle,
        body: body,
        pinned: !!item.pinned,
        sample: !!item.sample,
        createdAt: numberOr(item.createdAt, now),
        updatedAt: numberOr(item.updatedAt, now)
      });
    }
    return out;
  }

  function sanitizeWindowParams(raw) {
    var params = {};
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return params;
    if (typeof raw.docId === 'string' && validId(raw.docId)) params.docId = raw.docId;
    if (typeof raw.folderId === 'string' && validId(raw.folderId)) params.folderId = raw.folderId;
    if (typeof raw.section === 'string' && /^[a-z-]{1,30}$/.test(raw.section)) params.section = raw.section;
    if (typeof raw.view === 'string' && /^[A-Za-z0-9:_-]{1,90}$/.test(raw.view)) params.view = raw.view;
    return params;
  }

  function sanitizeDesktop(raw) {
    var result = { windows: [] };
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.windows)) return { ok: true, value: result };
    if (raw.windows.length > 12) return { ok: false, error: '保存的窗口数量超出纸屿的上限。' };
    var seen = {};
    for (var i = 0; i < raw.windows.length; i += 1) {
      var win = raw.windows[i];
      if (!win || typeof win !== 'object') return { ok: false, error: '保存的窗口数据不完整。' };
      if (typeof win.appId !== 'string' || !APP_ID_PATTERN.test(win.appId)) {
        return { ok: false, error: '保存的窗口缺少有效的应用标识。' };
      }
      if (seen[win.appId]) continue;
      var bounds = win.bounds;
      if (!bounds || typeof bounds !== 'object') return { ok: false, error: '保存的窗口缺少位置数据。' };
      var x = Number(bounds.x);
      var y = Number(bounds.y);
      var w = Number(bounds.w);
      var h = Number(bounds.h);
      if (![x, y, w, h].every(Number.isFinite)) return { ok: false, error: '保存的窗口位置不是有效数字。' };
      seen[win.appId] = true;
      result.windows.push({
        appId: win.appId,
        bounds: { x: x, y: y, w: U.clamp(w, 240, 10000), h: U.clamp(h, 160, 10000) },
        minimized: !!win.minimized,
        maximized: !!win.maximized,
        focused: !!win.focused,
        params: sanitizeWindowParams(win.params)
      });
    }
    if (result.windows.length && !result.windows.some(function (win) { return win.focused; })) {
      var visible = result.windows.filter(function (win) { return !win.minimized; });
      var target = visible.length ? visible[visible.length - 1] : result.windows[result.windows.length - 1];
      target.focused = true;
    }
    return { ok: true, value: result };
  }

  /**
   * Strictly validate and normalize an imported workspace.
   * Nothing is mutated here; callers may safely reject without touching live data.
   */
  function validateWorkspace(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
      return invalid('这不是一个可识别的 PAPER OS 工作区。');
    }
    if (raw.format !== 'paper-os/workspace') {
      return invalid('文件缺少 PAPER OS 工作区标记，可能不是由纸屿导出的。');
    }
    // 这里只做"当前版本"的严格比对；旧版本必须先经由 P.migrateWorkspace 升级。
    if (raw.version !== P.schemaVersion) {
      return invalid('工作区版本不受支持（文件版本：' + String(raw.version) + '，当前版本：' + P.schemaVersion + '）。');
    }
    if (!Array.isArray(raw.nodes) || !Array.isArray(raw.stickies) || !Array.isArray(raw.tasks)) {
      return invalid('工作区结构不完整：nodes / stickies / tasks 必须都是数组。');
    }
    if (raw.prompts !== undefined && raw.prompts !== null && !Array.isArray(raw.prompts)) {
      return invalid('工作区里的提示词库格式不正确。');
    }
    if (raw.nodes.length > 5000) return invalid('工作区里的文件数量超出上限。');
    if (raw.stickies.length > 800) return invalid('工作区里的便签数量超出上限。');
    if (raw.tasks.length > 8000) return invalid('工作区里的待办数量超出上限。');

    var now = Date.now();
    var nodes = [];
    var nodeIds = {};
    var i;
    for (i = 0; i < raw.nodes.length; i += 1) {
      var rawNode = raw.nodes[i];
      if (!rawNode || typeof rawNode !== 'object') return invalid('第 ' + (i + 1) + ' 个文件的格式不正确。');
      if (!validId(rawNode.id)) return invalid('第 ' + (i + 1) + ' 个文件缺少有效编号。');
      if (nodeIds[rawNode.id]) return invalid('工作区里有重复的文件编号：' + rawNode.id + '。');
      nodeIds[rawNode.id] = true;
      if (rawNode.type !== 'folder' && rawNode.type !== 'doc') return invalid('文件「' + U.escapeHTML(rawNode.name || '') + '」的类型无法识别。');
      var name = cleanName(rawNode.name);
      if (!name) return invalid('工作区里存在没有名字的文件，无法导入。');
      var node = {
        id: rawNode.id,
        type: rawNode.type,
        name: name,
        parentId: rawNode.parentId === undefined || rawNode.parentId === null ? null : String(rawNode.parentId),
        sample: !!rawNode.sample,
        createdAt: numberOr(rawNode.createdAt, now),
        updatedAt: numberOr(rawNode.updatedAt, now)
      };
      if (node.parentId !== null && !validId(node.parentId)) return invalid('文件「' + name + '」引用了无效的上级文件夹。');
      if (node.type === 'doc') {
        if (rawNode.kind !== 'note' && rawNode.kind !== 'drawing') return invalid('纸页「' + name + '」的类型无法识别。');
        node.kind = rawNode.kind;
        if (node.kind === 'note') {
          if (rawNode.content !== undefined && rawNode.content !== null && typeof rawNode.content !== 'string') {
            return invalid('纸页「' + name + '」的正文格式不正确。');
          }
          var content = typeof rawNode.content === 'string' ? rawNode.content : '';
          if (content.length > 4000000) return invalid('纸页「' + name + '」的正文过长。');
          node.content = content;
        } else {
          var strokeResult = validateStrokes(rawNode.strokes);
          if (!strokeResult.ok) return invalid('「' + name + '」：' + strokeResult.error);
          node.strokes = strokeResult.value;
          node.width = U.clamp(numberOr(rawNode.width, 1200), 200, 5000);
          node.height = U.clamp(numberOr(rawNode.height, 800), 200, 5000);
          if (!validThumb(rawNode.thumb === undefined || rawNode.thumb === null ? '' : rawNode.thumb)) {
            return invalid('画纸「' + name + '」包含无法识别的缩略图。');
          }
          node.thumb = typeof rawNode.thumb === 'string' ? rawNode.thumb : '';
        }
      }
      nodes.push(node);
    }

    var nodeMap = {};
    nodes.forEach(function (node) { nodeMap[node.id] = node; });
    for (i = 0; i < nodes.length; i += 1) {
      var current = nodes[i];
      if (current.parentId !== null) {
        var parent = nodeMap[current.parentId];
        if (!parent) return invalid('文件「' + current.name + '」的上级文件夹不存在。');
        if (parent.type !== 'folder') return invalid('文件「' + current.name + '」被放进了另一张纸里，位置数据无效。');
      }
      var seen = {};
      var cursor = current;
      var guard = 0;
      while (cursor && guard < 600) {
        if (seen[cursor.id]) return invalid('文件夹「' + current.name + '」的位置形成了循环。');
        seen[cursor.id] = true;
        cursor = cursor.parentId ? nodeMap[cursor.parentId] : null;
        guard += 1;
      }
      if (guard >= 600) return invalid('文件夹层级过深，无法导入。');
    }

    var stickies = [];
    var stickyIds = {};
    for (i = 0; i < raw.stickies.length; i += 1) {
      var rawSticky = raw.stickies[i];
      if (!rawSticky || typeof rawSticky !== 'object') return invalid('第 ' + (i + 1) + ' 张便签的格式不正确。');
      if (!validId(rawSticky.id)) return invalid('第 ' + (i + 1) + ' 张便签缺少有效编号。');
      if (stickyIds[rawSticky.id]) return invalid('工作区里有重复的便签编号。');
      stickyIds[rawSticky.id] = true;
      if (rawSticky.text !== undefined && rawSticky.text !== null && typeof rawSticky.text !== 'string') {
        return invalid('第 ' + (i + 1) + ' 张便签的文字格式不正确。');
      }
      stickies.push({
        id: rawSticky.id,
        text: typeof rawSticky.text === 'string' ? rawSticky.text.slice(0, 5000) : '',
        color: ALLOWED_STICKY_COLORS.indexOf(rawSticky.color) !== -1 ? rawSticky.color : 'butter',
        x: U.clamp(numberOr(rawSticky.x, 26), 0, 20000),
        y: U.clamp(numberOr(rawSticky.y, 26), 0, 20000),
        sample: !!rawSticky.sample,
        z: U.clamp(numberOr(rawSticky.z, i + 1), 0, 1000000),
        trashedAt: Math.max(0, numberOr(rawSticky.trashedAt, 0)),
        createdAt: numberOr(rawSticky.createdAt, now),
        updatedAt: numberOr(rawSticky.updatedAt, now)
      });
    }

    var tasks = [];
    var taskIds = {};
    for (i = 0; i < raw.tasks.length; i += 1) {
      var rawTask = raw.tasks[i];
      if (!rawTask || typeof rawTask !== 'object') return invalid('第 ' + (i + 1) + ' 条待办的格式不正确。');
      if (!validId(rawTask.id)) return invalid('第 ' + (i + 1) + ' 条待办缺少有效编号。');
      if (taskIds[rawTask.id]) return invalid('工作区里有重复的待办编号。');
      taskIds[rawTask.id] = true;
      if (typeof rawTask.title !== 'string' || !rawTask.title.trim()) return invalid('第 ' + (i + 1) + ' 条待办没有标题。');
      if (!U.parseDateKey(rawTask.date)) return invalid('有一条待办关联了无效的日期。');
      tasks.push({
        id: rawTask.id,
        date: rawTask.date,
        title: rawTask.title.replace(/\s+/g, ' ').trim().slice(0, 300),
        priority: sanitizePriority(rawTask.priority),
        repeat: rawTask.repeat === 'daily' ? 'daily' : 'once',
        doneOn: sanitizeDayKeys(rawTask.doneOn),
        resolvedAt: Math.max(0, numberOr(rawTask.resolvedAt, 0)),
        sample: !!rawTask.sample,
        createdAt: numberOr(rawTask.createdAt, now),
        updatedAt: numberOr(rawTask.updatedAt, now)
      });
    }

    var prefs = sanitizePrefs(raw.prefs);
    var desktopResult = sanitizeDesktop(raw.desktop);
    if (!desktopResult.ok) return invalid(desktopResult.error);

    var meta = {
      createdAt: now,
      updatedAt: now,
      seededAt: 0,
      welcomeDocId: ''
    };
    if (raw.meta && typeof raw.meta === 'object') {
      meta.createdAt = numberOr(raw.meta.createdAt, now);
      meta.updatedAt = numberOr(raw.meta.updatedAt, now);
      meta.seededAt = numberOr(raw.meta.seededAt, 0);
      if (typeof raw.meta.welcomeDocId === 'string' && nodeMap[raw.meta.welcomeDocId] && nodeMap[raw.meta.welcomeDocId].kind === 'note') {
        meta.welcomeDocId = raw.meta.welcomeDocId;
      }
      if (raw.meta.sampleClearedAt) meta.sampleClearedAt = numberOr(raw.meta.sampleClearedAt, 0);
      if (raw.meta.promptsSeededAt) meta.promptsSeededAt = numberOr(raw.meta.promptsSeededAt, 0);
    }

    var prompts = sanitizePrompts(raw.prompts, now);
    if (prompts === null) return invalid('提示词库里有一条内容的格式无法识别（编号、标题或正文超限）。');

    var snapshot = {
      format: 'paper-os/workspace',
      version: P.schemaVersion,
      exportedAt: new Date().toISOString(),
      prefs: prefs,
      meta: meta,
      nodes: nodes,
      stickies: stickies,
      tasks: tasks,
      prompts: prompts,
      desktop: desktopResult.value
    };
    var summary = {
      folders: nodes.filter(function (n) { return n.type === 'folder'; }).length,
      notes: nodes.filter(function (n) { return n.kind === 'note'; }).length,
      drawings: nodes.filter(function (n) { return n.kind === 'drawing'; }).length,
      stickies: stickies.length,
      tasks: tasks.length,
      prompts: prompts.length,
      windows: desktopResult.value.windows.length
    };
    return { ok: true, snapshot: snapshot, summary: summary };
  }

  /**
   * 唯一入口：任意来源的工作区（host 快照 / IndexedDB / localStorage / 恢复日志 / 导入文件）
   * 都先过迁移阶梯，再过当前版本的严格校验。
   * 迁移失败时绝不返回快照 —— 调用方必须拒绝，而不是拿一个旧版本对象继续跑。
   */
  function ingestWorkspace(raw) {
    if (!raw || typeof raw !== 'object') return { ok: false, error: '这不是一个可识别的工作区。' };
    var migrated = P.migrateWorkspace(raw);
    if (!migrated.ok) {
      if (migrated.reason === 'newer') {
        return {
          ok: false,
          newer: true,
          error: '这份工作区来自更新的纸屿（文件版本 v' + String(raw && raw.version) + '，当前只认到 v' + P.schemaVersion + '）。请升级插件后再打开。'
        };
      }
      return { ok: false, error: '工作区版本无法迁移：' + (migrated.detail || migrated.reason) };
    }
    var validated = validateWorkspace(migrated.snapshot);
    if (!validated.ok) return validated;
    validated.migratedFrom = migrated.from;
    validated.migrated = migrated.from !== P.schemaVersion;
    return validated;
  }

  /* ---------------- IndexedDB plumbing ---------------- */

  var db = null;
  var mode = 'memory';
  var status = { phase: 'booting', at: null, error: null };
  var statusListeners = new Set();
  var dataStatus = { phase: 'booting', at: null, error: null };
  var dataListeners = new Set();
  var dataRevision = 0;
  var savedDataRevision = 0;
  var ready = false;
  var dirty = false;
  var timer = null;
  var savePromise = null;
  var saveGeneration = 0;
  var lastSaveAttempt = null;
  var lastLoadError = null;
  var retryTimer = null;
  var suppressJournal = false;

  function setStatus(phase, at, error) {
    status = { phase: phase, at: at || null, error: error || null };
    statusListeners.forEach(function (fn) {
      try { fn(Object.assign({}, status)); } catch (err) { /* ignore */ }
    });
  }

  function subscribeStatus(fn) {
    statusListeners.add(fn);
    try { fn(Object.assign({}, status)); } catch (err) { /* ignore */ }
    return function () { statusListeners.delete(fn); };
  }

  function setDataStatus(phase, at, error) {
    dataStatus = { phase: phase, at: at || null, error: error || null };
    dataListeners.forEach(function (fn) {
      try { fn(Object.assign({}, dataStatus)); } catch (err) { /* ignore */ }
    });
  }

  function subscribeDataStatus(fn) {
    dataListeners.add(fn);
    try { fn(Object.assign({}, dataStatus)); } catch (err) { /* ignore */ }
    return function () { dataListeners.delete(fn); };
  }

  function openDB() {
    return new Promise(function (resolve, reject) {
      if (!('indexedDB' in window) || !window.indexedDB) {
        reject(new Error('此浏览器不支持 IndexedDB。'));
        return;
      }
      var request;
      try {
        request = window.indexedDB.open(DB_NAME, DB_VERSION);
      } catch (err) {
        reject(err);
        return;
      }
      request.onupgradeneeded = function () {
        var database = request.result;
        if (!database.objectStoreNames.contains(DB_STORE)) database.createObjectStore(DB_STORE);
      };
      request.onsuccess = function () { resolve(request.result); };
      request.onerror = function () { reject(request.error || new Error('无法打开本地存储。')); };
      request.onblocked = function () { reject(new Error('本地存储被其他标签页占用。')); };
    });
  }

  function dbGet() {
    return new Promise(function (resolve, reject) {
      if (!db) { resolve(null); return; }
      var transaction;
      try {
        transaction = db.transaction(DB_STORE, 'readonly');
      } catch (err) { reject(err); return; }
      var request = transaction.objectStore(DB_STORE).get(DB_KEY);
      request.onsuccess = function () { resolve(request.result || null); };
      request.onerror = function () { reject(request.error || new Error('读取本地数据失败。')); };
    });
  }

  function dbPut(snapshot) {
    return new Promise(function (resolve, reject) {
      if (!db) { reject(new Error('本地存储尚未打开。')); return; }
      var transaction;
      try {
        transaction = db.transaction(DB_STORE, 'readwrite');
      } catch (err) { reject(err); return; }
      var request = transaction.objectStore(DB_STORE).put(snapshot, DB_KEY);
      request.onsuccess = function () { resolve(); };
      request.onerror = function () { reject(request.error || new Error('写入本地数据失败。')); };
      transaction.onerror = function () { /* request.onerror carries detail */ };
    });
  }

  function dbDelete() {
    return new Promise(function (resolve, reject) {
      if (!db) { resolve(); return; }
      var transaction;
      try {
        transaction = db.transaction(DB_STORE, 'readwrite');
      } catch (err) { reject(err); return; }
      var request = transaction.objectStore(DB_STORE).delete(DB_KEY);
      request.onsuccess = function () { resolve(); };
      request.onerror = function () { reject(request.error || new Error('清空本地数据失败。')); };
    });
  }

  function readLocalStorage() {
    try {
      var raw = window.localStorage.getItem(LS_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (err) {
      lastLoadError = err;
      return null;
    }
  }

  function writeLocalStorage(snapshot) {
    try {
      window.localStorage.setItem(LS_KEY, JSON.stringify(snapshot));
      return true;
    } catch (err) {
      lastLoadError = err;
      throw err;
    }
  }

  function removeLocalStorage() {
    try { window.localStorage.removeItem(LS_KEY); } catch (err) { /* ignore */ }
  }

  function readRecoveryJournal() {
    try {
      var raw = window.localStorage.getItem(JOURNAL_KEY);
      if (!raw) return null;
