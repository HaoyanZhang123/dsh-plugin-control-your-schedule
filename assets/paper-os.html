        mount: mount,
        updateParams: function (params) {
          if (params && params.promptId) selectPrompt(params.promptId);
        },
        destroy: function () {
          clearTimeout(searchTimer);
          clearTimeout(titleTimer);
        }
      };
    }
  });
})();

/* ===== src/js/apps/notes.js ===== */
/* ============================================================
   PAPER OS — Paper Notes app
   ============================================================ */
(function () {
  'use strict';

  var P = window.PaperOS;
  var U = P.util;

  P.registerApp({
    id: 'notes',
    name: '纸页笔记',
    english: 'PAPER NOTES',
    description: '写长文；左侧搜索、切换纸页，自动保存',
    defaultSize: { w: 990, h: 660 },
    minSize: { w: 430, h: 360 },
    create: function (ctx) {
      var refs = {};
      var currentId = null;
      var missing = null;
      var deletingCurrent = false;
      var composingTitle = false;
      var searchTimer = null;
      var titleCommitTimer = null;

      var TITLE_DELAY = 340;
      var SEARCH_DELAY = 70;
      /* 没起名字的纸页：标题区像正文一样显示 placeholder，而不是把「未命名纸页」当成正文写进去。 */
      var UNTITLED = '未命名纸页';

      function isUntitled(name) {
        return typeof name === 'string' && name.indexOf(UNTITLED) === 0;
      }

      function currentDoc() {
        return currentId ? P.data.getNode(currentId) : null;
      }

      function saveStatusText(status) {
        var label = '已保存';
        if (status.phase === 'pending') label = '改动待保存';
        else if (status.phase === 'saving') label = '正在保存…';
        else if (status.phase === 'error') label = '保存遇到问题';
        else if (status.phase === 'idle') label = '还没有改动';
        else if (status.phase === 'booting') label = '正在铺纸';
        if (refs.railSave) {
          refs.railSave.textContent = label;
          refs.railSave.setAttribute('data-state', status.phase || 'idle');
        }
        if (refs.editorSave) {
          refs.editorSave.textContent = label;
          refs.editorSave.setAttribute('data-state', status.phase || 'idle');
        }
      }

      function updateCount(list) {
        if (!refs.count) return;
        var total = P.data.listNotes().length;
        if (refs.searchInput && refs.searchInput.value.trim()) {
          refs.count.textContent = F('找到 {found} / {total} 张', { found: list.length, total: total });
        } else {
          refs.count.textContent = F('{n} 张纸页', total);
        }
      }

      function renderList() {
        if (!refs.list) return;
        var query = refs.searchInput ? refs.searchInput.value : '';
        var list = P.data.searchNotes(query);
        updateCount(list);
        refs.list.innerHTML = '';
        if (!list.length) {
          var empty = document.createElement('div');
          empty.className = 'notes-list__empty';
          empty.textContent = query ? '没有找到这张纸。换一个词试试。' : '还没有纸页，点上面的「新建」写第一张。';
          refs.list.appendChild(empty);
          return;
        }
        list.forEach(function (note) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'note-item' + (note.id === currentId ? ' is-active' : '');
          button.setAttribute('data-doc-id', note.id);
          button.setAttribute('data-testid', 'note-item-' + note.id);
          button.setAttribute('aria-current', note.id === currentId ? 'true' : 'false');
          button.innerHTML = '<span class="note-item__top"><span class="note-item__name"></span><span class="note-item__sample sample-tag" hidden>示例</span></span>' +
            '<span class="note-item__excerpt"></span>' +
            '<span class="note-item__foot"><span class="note-item__date"></span><span class="note-item__dash"></span><span class="note-item__loc"></span></span>';
          button.querySelector('.note-item__name').textContent = note.name;
          button.querySelector('.note-item__excerpt').textContent = P.data.noteExcerpt(note);
          button.querySelector('.note-item__date').textContent = U.formatListDate(note.updatedAt);
          button.querySelector('.note-item__loc').textContent = '';
          if (note.sample) {
            var tag = button.querySelector('.note-item__sample');
            tag.hidden = false;
          }
          button.addEventListener('click', function () { selectDoc(note.id); });
          refs.list.appendChild(button);
        });
      }

      function updateBreadcrumb(doc) {
        if (!refs.breadcrumb) return;
        refs.breadcrumb.innerHTML = '';
        var root = document.createElement('span');
        root.textContent = '纸页';
        refs.breadcrumb.appendChild(root);
        var current = document.createElement('span');
        current.className = 'crumb-current';
        current.textContent = doc.name;
        var sep = document.createElement('span');
        sep.className = 'crumb-sep';
        sep.textContent = ' / ';
        refs.breadcrumb.appendChild(sep);
        refs.breadcrumb.appendChild(current);
      }

      function wordLabel(content) {
        var chars = String(content || '').replace(/\s/g, '').length;
        return chars ? F('{n} 个字', chars) : '空白纸页';
      }

      function updateEditorChrome(doc, options) {
        var opts = options || {};
        if (!doc) return;
        if (refs.sheet) refs.sheet.hidden = false;
        if (refs.empty) refs.empty.hidden = true;
        if (refs.missing) refs.missing.hidden = true;
        if (refs.titleInput && (!refs.titleInput.matches(':focus') || opts.force) && !composingTitle) {
          var shownTitle = isUntitled(doc.name) ? '' : doc.name;
          if (refs.titleInput.value !== shownTitle) refs.titleInput.value = shownTitle;
        }
        if (refs.body && (!refs.body.matches(':focus') || opts.force) && refs.body.value !== (doc.content || '')) {
          refs.body.value = doc.content || '';
        }
        updateBreadcrumb(doc);
        if (refs.sampleTag) refs.sampleTag.hidden = !doc.sample;
        if (refs.updated) refs.updated.textContent = '修改于 ' + U.timeAgo(doc.updatedAt);
        if (refs.wordCount) refs.wordCount.textContent = wordLabel(doc.content);
        if (refs.deleteBtn) refs.deleteBtn.disabled = false;
        if (refs.saveNow) refs.saveNow.disabled = false;
        ctx.setTitle(doc.name);
        if (!opts.silentParams) ctx.setParams({ docId: doc.id });
      }

      function selectDoc(id, options) {
        var opts = options || {};
        var doc = P.data.getNode(id);
        if (!doc || doc.type !== 'doc' || doc.kind !== 'note') {
          if (id && !opts.quiet) {
            showMissing(id);
          }
          return;
        }
        currentId = doc.id;
        missing = null;
        renderList();
        updateEditorChrome(doc, { force: true, silentParams: opts.fromRestore });
        if (opts.focusTitle && refs.titleInput) {
          refs.titleInput.focus();
          refs.titleInput.select();
        }
      }

      function showEmptyEditor(kind) {
        currentId = null;
        missing = null;
        if (refs.sheet) refs.sheet.hidden = true;
        if (refs.missing) refs.missing.hidden = true;
        if (refs.empty) {
          refs.empty.hidden = false;
          if (refs.emptyTitle) refs.emptyTitle.textContent = kind === 'search' ? '没有找到这张纸' : '还没有一张纸页';
          if (refs.emptyText) refs.emptyText.textContent = kind === 'search' ? '换一个词，或者从左侧的列表里挑一张。' : '点「新建」写下第一句话，内容会自动保存。';
        }
        if (refs.deleteBtn) refs.deleteBtn.disabled = true;
        if (refs.saveNow) refs.saveNow.disabled = true;
        renderList();
        ctx.setTitle('纸页笔记');
        ctx.setParams({});
      }

      function showMissing(id, name) {
        var doc = P.data.getNode(id);
        if (doc && doc.kind === 'note') {
          selectDoc(id);
          return;
        }
        var fallbackName = missing && missing.name ? missing.name : '这张纸页';
        missing = { id: id, name: name || fallbackName };
        currentId = null;
        if (refs.sheet) refs.sheet.hidden = true;
        if (refs.empty) refs.empty.hidden = true;
        if (refs.missing) {
          refs.missing.hidden = false;
          if (refs.missingName) refs.missingName.textContent = missing.name;
        }
        ctx.setTitle('纸页不在了');
        ctx.setParams({});
        renderList();
      }

      function createNote() {
        var active = currentDoc();
        var parentId = active ? active.parentId : undefined;
        var created;
        try {
          created = P.data.createNote({ name: UNTITLED, parentId: parentId });
        } catch (err) {
          P.ui.toast('纸页没有建成：' + (err && err.message ? err.message : '未知原因'), { kind: 'error' });
          return;
        }
        if (refs.searchInput) refs.searchInput.value = '';
        if (refs.searchClear) refs.searchClear.hidden = true;
        selectDoc(created.id, { focusTitle: true });
        P.ui.toast('新纸页铺开了。', { kind: 'info' });
      }

      function promptRename() {
        var doc = currentDoc();
        if (!doc) return;
        P.ui.prompt({
          title: '给这张纸换个名字',
          message: '改名会同步到所有打开它的窗口。',
          label: '纸页名字',
          value: doc.name,
          confirmLabel: '改好名字',
          maxLength: 96
        }).then(function (name) {
          if (!name) return;
          try {
            var updated = P.data.updateNode(doc.id, { name: name });
            if (updated) {
              ctx.setTitle(updated.name);
              if (refs.titleInput) refs.titleInput.value = updated.name;
              P.ui.toast('纸页改名为「' + updated.name + '」。', { kind: 'info' });
            }
          } catch (err) {
            P.ui.toast('名字没有改成：' + (err && err.message ? err.message : '未知原因'), { kind: 'error' });
          }
        });
      }

      function confirmDelete() {
        var doc = currentDoc();
        if (!doc) return;
        P.ui.confirm({
          title: '删除「' + doc.name + '」这张纸页？',
          message: '这张纸页和它的正文会一起消失。其它打开的窗口也会收到消息。',
          confirmLabel: '取走这张纸',
          cancelLabel: '先留着',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          var name = doc.name;
          deletingCurrent = true;
          try { P.data.deleteNode(doc.id); } catch (err) {
            deletingCurrent = false;
            P.ui.toast('没有删除成功。', { kind: 'error' });
            return;
          }
          deletingCurrent = false;
          currentId = null;
          if (refs.titleInput) refs.titleInput.value = '';
          var remaining = P.data.listNotes();
          if (remaining.length) {
            selectDoc(remaining[0].id);
          } else {
            showEmptyEditor();
          }
          P.ui.toast('「' + name + '」已经取走了。', { kind: 'info' });
        });
      }

      function commitTitle() {
        var doc = currentDoc();
        if (!doc || !refs.titleInput) return;
        var value = refs.titleInput.value;
        var target = (value || '').trim();
        if (!target) return;
        if (target === doc.name) return;
        try {
          var updated = P.data.updateNode(doc.id, { name: target });
          if (updated) {
            ctx.setTitle(updated.name);
            if (!refs.titleInput.matches(':focus')) refs.titleInput.value = updated.name;
            if (refs.updated) refs.updated.textContent = '修改于 刚刚';
          }
        } catch (err) {
          P.ui.toast('名字没有收好：' + (err && err.message ? err.message : '未知原因'), { kind: 'error' });
        }
      }

      function scheduleTitleCommit() {
        clearTimeout(titleCommitTimer);
        titleCommitTimer = setTimeout(function () {
          titleCommitTimer = null;
          commitTitle();
        }, TITLE_DELAY);
      }

      function flushTitle() {
        if (titleCommitTimer) {
          clearTimeout(titleCommitTimer);
          titleCommitTimer = null;
          commitTitle();
        }
      }

      function applyExternalDocChange(event) {
        var active = currentDoc();
        if (!active) {
          renderList();
          if (refs.count) updateCount(P.data.searchNotes(refs.searchInput ? refs.searchInput.value : ''));
          return;
        }
        if (event.type === 'nodes' && Array.isArray(event.ids) && event.ids.indexOf(active.id) !== -1 && event.action !== 'update') {
          if (deletingCurrent) {
            renderList();
            return;
          }
          if (!P.data.getNode(active.id)) {
            missing = { id: active.id, name: active.name };
            showMissing(active.id);
            return;
          }
        }
        if (!P.data.getNode(active.id)) {
          renderList();
          return;
        }
        renderList();
        updateEditorChrome(active, { silentParams: true });
      }

      function mount(container, params) {
        var root = document.createElement('div');
        refs.root = root;
        root.className = 'app notes-app';
        root.innerHTML = '<div class="notes-layout">' +
          '<aside class="notes-rail">' +
          '<div class="notes-rail__head">' +
          '<div class="notes-rail__top">' +
          '<span class="notes-rail__label">纸页</span>' +
          '<button class="notes-new" type="button" data-testid="new-note">＋ 新建</button></div>' +
          '<div class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2 20 20"/></svg>' +
          '<input class="text-input notes-search" type="search" data-testid="note-search" aria-label="搜索纸页" placeholder="找一张纸页…" autocomplete="off">' +
          '<button class="search-box__clear" type="button" aria-label="清空搜索" hidden>×</button></div>' +
          '<div class="notes-rail__status"><span class="notes-rail__count">0 张纸页</span></div>' +
          '</div>' +
          '<div class="notes-list" data-testid="note-list"></div>' +
          '</aside>' +
          '<section class="notes-editor">' +
          '<div class="notes-editor__empty" data-empty>' +
          '<div class="empty-state"><span class="empty-state__mark">纸</span>' +
          '<h3 class="empty-state__title" data-empty-title>还没有一张纸页</h3>' +
          '<p class="empty-state__text" data-empty-text>点「新建」写下第一句话，内容会自动保存。</p>' +
          '<div class="empty-state__actions"><button class="paper-btn paper-btn--ink" type="button" data-empty-new>写第一张纸</button></div></div>' +
          '</div>' +
          '<div class="editor-sheet" data-sheet hidden>' +
          '<div class="notes-editor__head"><div class="editor-breadcrumb" data-breadcrumb></div>' +
          '<div class="editor-head__actions">' +
          '<button class="paper-btn paper-btn--tiny paper-btn--ghost" type="button" data-save-now>立即保存</button>' +
          '<button class="icon-btn" type="button" data-rename aria-label="重命名纸页" title="重命名"><span aria-hidden="true"></span></button>' +
          '<button class="icon-btn icon-btn--danger" type="button" data-delete aria-label="删除纸页" title="删除纸页"><span aria-hidden="true"></span></button>' +
          '</div></div>' +
          '<input class="note-title-input" type="text" maxlength="96" data-testid="note-title" aria-label="纸页标题" placeholder="给这张纸一个名字">' +
          '<div class="editor-subrow"><span class="sample-tag" data-sample hidden>示例</span>' +
          '<span data-updated>刚刚</span><span class="editor-subrow__sep" aria-hidden="true"></span>' +
          '<span data-word-count>空白纸页</span><span class="editor-subrow__sep" aria-hidden="true"></span>' +
          '<span class="save-state" data-editor-save data-state="idle">已保存</span></div>' +
          '<div class="note-writing"><textarea class="note-body" data-testid="note-body" aria-label="纸页正文" placeholder="从这里开始写，纸会自动收好。"></textarea></div>' +
          '<div class="editor-foot"><span data-foot-save></span></div>' +
          '</div>' +
          '<div class="notes-missing" hidden><span class="notes-missing__mark" aria-hidden="true">缺</span>' +
          '<h3>这张纸页已经被删除</h3>' +
          '<p><strong data-missing-name>这张纸页</strong> 刚刚被移走或删除了。它原来的位置已经空出来，这里不会保留一份旧的副本。</p>' +
          '<div class="notes-missing__actions"><button class="paper-btn paper-btn--ink" type="button" data-missing-new>写一张新的</button>' +
          '<button class="paper-btn" type="button" data-missing-back>返回纸页列表</button></div></div>' +
          '</section></div>';
        ctx.body.appendChild(root);
        refs.searchInput = root.querySelector('.notes-search');
        refs.searchClear = root.querySelector('.search-box__clear');
        refs.list = root.querySelector('.notes-list');
        refs.count = root.querySelector('.notes-rail__count');
        refs.railSave = null;
        refs.editorSave = root.querySelector('[data-editor-save]');
        refs.empty = root.querySelector('[data-empty]');
        refs.emptyTitle = root.querySelector('[data-empty-title]');
        refs.emptyText = root.querySelector('[data-empty-text]');
        refs.sheet = root.querySelector('[data-sheet]');
        refs.breadcrumb = root.querySelector('[data-breadcrumb]');
        refs.titleInput = root.querySelector('.note-title-input');
        refs.body = root.querySelector('.note-body');
        refs.sampleTag = root.querySelector('[data-sample]');
        refs.updated = root.querySelector('[data-updated]');
        refs.wordCount = root.querySelector('[data-word-count]');
        refs.missing = root.querySelector('.notes-missing');
        refs.missingName = root.querySelector('[data-missing-name]');
        refs.deleteBtn = root.querySelector('[data-delete]');
        refs.saveNow = root.querySelector('[data-save-now]');
        refs.renameBtn = root.querySelector('[data-rename]');
        var renameIcon = refs.renameBtn.querySelector('span');
        if (renameIcon) renameIcon.innerHTML = P.icon('pencil');
        var deleteIcon = refs.deleteBtn.querySelector('span');
        if (deleteIcon) deleteIcon.innerHTML = P.icon('trash');

        root.querySelector('[data-testid="new-note"]').addEventListener('click', createNote);
        root.querySelector('[data-empty-new]').addEventListener('click', createNote);
        root.querySelector('[data-rename]').addEventListener('click', promptRename);
        refs.deleteBtn.addEventListener('click', confirmDelete);
        root.querySelector('[data-missing-new]').addEventListener('click', createNote);
        root.querySelector('[data-missing-back]').addEventListener('click', function () {
          var rest = P.data.listNotes();
          if (rest.length) selectDoc(rest[0].id);
          else showEmptyEditor();
        });
        refs.saveNow.addEventListener('click', function () {
          flushTitle();
          P.storage.flush().then(function () {
            P.ui.toast('纸页都收好了。', { kind: 'info' });
          }).catch(function (err) {
            P.ui.toast('保存没有完成：' + (err && err.message ? err.message : '未知原因'), { kind: 'error' });
          });
        });
        refs.searchInput.addEventListener('input', function () {
          if (refs.searchClear) refs.searchClear.hidden = !refs.searchInput.value;
          renderList();
        });
        refs.searchClear.addEventListener('click', function () {
          refs.searchInput.value = '';
          refs.searchClear.hidden = true;
          renderList();
          refs.searchInput.focus();
        });
        refs.searchInput.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') {
            refs.searchInput.value = '';
            refs.searchClear.hidden = true;
            renderList();
          }
        });
        refs.titleInput.addEventListener('compositionstart', function () { composingTitle = true; });
        refs.titleInput.addEventListener('compositionend', function () {
          composingTitle = false;
          scheduleTitleCommit();
        });
        refs.titleInput.addEventListener('input', function () {
          var value = refs.titleInput.value.trim();
          ctx.setTitle(value || UNTITLED);
          scheduleTitleCommit();
        });
        refs.titleInput.addEventListener('blur', function () {
          flushTitle();
          var doc = currentDoc();
          if (doc && refs.titleInput.value !== doc.name) refs.titleInput.value = doc.name;
        });
        refs.titleInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            flushTitle();
            refs.body.focus();
          }
        });
        refs.body.addEventListener('input', function () {
          var doc = currentDoc();
          if (!doc) return;
          P.data.updateNode(doc.id, { content: refs.body.value });
          if (refs.wordCount) refs.wordCount.textContent = wordLabel(refs.body.value);
          if (refs.updated) refs.updated.textContent = '修改于 刚刚';
        });

        ctx.subscribe(function (event) {
          if (event.type !== 'nodes') return;
          if (deletingCurrent) {
            renderList();
            var deletingDoc = currentDoc();
            if (deletingDoc) updateEditorChrome(deletingDoc, { silentParams: true });
            else if (refs.sheet) refs.sheet.hidden = true;
            return;
          }
          if (currentId && Array.isArray(event.ids) && event.ids.indexOf(currentId) !== -1 && event.action !== 'update') {
            var gone = P.data.getNode(currentId);
            if (!gone) {
              var goneName = refs.titleInput && refs.titleInput.value ? refs.titleInput.value : '这张纸页';
              showMissing(currentId, goneName);
              return;
            }
          }
          var active = currentDoc();
          if (!active) {
            renderList();
            return;
          }
          renderList();
          updateEditorChrome(active, { silentParams: true });
        });
        ctx.subscribeSave(saveStatusText);
        ctx.on(window, 'pagehide', function () { flushTitle(); }, true);
        ctx.on(document, 'visibilitychange', function () {
          if (document.visibilityState === 'hidden') flushTitle();
        }, true);
        ctx.cleanup(function () {
          clearTimeout(titleCommitTimer);
          clearTimeout(searchTimer);
        });

        if (params && params.docId) {
          var target = P.data.getNode(params.docId);
          if (target && target.kind === 'note') {
            selectDoc(params.docId, { fromRestore: true });
            return;
          }
          showMissing(params.docId);
          return;
        }
        var meta = P.data.getMeta();
        var welcome = meta.welcomeDocId ? P.data.getNode(meta.welcomeDocId) : null;
        var docs = P.data.listNotes();
        if (welcome && !P.data.getPrefs().welcomeDismissed) selectDoc(welcome.id);
        else if (docs.length) selectDoc(docs[0].id);
        else showEmptyEditor();
        renderList();
        saveStatusText(P.storage.getStatus());
      }

      return {
        mount: mount,
        updateParams: function (params) {
          if (!params || !params.docId) return;
          if (params.docId === currentId) return;
          var doc = P.data.getNode(params.docId);
          if (doc && doc.kind === 'note') selectDoc(params.docId);
          else showMissing(params.docId);
        },
        destroy: function () {
          if (titleCommitTimer) {
            clearTimeout(titleCommitTimer);
            titleCommitTimer = null;
            commitTitle();
          }
        }
      };
    }
  });
})();

/* ===== src/js/apps/calendar.js ===== */
/* ============================================================
   PAPER OS — Calendar & Tasks app
   ============================================================ */
(function () {
  'use strict';

  var P = window.PaperOS;
  var U = P.util;

  P.registerApp({
    id: 'calendar',
    name: '日历与待办',
    english: 'CALENDAR & TASKS',
    description: '按日期添加待办，完成后勾选',
    defaultSize: { w: 1010, h: 650 },
    minSize: { w: 430, h: 390 },
    create: function (ctx) {
      var refs = {};
      var now = new Date();
      var viewYear = now.getFullYear();
      var viewMonth = now.getMonth();
      var selectedKey = U.todayKey();
      var monthCount = 0;

      function selectedDate() {
        var d = U.parseDateKey(selectedKey);
        if (!d) {
          d = new Date();
          selectedKey = U.dateKey(d);
        }
        return d;
      }

      function isSameMonth(date) {
        return date.getFullYear() === viewYear && date.getMonth() === viewMonth;
      }

      function updateSelectedLabel() {
        var d = selectedDate();
        if (refs.selectedDate) {
          refs.selectedDate.textContent = U.formatMonthDay(d) + ' · ' + U.weekdayName(d);
        }
        var tasks = P.data.projectTasks(selectedKey);
        if (refs.taskCount) refs.taskCount.textContent = String(tasks.length);
        if (refs.taskInput) {
          refs.taskInput.placeholder = F('在 {date} 留一件事…', { date: U.formatMonthDay(d) });
        }
        if (refs.taskFoot) {
          var done = tasks.filter(function (t) { return t.done; }).length;
          refs.taskFoot.textContent = tasks.length ? F('共 {n} 件 · 完成 {m} 件', { n: tasks.length, m: done }) : '空白的一天也值得被记下';
        }
        if (refs.monthCount) {
          var monthly = P.data.monthTaskCount(viewYear + '-' + U.pad2(viewMonth + 1));
          monthCount = monthly.total;
          refs.monthCount.textContent = F('{n} 件本月', monthCount);
          refs.monthCount.setAttribute('title', monthly.recurring
            ? F('其中 {n} 件是每天出现的持久待办，只算 1 件', monthly.recurring)
            : '本月的待办条目');
        }
      }

      /* 待办行：勾选 + 标题 + 右侧两枚控件（色点 / 仅今日·每天）。
         色点点开是四色小浮层，胶囊点一下直接切换，都不进详情。 */
      function buildTaskList() {
        if (!refs.taskList) return;
        var tasks = P.data.projectTasks(selectedKey);
        refs.taskList.innerHTML = '';
        if (!tasks.length) {
          var empty = document.createElement('div');
          empty.className = 'tasks-empty';
          empty.textContent = '这一天还是空白的。写下第一件想做的事，它就会落在这里。';
          refs.taskList.appendChild(empty);
          return;
        }
        tasks.forEach(function (task) {
          var row = document.createElement('div');
          row.className = 'task-item' + (task.done ? ' is-done' : '') + (task.resolved ? ' is-resolved' : '');
          row.setAttribute('data-task-id', task.id);
          row.setAttribute('data-testid', 'task-' + task.id);
          var check = document.createElement('button');
          check.type = 'button';
          check.className = 'task-check';
          check.setAttribute('role', 'checkbox');
          check.setAttribute('aria-checked', task.done ? 'true' : 'false');
          check.setAttribute('aria-label', task.done ? '标记为未完成：' + task.title : '标记为已完成：' + task.title);
          check.innerHTML = P.icon('check');
          check.addEventListener('click', function () {
            P.data.setTaskDone(task.id, selectedKey, !task.done);
          });
          var body = document.createElement('div');
          body.className = 'task-body';
          var title = document.createElement('div');
          title.className = 'task-title';
          title.textContent = task.title;
          body.appendChild(title);
          var meta = document.createElement('div');
          meta.className = 'task-item__meta';
          if (task.sample) {
            var sample = document.createElement('span');
            sample.className = 'sample-tag';
            sample.textContent = '示例';
            meta.appendChild(sample);
          }
          /* 没有信息就不占位：未完成且非持久待办不再显示任何状态文字。 */
          var statusText = '';
          if (task.resolved) {
            statusText = F('已解决 · {date} · 打卡 {n} 天', { date: U.dateKey(new Date(task.resolvedAt)), n: task.checkins });
          } else if (task.repeat === 'daily') {
            statusText = task.done
              ? F('今天做完了 · 打卡 {n} 天', task.checkins)
              : F('打卡 {n} 天', task.checkins);
          } else if (task.done) {
            statusText = '已完成 · ' + U.formatTime(task.updatedAt);
          }
          if (statusText) {
            var status = document.createElement('span');
            status.textContent = statusText;
            meta.appendChild(status);
          }
          if (task.repeat === 'daily' && !task.resolved && task.done) {
            var resolve = document.createElement('button');
            resolve.type = 'button';
            resolve.className = 'task-item__resolve';
            resolve.textContent = '这件事算结束了';
            resolve.addEventListener('click', function () { resolveTaskItem(task); });
            meta.appendChild(resolve);
          }
          if (task.resolved) {
            var reopen = document.createElement('button');
            reopen.type = 'button';
            reopen.className = 'task-item__resolve';
            reopen.textContent = '恢复';
            reopen.addEventListener('click', function () {
              P.data.unresolveTask(task.id);
              P.ui.toast('这件事又回到每天出现了。', { kind: 'info' });
            });
            meta.appendChild(reopen);
          }
          body.appendChild(meta);

          /* 右侧：色点 + 状态胶囊，然后才是编辑/删除。 */
          var controls = document.createElement('div');
          controls.className = 'task-controls';
          var pip = document.createElement('button');
          pip.type = 'button';
          pip.className = 'task-pip-btn';
          pip.setAttribute('data-priority', task.priority);
          pip.setAttribute('aria-label', '紧急程度：' + task.priorityLabel + '，点击更换');
          pip.setAttribute('title', task.priorityLabel);
          pip.addEventListener('click', function (event) {
            event.stopPropagation();
            openPriorityPopover(pip, task);
          });
          controls.appendChild(pip);
          var repeatChip = document.createElement('button');
          repeatChip.type = 'button';
          repeatChip.className = 'task-repeat' + (task.repeat === 'daily' ? ' is-daily' : '');
          repeatChip.textContent = task.repeat === 'daily' ? '每天' : '仅今日';
          repeatChip.setAttribute('aria-label', '状态：' + (task.repeat === 'daily' ? '每天出现，直到解决' : '仅限今日') + '，点击切换');
          repeatChip.setAttribute('title', task.repeat === 'daily' ? '每天出现，直到解决（点一下改成仅限今日）' : '只在这一天（点一下改成每天出现）');
          repeatChip.addEventListener('click', function (event) {
            event.stopPropagation();
            var next = task.repeat === 'daily' ? 'once' : 'daily';
            P.data.updateTask(task.id, { repeat: next });
            P.ui.toast(next === 'daily' ? '改成每天出现，直到解决。' : '只在这一天出现。', { kind: 'info' });
          });
          controls.appendChild(repeatChip);

          var actions = document.createElement('div');
          actions.className = 'task-actions';
          var edit = document.createElement('button');
          edit.type = 'button';
          edit.className = 'icon-btn';
          edit.setAttribute('aria-label', '编辑待办：' + task.title);
          edit.setAttribute('title', '改标题与更多');
          edit.innerHTML = P.icon('pencil');
          edit.addEventListener('click', function () { editTask(task); });
          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'icon-btn icon-btn--danger';
          del.setAttribute('aria-label', '删除待办：' + task.title);
          del.setAttribute('title', '删除');
          del.innerHTML = P.icon('trash');
          del.addEventListener('click', function () { deleteTask(task); });
          actions.appendChild(edit);
          actions.appendChild(del);
          controls.appendChild(actions);

          row.appendChild(check);
          row.appendChild(body);
          row.appendChild(controls);
          refs.taskList.appendChild(row);
        });
      }

      /* 四色小浮层：点色点就地换档，不弹大对话框。 */
      var priorityPopover = null;

      function closePriorityPopover() {
        if (!priorityPopover) return;
        priorityPopover.remove();
        priorityPopover = null;
        document.removeEventListener('pointerdown', onPriorityOutside, true);
        document.removeEventListener('keydown', onPriorityKey, true);
      }

      function onPriorityOutside(event) {
        if (priorityPopover && !priorityPopover.contains(event.target)) closePriorityPopover();
      }

      function onPriorityKey(event) {
        if (event.key === 'Escape') closePriorityPopover();
      }

      function openPriorityPopover(anchor, task) {
        var alreadyOpen = priorityPopover && priorityPopover.getAttribute('data-for') === task.id;
        closePriorityPopover();
        if (alreadyOpen) return;
        var pop = document.createElement('div');
        pop.className = 'priority-popover';
        pop.setAttribute('data-for', task.id);
        pop.setAttribute('role', 'menu');
        pop.setAttribute('aria-label', '紧急程度');
        P.TASK_PRIORITIES.forEach(function (item) {
          var option = document.createElement('button');
          option.type = 'button';
          option.className = 'priority-popover__item' + (item.id === task.priority ? ' is-active' : '');
          option.setAttribute('role', 'menuitemradio');
          option.setAttribute('aria-checked', item.id === task.priority ? 'true' : 'false');
          var dot = document.createElement('span');
          dot.className = 'task-pip';
          dot.setAttribute('data-priority', item.id);
          dot.setAttribute('aria-hidden', 'true');
          option.appendChild(dot);
          var label = document.createElement('span');
          label.className = 'priority-popover__label';
          label.textContent = item.label;
          option.appendChild(label);

          option.addEventListener('click', function () {
            P.data.updateTask(task.id, { priority: item.id });
            closePriorityPopover();
            P.ui.toast('已标为「' + item.label + '」。', { kind: 'info' });
          });
          pop.appendChild(option);
        });
        document.body.appendChild(pop);
        var box = anchor.getBoundingClientRect();
        var popBox = pop.getBoundingClientRect();
        var left = Math.min(window.innerWidth - popBox.width - 12, Math.max(12, box.left - popBox.width + box.width));
        var top = box.bottom + 6;
        if (top + popBox.height > window.innerHeight - 12) top = Math.max(12, box.top - popBox.height - 6);
        pop.style.left = Math.round(left) + 'px';
        pop.style.top = Math.round(top) + 'px';
        priorityPopover = pop;
        document.addEventListener('pointerdown', onPriorityOutside, true);
        document.addEventListener('keydown', onPriorityKey, true);
        var first = pop.querySelector('.priority-popover__item');
        if (first) first.focus();
      }

      function resolveTaskItem(task) {
        P.ui.confirm({
          kicker: 'PAPER OS · 收起来',
          title: '把这件事收起来？',
          message: '「' + task.title + '」从明天起不再出现。今天做的这一天会留在日历上，随时可以恢复。',
          confirmLabel: '收起来',
          cancelLabel: '再想想'
        }).then(function (ok) {
          if (!ok) return;
          P.data.resolveTask(task.id);
          P.ui.toast(F('这件事收起来了，打卡 {n} 天。', task.checkins), { kind: 'info' });
        });
      }

      function dayCellLabel(date, tasks) {
        var label = U.formatDateCN(date) + ' ' + U.weekdayName(date);
        if (tasks.length) {
          var urgent = tasks.filter(function (t) { return t.priority === 'urgent-important' && !t.done; }).length;
          label += '，' + tasks.length + ' 件待办';
          if (urgent) label += F('，其中 {n} 件重要且紧急', urgent);
        }
        return label;
      }

      function renderMonth() {
        if (!refs.grid) return;
        var first = new Date(viewYear, viewMonth, 1);
        var offset = (first.getDay() + 6) % 7;
        var gridStart = new Date(viewYear, viewMonth, 1 - offset);
        /* 42 格一次投影算完，不要每格再扫一遍全部待办。 */
        var todayKey = U.todayKey();
        var keys = [];
        for (var k = 0; k < 42; k += 1) {
          var probe = new Date(gridStart);
          probe.setDate(gridStart.getDate() + k);
          keys.push(U.dateKey(probe));
        }
        var byDate = {};
        keys.forEach(function (key) { byDate[key] = P.data.projectTasks(key, todayKey); });
        var monthly = P.data.monthTaskCount(viewYear + '-' + U.pad2(viewMonth + 1));
        monthCount = monthly.total;
        refs.monthTitle.textContent = U.monthNamesCN()[viewMonth];
        refs.monthYear.textContent = String(viewYear);
        refs.grid.innerHTML = '';
        for (var i = 0; i < 42; i += 1) {
          var dayDate = new Date(gridStart);
          dayDate.setDate(gridStart.getDate() + i);
          var key = U.dateKey(dayDate);
          var dayTasks = byDate[key] || [];
          var cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'cal-day';
          if (!isSameMonth(dayDate)) cell.classList.add('is-outside');
          if (key === U.todayKey()) cell.classList.add('is-today');
          if (key === selectedKey) cell.classList.add('is-selected');
          cell.setAttribute('data-date', key);
          cell.setAttribute('role', 'gridcell');
          cell.setAttribute('aria-label', dayCellLabel(dayDate, dayTasks));
          cell.setAttribute('aria-selected', key === selectedKey ? 'true' : 'false');
          cell.setAttribute('tabindex', key === selectedKey ? '0' : '-1');
          var num = document.createElement('span');
          num.className = 'cal-day__num';
          num.textContent = String(dayDate.getDate());
          cell.appendChild(num);
          var dots = document.createElement('span');
          dots.className = 'cal-day__dots';
          var openRow = document.createElement('span');
          openRow.className = 'cal-day__dot-row';
          var doneRow = document.createElement('span');
          doneRow.className = 'cal-day__dot-row cal-day__dot-row--done';
          var openList = dayTasks.filter(function (task) { return !task.done; });
          var doneList = dayTasks.filter(function (task) { return task.done; });
          openList.slice(0, 3).forEach(function (task) {
            var dot = document.createElement('span');
            dot.className = 'cal-day__dot';
            dot.setAttribute('data-priority', task.priority);
            openRow.appendChild(dot);
          });
          var openMore = openList.length - Math.min(openList.length, 3);
          doneList.slice(0, 3).forEach(function (task) {
            var dot = document.createElement('span');
            dot.className = 'cal-day__dot cal-day__dot--done';
            dot.setAttribute('data-priority', task.priority);
            doneRow.appendChild(dot);
          });
          var hidden = openMore + (doneList.length - Math.min(doneList.length, 3));
          if (hidden > 0) {
            var more = document.createElement('span');
            more.className = 'cal-day__more';
            more.textContent = '+' + hidden;
            openRow.appendChild(more);
          }
          dots.appendChild(openRow);
          dots.appendChild(doneRow);
          cell.appendChild(dots);
          cell.addEventListener('click', function () {
            var d = U.parseDateKey(this.getAttribute('data-date'));
            if (!d) return;
            selectedKey = U.dateKey(d);
            viewYear = d.getFullYear();
            viewMonth = d.getMonth();
            rememberView();
            renderAll();
            var target = refs.grid.querySelector('[data-date="' + selectedKey + '"]');
            if (target) target.focus({ preventScroll: true });
          });
          cell.addEventListener('keydown', function (event) {
            var d = U.parseDateKey(this.getAttribute('data-date'));
            if (!d) return;
            var delta = 0;
            if (event.key === 'ArrowLeft') delta = -1;
            else if (event.key === 'ArrowRight') delta = 1;
            else if (event.key === 'ArrowUp') delta = -7;
            else if (event.key === 'ArrowDown') delta = 7;
            else if (event.key === 'Home') {
              event.preventDefault();
              var monday = new Date(d);
              monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
              moveSelection(monday);
              return;
            } else if (event.key === 'End') {
              event.preventDefault();
              var sunday = new Date(d);
              sunday.setDate(d.getDate() + (6 - ((d.getDay() + 6) % 7)));
              moveSelection(sunday);
              return;
            }
            if (!delta) return;
            event.preventDefault();
            var next = new Date(d);
            next.setDate(d.getDate() + delta);
            moveSelection(next);
          });
          refs.grid.appendChild(cell);
        }
        updateSelectedLabel();
      }

      function moveSelection(date) {
        selectedKey = U.dateKey(date);
        viewYear = date.getFullYear();
        viewMonth = date.getMonth();
        rememberView();
        renderAll();
        var target = refs.grid.querySelector('[data-date="' + selectedKey + '"]');
        if (target) target.focus({ preventScroll: true });
      }

      function renderTasks() {
        buildTaskList();
        updateSelectedLabel();
      }

      function renderAll() {
        renderMonth();
        renderTasks();
      }

      function changeMonth(delta) {
        var next = new Date(viewYear, viewMonth + delta, 1);
        viewYear = next.getFullYear();
        viewMonth = next.getMonth();
        var today = new Date();
        if (viewYear === today.getFullYear() && viewMonth === today.getMonth()) {
          selectedKey = U.todayKey();
        } else {
          selectedKey = U.dateKey(new Date(viewYear, viewMonth, 1));
        }
        rememberView();
        renderAll();
      }

      function goToday() {
        var d = new Date();
        viewYear = d.getFullYear();
        viewMonth = d.getMonth();
        selectedKey = U.dateKey(d);
        rememberView();
        renderAll();
        var target = refs.grid.querySelector('[data-date="' + selectedKey + '"]');
        if (target) target.focus({ preventScroll: true });
      }

      /* 本模块自己建节点：core.js 的 el() 不在这个作用域里，用它就会 ReferenceError。 */
      function mk(tag, cls, text) {
        var made = document.createElement(tag);
        if (cls) made.className = cls;
        if (text !== undefined && text !== null) made.textContent = text;
        return made;
      }

      /* 待办详情：标题 + 紧急程度栏 + 状态（仅限今日 / 每天）+ 那一天。 */
      function editTask(task) {
        var draft = {
          title: task.title,
          priority: task.priority,
          repeat: task.repeat
        };
        var titleInput = null;
        P.ui.dialog({
          kicker: 'PAPER OS · 待办',
          title: '这件事',
          wide: true,
          width: 520,
          actions: [
            { label: '取消', value: null, kind: 'ghost' },
            { label: '改好', value: 'ok', kind: 'primary' }
          ],
          getValue: function (value) {
            if (value !== 'ok') return null;
            var clean = titleInput ? titleInput.value.replace(/\s+/g, ' ').trim().slice(0, 300) : '';
            if (!clean) return null;
            draft.title = clean;
            return draft;
          },
          initialFocus: function () { return titleInput; },
          render: function (body) {
            titleInput = mk('input', 'text-input dialog-input');
            titleInput.type = 'text';
            titleInput.value = task.title;
            titleInput.maxLength = 300;
            titleInput.setAttribute('aria-label', '待办内容');
            body.appendChild(titleInput);

            body.appendChild(mk('p', 'field-label', '紧急程度'));
            var priorityRow = mk('div', 'priority-list');
            priorityRow.setAttribute('role', 'radiogroup');
            priorityRow.setAttribute('aria-label', '紧急程度');
            P.TASK_PRIORITIES.forEach(function (item) {
              var option = mk('button', 'priority-option');
              option.type = 'button';
              option.setAttribute('role', 'radio');
              option.setAttribute('data-priority', item.id);
              option.setAttribute('aria-checked', item.id === draft.priority ? 'true' : 'false');
              if (item.id === draft.priority) option.classList.add('is-active');
              var pip = mk('span', 'task-pip');
              pip.setAttribute('data-priority', item.id);
              pip.setAttribute('aria-hidden', 'true');
              option.appendChild(pip);
              option.appendChild(mk('span', 'priority-option__label', item.label));
              option.appendChild(mk('span', 'priority-option__hint', item.hint));
              option.addEventListener('click', function () {
                draft.priority = item.id;
                priorityRow.querySelectorAll('.priority-option').forEach(function (node) {
                  var active = node.getAttribute('data-priority') === item.id;
                  node.classList.toggle('is-active', active);
                  node.setAttribute('aria-checked', active ? 'true' : 'false');
                });
              });
              priorityRow.appendChild(option);
            });
            body.appendChild(priorityRow);

            body.appendChild(mk('p', 'field-label', '状态'));
            var repeatRow = mk('div', 'priority-list priority-list--repeat');
            repeatRow.setAttribute('role', 'radiogroup');
            repeatRow.setAttribute('aria-label', '状态');
            P.TASK_REPEATS.forEach(function (item) {
              var option = mk('button', 'priority-option');
              option.type = 'button';
              option.setAttribute('role', 'radio');
              option.setAttribute('data-repeat', item.id);
              option.setAttribute('aria-checked', item.id === draft.repeat ? 'true' : 'false');
              if (item.id === draft.repeat) option.classList.add('is-active');
              option.appendChild(mk('span', 'priority-option__label', item.label));
              option.appendChild(mk('span', 'priority-option__hint', item.hint));
              option.addEventListener('click', function () {
                draft.repeat = item.id;
                repeatRow.querySelectorAll('.priority-option').forEach(function (node) {
                  var active = node.getAttribute('data-repeat') === item.id;
                  node.classList.toggle('is-active', active);
                  node.setAttribute('aria-checked', active ? 'true' : 'false');
                });
              });
              repeatRow.appendChild(option);
            });
            body.appendChild(repeatRow);

            var info = mk('p', 'dialog-note', '');
            if (task.repeat === 'daily' || task.repeat === 'once') {
              info.textContent = F('首次出现在 {date} · 已打卡 {n} 天', { date: task.date, n: task.checkins });
            }
            body.appendChild(info);
          }
        }).then(function (result) {
          if (!result) return;
          P.data.updateTask(task.id, {
            title: result.title,
            priority: result.priority,
            repeat: result.repeat
          });
        });
      }

      function deleteTask(task) {
        var removed = P.data.deleteTask(task.id);
        if (!removed) return;
        P.ui.toast('待办已经取走。', {
          kind: 'info',
          actionLabel: '撤销',
          onAction: function () { P.data.restoreTask(removed); }
        });
      }

      function addFromInput() {
        if (!refs.taskInput) return;
        var value = refs.taskInput.value.trim();
        if (!value) {
          refs.taskInput.focus();
          return;
        }
        refs.taskInput.value = '';
        P.data.addTask(selectedKey, value);
        refs.taskInput.focus();
      }

      function rememberView() {
        /* 只记"哪一天"，月份由这一天决定，不需要第二个真相源。 */
        ctx.setParams({ view: selectedKey });
      }

      function restoreView(view) {
        if (!view) return false;
        var parsed = U.parseDateKey(view);
        if (!parsed) return false;
        selectedKey = U.dateKey(parsed);
        viewYear = parsed.getFullYear();
        viewMonth = parsed.getMonth();
        return true;
      }

      /* 星期表头：中文取「星期一…星期日」的第二个字，英文用 M/T/W/T/F/S/S。
         单字「日」与日期后缀撞键（英文里是零宽），所以表头不写死在 HTML 里。 */
      function weekdayInitials() {
        if (P.lang === 'en') return ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
        var out = [];
        /* 2024-01-01 是星期一，按它取一周，避免再写一份单字表。 */
        for (var i = 0; i < 7; i += 1) out.push(U.weekdayName(new Date(2024, 0, 1 + i)).slice(1));
        return out;
      }

      function mount(container, params) {
        var root = document.createElement('div');
        root.className = 'app calendar-app';
        root.innerHTML = '<div class="calendar-layout">' +
          '<section class="calendar-month" aria-label="月历">' +
          '<div class="calendar-month__head">' +
          '<button class="calendar-month__nav" type="button" data-prev aria-label="上一个月"></button>' +
          '<div class="calendar-month__title-wrap"><h3 class="calendar-month__title" data-month-title></h3><span class="calendar-month__year" data-month-year></span><span class="count-chip count-chip--month" data-month-count></span></div>' +
          '<button class="calendar-month__today" type="button" data-today>今天</button>' +
          '<button class="calendar-month__nav" type="button" data-next aria-label="下一个月"></button>' +
          '</div>' +
          '<div class="calendar-weekdays" aria-hidden="true" data-weekdays></div>' +
          '<div class="calendar-grid" role="grid" aria-label="日期" data-grid></div>' +
          '</section>' +
          '<aside class="calendar-tasks" aria-label="这一天的待办">' +
          '<div class="calendar-tasks__head"><div class="calendar-tasks__date">' +
          '<div><p>SELECTED DAY · 这一天</p><h3 data-selected-date aria-live="polite"></h3></div>' +
          '<span class="count-chip" data-task-count>0</span></div></div>' +
          '<div class="task-list" data-task-list></div>' +
          '<form class="task-add" data-task-form><input type="text" maxlength="300" data-task-input aria-label="新增待办" placeholder="在这一天留一件事…" autocomplete="off">' +
          '<button type="submit" aria-label="添加待办" title="添加待办"></button></form>' +
          '<div class="calendar-tasks__foot" data-task-foot></div>' +
          '</aside></div>';
        ctx.body.appendChild(root);
        refs.weekdays = root.querySelector('[data-weekdays]');
        if (refs.weekdays) {
          refs.weekdays.innerHTML = weekdayInitials().map(function (one) {
            return '<span>' + U.escapeHTML(one) + '</span>';
          }).join('');
        }
        refs.grid = root.querySelector('[data-grid]');
        refs.monthTitle = root.querySelector('[data-month-title]');
        refs.monthYear = root.querySelector('[data-month-year]');
        refs.monthCount = root.querySelector('[data-month-count]');
        refs.selectedDate = root.querySelector('[data-selected-date]');
        refs.taskCount = root.querySelector('[data-task-count]');
        refs.taskList = root.querySelector('[data-task-list]');
        refs.taskInput = root.querySelector('[data-task-input]');
        refs.taskFoot = root.querySelector('[data-task-foot]');
        refs.prev = root.querySelector('[data-prev]');
        refs.next = root.querySelector('[data-next]');
        refs.prev.innerHTML = P.icon('chevronLeft');
        refs.next.innerHTML = P.icon('chevronRight');
        var addButton = root.querySelector('[data-task-form] button');
        addButton.innerHTML = P.icon('plus');
        refs.taskForm = root.querySelector('[data-task-form]');
        refs.taskForm.addEventListener('submit', function (event) {
          event.preventDefault();
          addFromInput();
        });
        root.querySelector('[data-prev]').addEventListener('click', function () { changeMonth(-1); });
        root.querySelector('[data-next]').addEventListener('click', function () { changeMonth(1); });
        root.querySelector('[data-today]').addEventListener('click', goToday);
        ctx.setTitle('日历与待办');
        /* 回到上次看的那一天（切换 DSH 面板再回来不会跳回今天）。 */
        if (params && params.view) restoreView(params.view);
        ctx.subscribe(function (event) {
          if (event.type === 'tasks') renderAll();
        });
        renderAll();
      }

      return {
        mount: mount,
        updateParams: function () {},
        destroy: function () {}
      };
    }
  });
})();

/* ===== src/js/apps/draw.js ===== */
/* ============================================================
   PAPER OS — Drawing Paper app
   ============================================================ */
(function () {
  'use strict';

  var P = window.PaperOS;
  var U = P.util;
  var BG = P.DRAW_PAPER;
  var DEFAULT_W = 1200;
  var DEFAULT_H = 800;
  var COLORS = [
    { hex: '#456275', label: '墨水蓝' },
    { hex: '#34362f', label: '炭黑' },
    { hex: '#b96f50', label: '陶土' },
    { hex: '#7b8f72', label: '鼠尾草' },
    { hex: '#b3924e', label: '赭石' },
    { hex: '#9b5b62', label: '旧玫' }
  ];
  var SIZES = [
    { value: 2, dot: 3, label: '细' },
    { value: 4, dot: 5, label: '中细' },
    { value: 8, dot: 9, label: '中' },
    { value: 14, dot: 13, label: '粗' }
  ];

  P.registerApp({
    id: 'draw',
    name: '画纸',
    english: 'DRAWING PAPER',
    description: '手写绘画，可导出 PNG',
    defaultSize: { w: 1030, h: 720 },
    minSize: { w: 450, h: 390 },
    create: function (ctx) {
      var refs = {};
      var currentId = null;
      var strokes = [];
      var width = DEFAULT_W;
      var height = DEFAULT_H;
      var color = COLORS[0].hex;
      var brushSize = 4;
      var eraser = false;
      var drawing = false;
      var activePointer = null;
      var undoStack = [];
      var redoStack = [];
      var lastPoint = null;
      var dpr = 1;
      var missingName = '';
      var saveEl = null;
      var hasUnsaved = false;

      function saveLabel(status) {
        if (!saveEl) return;
        var label = '已保存';
        if (status.phase === 'pending') label = '墨迹待保存';
        else if (status.phase === 'saving') label = '正在收画纸';
        else if (status.phase === 'error') label = '保存遇到问题';
        else if (status.phase === 'idle') label = '还没有落笔';
        else if (status.phase === 'booting') label = '正在铺纸';
        saveEl.textContent = label;
        saveEl.setAttribute('data-state', status.phase || 'idle');
      }

      function currentDoc() {
        return currentId ? P.data.getNode(currentId) : null;
      }

      function setSaveControls() {
        var docExists = !!currentDoc();
        if (refs.undo) refs.undo.disabled = !docExists || undoStack.length === 0;
        if (refs.redo) refs.redo.disabled = !docExists || redoStack.length === 0;
        if (refs.clear) refs.clear.disabled = !docExists || strokes.length === 0;
        if (refs.exportBtn) refs.exportBtn.disabled = !docExists;
        if (refs.deleteBtn) refs.deleteBtn.disabled = !docExists;
        if (refs.eraserBtn) refs.eraserBtn.disabled = !docExists;
      }

      /* 画纸簿：左右翻一张，按当前卡片宽度滚动，翻到头就禁用。 */
      function stepGallery(direction) {
        if (!refs.gallery) return;
        var card = refs.gallery.querySelector('.draw-card');
        var stride = card ? card.offsetWidth + 10 : Math.round(refs.gallery.clientWidth * 0.8);
        var max = refs.gallery.scrollWidth - refs.gallery.clientWidth;
        var next = Math.max(0, Math.min(max, refs.gallery.scrollLeft + direction * stride));
        refs.gallery.scrollTo({ left: next, behavior: U.prefersReducedMotion() ? 'auto' : 'smooth' });
        syncGalleryNav();
      }

      function syncGalleryNav() {
        if (!refs.gallery || !refs.galleryPrev || !refs.galleryNext) return;
        var max = refs.gallery.scrollWidth - refs.gallery.clientWidth;
        refs.galleryPrev.disabled = refs.gallery.scrollLeft <= 1;
        refs.galleryNext.disabled = max <= 1 || refs.gallery.scrollLeft >= max - 1;
      }

      function confirmDeleteDrawing() {
        var doc = currentDoc();
        if (!doc) return;
        P.ui.confirm({
          kicker: 'PAPER OS · 画纸',
          title: '删掉这张画纸？',
          message: '「' + doc.name + '」和上面的笔迹都会被移走，撤销还能找回来。',
          confirmLabel: '删掉',
          cancelLabel: '留着',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          try {
            P.data.deleteNode(doc.id);
          } catch (err) {
            P.ui.toast('画纸没有删掉：' + (err && err.message ? err.message : '未知原因'), { kind: 'error' });
            return;
          }
          var rest = P.data.listDrawings();
          if (rest.length) selectDrawing(rest[0].id);
          else showEmpty();
          P.ui.toast('画纸已经删掉，撤销还能找回。', {
            kind: 'info',
            actionLabel: '撤销',
            onAction: function () { restoreDrawing(doc); }
          });
        });
      }

      /* 撤销删除：按原样把节点放回原来的文件夹。 */
      function restoreDrawing(snapshot) {
        try {
          var recreated = P.data.createDrawing({
            name: snapshot.name,
            parentId: snapshot.parentId,
            strokes: snapshot.strokes || [],
            width: snapshot.width,
            height: snapshot.height,
            thumb: snapshot.thumb || '',
            sample: snapshot.sample
          });
          if (recreated) selectDrawing(recreated.id);
        } catch (err) {
          P.ui.toast('画纸没有找回来：' + (err && err.message ? err.message : '未知原因'), { kind: 'error' });
        }
      }

      function renderGallery() {
        if (!refs.gallery) return;
        refs.gallery.innerHTML = '';
        var list = P.data.listDrawings();
        refs.gallery.hidden = false;
        list.forEach(function (doc) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'draw-card' + (doc.id === currentId ? ' is-active' : '');
          button.setAttribute('data-doc-id', doc.id);
          button.setAttribute('aria-label', '打开画纸「' + doc.name + '」');
          button.setAttribute('aria-pressed', doc.id === currentId ? 'true' : 'false');
          if (doc.thumb && /^data:image\/(png|jpeg|webp);base64,/.test(doc.thumb)) {
            var img = document.createElement('img');
            img.className = 'draw-card__thumb';
            img.src = doc.thumb;
            img.alt = '';
            button.appendChild(img);
          } else {
            var blank = document.createElement('span');
            blank.className = 'draw-card__thumb draw-card__thumb--empty';
            blank.textContent = '空白';
            button.appendChild(blank);
          }
          var text = document.createElement('span');
          text.className = 'draw-card__text';
          var name = document.createElement('span');
          name.className = 'draw-card__name';
          name.textContent = doc.name;
          var date = document.createElement('span');
          date.className = 'draw-card__date';
          date.textContent = (doc.sample ? '示例 · ' : '') + U.formatListDate(doc.updatedAt);
          text.appendChild(name);
          text.appendChild(date);
          button.appendChild(text);
          button.addEventListener('click', function () { selectDrawing(doc.id); });
          refs.gallery.appendChild(button);
        });
        syncGalleryNav();
      }

      function updateToolbar() {
        var doc = currentDoc();
        if (refs.docTitle) refs.docTitle.textContent = doc ? doc.name : '画纸';
        if (refs.historyHint) {
          refs.historyHint.textContent = doc ? F('{n} 笔', strokes.length) : '还没有一张画纸';
        }
        if (refs.location) {
          if (doc) {
            var chain = P.data.getAncestors(doc.parentId);
            var names = chain.map(function (node) { return node.name; });
            refs.location.textContent = '画纸簿';
          } else {
            refs.location.textContent = '画纸簿';
          }
        }
        setSaveControls();
      }

      function fitCanvas() {
        if (!refs.stage || !refs.board) return;
        var style = window.getComputedStyle(refs.stage);
        var pl = parseFloat(style.paddingLeft) || 0;
        var pr = parseFloat(style.paddingRight) || 0;
        var pt = parseFloat(style.paddingTop) || 0;
        var pb = parseFloat(style.paddingBottom) || 0;
        var availW = Math.max(100, refs.stage.clientWidth - pl - pr);
        var availH = Math.max(80, refs.stage.clientHeight - pt - pb);
        var ratio = Math.min(availW / width, availH / height);
        refs.board.style.width = Math.max(80, Math.floor(width * ratio)) + 'px';
        refs.board.style.height = Math.max(60, Math.floor(height * ratio)) + 'px';
        updateBrushCursorSize();
      }

      function setupCanvas() {
        if (!refs.canvas) return;
        dpr = Math.min(2.5, Math.max(1, window.devicePixelRatio || 1));
        refs.canvas.width = Math.round(width * dpr);
        refs.canvas.height = Math.round(height * dpr);
        refs.canvas.setAttribute('aria-label', '画纸画布，' + width + ' 乘 ' + height + ' 像素，使用指针绘制');
        redraw();
        fitCanvas();
      }

      function redraw() {
        if (!refs.ctx) return;
        var g = refs.ctx;
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        P.paintStrokes(g, strokes, width, height, BG);
      }

      function pushHistory() {
        undoStack.push(U.clone(strokes));
        if (undoStack.length > 40) undoStack.shift();
        redoStack = [];
        setSaveControls();
      }

      function updateGalleryActive() {
        if (!refs.gallery) return;
        refs.gallery.querySelectorAll('.draw-card').forEach(function (card) {
          var active = card.getAttribute('data-doc-id') === currentId;
          card.classList.toggle('is-active', active);
          card.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      }

      function showEmpty() {
        currentId = null;
        strokes = [];
        if (refs.empty) refs.empty.hidden = false;
        if (refs.missing) refs.missing.hidden = true;
        if (refs.gallery) refs.gallery.hidden = false;
        if (refs.docTitle) refs.docTitle.textContent = '画纸';
        ctx.setTitle('画纸');
        ctx.setParams({});
        updateToolbar();
        redraw();
      }

      function showMissing(name) {
        currentId = null;
        missingName = name || '这张画纸';
        if (refs.empty) refs.empty.hidden = true;
        if (refs.missing) {
          refs.missing.hidden = false;
          if (refs.missingName) refs.missingName.textContent = missingName;
        }
        if (refs.docTitle) refs.docTitle.textContent = '画纸';
        ctx.setTitle('画纸不在了');
        ctx.setParams({});
        renderGallery();
        updateToolbar();
      }

      function selectDrawing(id) {
        var doc = P.data.getNode(id);
        if (!doc || doc.kind !== 'drawing') {
          showMissing(missingName);
          return;
        }
        if (drawing) finishStroke();
        currentId = doc.id;
        missingName = '';
        strokes = U.clone(Array.isArray(doc.strokes) ? doc.strokes : []);
        width = doc.width || DEFAULT_W;
        height = doc.height || DEFAULT_H;
        hasUnsaved = false;
        undoStack = [];
        redoStack = [];
        if (refs.empty) refs.empty.hidden = true;
        if (refs.missing) refs.missing.hidden = true;
        if (refs.docTitle) refs.docTitle.textContent = doc.name;
        ctx.setTitle(doc.name);
        ctx.setParams({ docId: doc.id });
        renderGallery();
        setupCanvas();
        updateToolbar();
        setSaveControls();
      }

      function createDrawing() {
        try {
          var doc = P.data.createDrawing({ name: '未命名画纸' });
          renderGallery();
          selectDrawing(doc.id);
          P.ui.toast('一张新的画纸铺开了。', { kind: 'info' });
        } catch (err) {
          P.ui.toast('画纸没有建成：' + (err && err.message ? err.message : '未知原因'), { kind: 'error' });
        }
      }

      function saveDrawing(quiet) {
        var doc = currentDoc();
        if (!doc) return;
        var copy = U.clone(strokes);
        var thumb = P.makeDrawingThumb(copy, width, height, 320);
        try {
          P.data.updateNode(doc.id, { strokes: copy, thumb: thumb, width: width, height: height });
          hasUnsaved = false;
        } catch (err) {
          P.ui.toast('画纸没有收好：' + (err && err.message ? err.message : '未知原因'), { kind: 'error' });
          return;
        }
        if (!quiet) updateToolbar();
      }

      function undo() {
        if (!undoStack.length) return;
        redoStack.push(U.clone(strokes));
        strokes = undoStack.pop();
        redraw();
        updateToolbar();
        saveDrawing(true);
      }

      function redo() {
        if (!redoStack.length) return;
        undoStack.push(U.clone(strokes));
        strokes = redoStack.pop();
        redraw();
        updateToolbar();
        saveDrawing(true);
      }

      function clearPaper() {
        if (!strokes.length) return;
        pushHistory();
        strokes = [];
        redraw();
        updateToolbar();
        saveDrawing(true);
        P.ui.toast('画纸已经擦干净了，撤销还可以找回来。', {
          kind: 'info',
          actionLabel: '撤销',
          onAction: undo
        });
      }

      function exportPNG() {
        var doc = currentDoc();
        if (!doc) return;
        var scale = 2;
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        var g = canvas.getContext('2d');
        g.scale(scale, scale);
        P.paintStrokes(g, strokes, width, height, BG);
        var filename = String(doc.name || '画纸').replace(/[\\/:*?"<>|]/g, '-') + '.png';
        if (canvas.toBlob) {
          canvas.toBlob(function (blob) {
            if (blob) P.downloadFile(filename, blob, 'image/png');
            else P.downloadFile(filename, canvas.toDataURL('image/png'), 'image/png');
            P.ui.toast('画纸已经导出为 PNG。', { kind: 'info' });
          }, 'image/png');
        } else {
          P.downloadFile(filename, canvas.toDataURL('image/png'), 'image/png');
          P.ui.toast('画纸已经导出为 PNG。', { kind: 'info' });
        }
      }

      function pointerToCanvas(event) {
        var rect = refs.canvas.getBoundingClientRect();
        return {
          x: U.clamp((event.clientX - rect.left) * (width / rect.width), 0, width),
          y: U.clamp((event.clientY - rect.top) * (height / rect.height), 0, height)
        };
      }

      function drawSegment(from, to, stroke) {
        var g = refs.ctx;
        if (!g) return;
        g.save();
        g.lineCap = 'round';
        g.lineJoin = 'round';
        g.strokeStyle = stroke.eraser ? BG : stroke.color;
        g.lineWidth = stroke.width;
        g.beginPath();
        g.moveTo(from.x, from.y);
        g.lineTo(to.x, to.y);
        g.stroke();
        g.restore();
      }

      function drawDot(point, stroke) {
        var g = refs.ctx;
        if (!g) return;
        g.save();
        g.fillStyle = stroke.eraser ? BG : stroke.color;
        g.beginPath();
        g.arc(point.x, point.y, stroke.width / 2, 0, Math.PI * 2);
        g.fill();
        g.restore();
      }

      function currentBrushWidth() {
        return eraser ? Math.max(10, Math.round(brushSize * 2.5)) : brushSize;
      }

      function beginStroke(event) {
        if (!currentDoc()) return;
        if (event.button !== undefined && event.button !== 0 && event.pointerType === 'mouse') return;
        if (activePointer !== null) return;
        event.preventDefault();
        activePointer = event.pointerId;
        try { refs.canvas.setPointerCapture(event.pointerId); } catch (err) { /* ignore */ }
        if (drawing) finishStroke();
        pushHistory();
        drawing = true;
        var point = pointerToCanvas(event);
        hasUnsaved = true;
        var stroke = {
          points: [point],
          color: color,
          width: currentBrushWidth(),
          eraser: eraser
        };
        strokes.push(stroke);
        lastPoint = point;
        drawDot(point, stroke);
        updateToolbar();
      }

      function continueStroke(event) {
        if (!drawing || event.pointerId !== activePointer) return;
        event.preventDefault();
        var g = refs.ctx;
        if (!g) return;
        var stroke = strokes[strokes.length - 1];
        var events = [];
        if (typeof event.getCoalescedEvents === 'function') {
          try { events = event.getCoalescedEvents(); } catch (err) { events = []; }
        }
        if (!events.length) events = [event];
        events.forEach(function (raw) {
          var point = pointerToCanvas(raw);
          if (lastPoint) drawSegment(lastPoint, point, stroke);
          stroke.points.push(point);
          lastPoint = point;
        });
        updateBrushCursor(event);
      }

      function finishStroke(event) {
        if (!drawing) return;
        if (event && event.pointerId !== undefined && event.pointerId !== activePointer) return;
        if (event && refs.canvas.hasPointerCapture && refs.canvas.hasPointerCapture(event.pointerId)) {
          try { refs.canvas.releasePointerCapture(event.pointerId); } catch (err) { /* ignore */ }
        }
        drawing = false;
        activePointer = null;
        lastPoint = null;
        updateToolbar();
        saveDrawing(true);
      }

      function updateBrushCursorSize() {
        if (!refs.brushCursor || !refs.canvas) return;
        var rect = refs.canvas.getBoundingClientRect();
        var scale = rect.width / width;
        var size = Math.max(3, currentBrushWidth() * scale);
        refs.brushCursor.style.width = size + 'px';
        refs.brushCursor.style.height = size + 'px';
      }

      function updateBrushCursor(event) {
        if (!refs.brushCursor || !refs.board) return;
        var boardRect = refs.board.getBoundingClientRect();
        refs.brushCursor.style.left = (event.clientX - boardRect.left) + 'px';
        refs.brushCursor.style.top = (event.clientY - boardRect.top) + 'px';
        refs.brushCursor.style.display = 'block';
        updateBrushCursorSize();
      }

      function hideBrushCursor() {
        if (refs.brushCursor) refs.brushCursor.style.display = 'none';
      }

      function setColor(next) {
        color = next;
        eraser = false;
        if (refs.eraserBtn) refs.eraserBtn.classList.remove('is-active');
        if (refs.board) refs.board.classList.remove('is-erasing');
        renderColors();
        updateBrushCursorSize();
      }

      function setSize(next) {
        brushSize = next;
        renderSizes();
        updateBrushCursorSize();
      }

      function toggleEraser() {
        eraser = !eraser;
        if (refs.eraserBtn) refs.eraserBtn.classList.toggle('is-active', eraser);
        if (refs.board) refs.board.classList.toggle('is-erasing', eraser);
        renderColors();
        updateBrushCursorSize();
      }

      function renderColors() {
        if (!refs.colorRow) return;
        refs.colorRow.querySelectorAll('.draw-color[data-color]').forEach(function (button) {
          button.classList.toggle('is-active', !eraser && button.getAttribute('data-color').toLowerCase() === color.toLowerCase());
        });
        if (refs.customColorInput) refs.customColorInput.value = color;
        if (refs.customColor) refs.customColor.style.setProperty('--color', color);
        if (refs.customColor) refs.customColor.classList.toggle('is-active', !eraser && COLORS.every(function (c) { return c.hex.toLowerCase() !== color.toLowerCase(); }));
      }

      function renderSizes() {
        if (!refs.sizeRow) return;
        refs.sizeRow.querySelectorAll('.draw-size').forEach(function (button) {
          button.classList.toggle('is-active', Number(button.getAttribute('data-size')) === brushSize);
          button.setAttribute('aria-pressed', Number(button.getAttribute('data-size')) === brushSize ? 'true' : 'false');
        });
      }

      function buildTools() {
        refs.colorRow.innerHTML = '';
        COLORS.forEach(function (entry) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'draw-color';
          button.setAttribute('data-color', entry.hex);
          button.style.setProperty('--color', entry.hex);
          button.setAttribute('aria-label', F('用{color}画', { color: entry.label }));
          button.setAttribute('aria-pressed', 'false');
          button.addEventListener('click', function () { setColor(entry.hex); });
          refs.colorRow.appendChild(button);
        });
        var custom = document.createElement('label');
        custom.className = 'draw-color draw-color--custom';
        custom.setAttribute('title', '调一个自己的颜色');
        custom.style.setProperty('--color', color);
        var customInput = document.createElement('input');
        customInput.type = 'color';
        customInput.value = color;
        customInput.setAttribute('aria-label', '自定义墨色');
        customInput.addEventListener('input', function () { setColor(customInput.value); });
        custom.appendChild(customInput);
        refs.colorRow.appendChild(custom);
        refs.customColor = custom;
        refs.customColorInput = customInput;

        refs.sizeRow.innerHTML = '';
        SIZES.forEach(function (size) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'draw-size';
          button.setAttribute('data-size', String(size.value));
          button.setAttribute('aria-label', F('笔尖{label}，{px} 像素', { label: size.label, px: size.value }));
          button.setAttribute('aria-pressed', 'false');
          var dot = document.createElement('span');
          dot.style.setProperty('--dot', size.dot + 'px');
          button.appendChild(dot);
          button.addEventListener('click', function () { setSize(size.value); });
          refs.sizeRow.appendChild(button);
        });
        renderColors();
        renderSizes();
      }

        refs.empty = root.querySelector('[data-empty]');
        refs.missing = root.querySelector('[data-missing]');
        refs.missingName = root.querySelector('[data-missing-name]');

        refs.brushCursor = root.querySelector('[data-brush-cursor]');
