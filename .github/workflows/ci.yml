name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build artifact is reproducible
        run: python tools/build_page.py --check
      - name: Project gates
        run: python smoke/run_all_checks.py
      - name: Client bundle syntax
        run: node --check client.js
      - name: Package contents
        run: npm pack --dry-run --json
